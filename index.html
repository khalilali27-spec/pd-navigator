FLOWS.start.nodes.s1b = {kind:'end',title:'Assessing whether symptoms affect function',body:`
 <p>The decision is functional. Ask about tasks, not about tremor; use the MDS-UPDRS Part II domains (speech, saliva, swallowing, eating, dressing, hygiene, handwriting, hobbies, turning in bed, tremor interference, getting up, walking and balance, freezing) as a pre-visit form, and ask the partner separately when you can.</p>
 ${steps([
  {t:'Five questions',d:'“What have you stopped doing, or do differently?” · “What takes longer than it used to?” · “Does it show at work — has anyone commented?” · “Any falls or near-falls in six months?” · “If I could fix one thing this month, what would you pick?”',c:'info'},
  {t:'Write down the two or three limited tasks',d:'They are the outcome measure for the next visit and the content of the note.'},
  {t:'If the patient cannot name a problem',d:'Ask about change rather than difficulty (“What took less time a year ago?” “What does your partner do now that you used to do?”), ask the partner separately, give the Part II form, and fall back on clinic proxies: chair rise without arms, 10-metre walk, tap decrement, the same handwritten sentence, cuff buttons, voice. Any abnormal proxy becomes the named target; none abnormal means do not treat yet and record the baseline.',c:'info'},
  {t:'Impaired and willing → start',d:'Levodopa, titrated to those tasks. Review in 4–8 weeks.',c:'good'},
  {t:'Impaired but reluctant → address the fear, not the dose',d:'Levodopa phobia is usually about dyskinesia videos, “it stops working,” or stigma. The facts: complications track disease progression, not years on the drug (LEAP, PD-MED); low and slow is reversible; the goal is function now. Offer a time-limited trial. If they still decline, document it, see them in 3 months, and watch for falls and withdrawal.',c:'warn'},
  {t:'Not impaired → no drug',d:'Exercise prescription, education, referrals; review in 3–6 months. Nothing supports treating the asymptomatic.',c:'info'},
  {t:'Safety overrides preference',d:'Falls, choking, a job at risk, depression tied to disability: the question becomes how, not whether.',c:'bad'}
 ])}
 <p>The full script, with the Part II list, is in <b>After the diagnosis → The “is it affecting your function?” conversation</b>.</p>
 ${pearlsBox(['“Mild” on the exam and “mild” for the patient are different measurements; a surgeon and a retired farmer with the same tremor need different plans.','Spouses report function more accurately than patients do in early disease.'])}`,src:['rawls','thaler','kob','std']};
FLOWS.start.nodes.s1.options.push({label:'How do I assess this?',to:'s1b',hint:'Task-based questions, Part II domains, the reluctant patient'});
FLOWS.start.order.splice(FLOWS.start.order.indexOf('s1a')+1,0,'s1b');
// ---------- After the diagnosis: deep dives (exercise, education, driving, the treat-now conversation) ----------
AFTER.deep = [
 {id:'exercise',h:'Exercise prescription — write it like a drug',src:['kob','rawls','thaler','happy','std'],body:`
  <p>The library supports moderate-to-high-intensity aerobic exercise for motor scores, strength and flexibility alongside it, continuous consistent activity over bursts, and tai chi for balance. The numbers below are the standard prescriptions used to operationalize that (Parkinson’s Foundation / SPARX / PRET / Li 2012 trial parameters) and are tagged as such.</p>
  <div class="tbl"><table><tr><th>Component</th><th>Frequency · Intensity · Time</th><th>Type (examples)</th><th>Why / evidence</th><th>Watch for</th></tr>
  <tr><td><b>Aerobic</b></td><td>3–4 days/week · moderate–vigorous (RPE 13–15; 60–85% HRmax; SPARX used 80–85% HRmax) · 30–40 min</td><td>Brisk walking, treadmill, stationary or tandem cycling, elliptical, swimming (supervised, flotation)</td><td>High-intensity treadmill 4×/week slowed UPDRS-III progression over 6 months (SPARX); improves gait speed, mood, sleep, possibly cognition</td><td>OH and heat; exercise in the on state ~1 h after a dose; cardiac clearance if indicated</td></tr>
  <tr><td><b>Resistance</b></td><td>2–3 days/week · progressive · 1–3 sets × 8–12 reps, 8–10 exercises</td><td>Machines or bands, bodyweight; legs, hips, trunk extensors, shoulders</td><td>Progressive resistance improved UPDRS-III at 24 months (PRET-PD); counters sarcopenia and the flexed posture</td><td>Valsalva in OH; supervise early</td></tr>
  <tr><td><b>Balance / agility</b></td><td>2–3 days/week · 45–60 min</td><td>Tai chi (60 min twice weekly × 24 weeks reduced falls — Li 2012), boxing (Rock Steady), dance (tango), PWR! Moves, LSVT BIG (16 sessions over 4 weeks)</td><td>Tai chi has the best trial evidence for balance and falls in PD; amplitude-based programs retrain movement size</td><td>Supervised when fall risk is present; cueing strategies for freezing</td></tr>
  <tr><td><b>Flexibility / posture</b></td><td>Daily · 10–15 min</td><td>Trunk extension, hip flexors, hamstrings, calves, chest openers, cervical rotation</td><td>Counters camptocormia, neck rotation loss (driving), rigidity-related pain</td><td>—</td></tr>
  <tr><td><b>Dual-task and gait training</b></td><td>Per PT program</td><td>Walking while talking/counting, obstacle courses, big-step and metronome cueing, turning strategies</td><td>Targets freezing and falls, which medication does not fix</td><td>Needs a PD-experienced therapist</td></tr></table></div>
  <p><b>Total target:</b> at least 150 min/week of moderate-to-vigorous activity across the components (Parkinson’s Foundation), built up over 6–8 weeks from whatever the patient does now. Write the prescription in the note and give it to the patient: days, minutes, intensity marker (talk test / RPE / heart-rate zone from a wearable), and the program or class by name.</p>
  <p><b>Practical sequencing.</b> Visit 1: PT referral for baseline and an individualized program; identify one aerobic activity the patient already likes and schedule it. Visit 2: add resistance and a balance class. Every visit after: ask minutes per week the way you ask doses per day. Subjective benefit (mood, flow, stress relief) and objective capacity diverge — ask about both and prescribe what the person will actually keep doing.</p>
  ${pearlsBox(['Patients who swim, cycle or box because they love it out-exercise patients given a handout.','The only exercise that fails is the one that stops: group classes and a fixed weekly slot beat home programs on adherence.','Dyskinesia is not a reason to avoid exercise; orthostatic hypotension and an unsupervised pool are.'])}`},
 {id:'education',h:'Education curriculum — what to cover, visit by visit',src:['kob','katz','rawls','thaler','subota','std'],body:`
  <div class="tbl"><table><tr><th>Visit</th><th>Cover</th><th>Hand over</th></tr>
  <tr><td><b>1 · Diagnosis</b></td><td>What PD is (loss of dopamine-producing cells; a whole-body condition, not just tremor) and what it is not (not ALS, not fatal in itself, not “the end of driving/work”); the course is variable and treatable; exercise starts today; bring a partner next time. Stop there if they are flooded.</td><td>One written “newly diagnosed” resource; your contact route; follow-up in 4–8 weeks</td></tr>
  <tr><td><b>2 · Starting treatment</b></td><td>How levodopa works and why it is not “saved for later”; clock-time schedule; with/without food; expected side effects and what to do; never stop abruptly; keep a medication list and carry it; non-motor symptoms are part of PD (constipation, sleep, mood, smell, bladder) and are worth reporting; driving and work; genetic testing if indicated; research registries.</td><td>Printed schedule with clock times; medication card for the wallet; non-motor questionnaire for next visit</td></tr>
  <tr><td><b>3+ · Living with it</b></td><td>How to recognize wearing-off and what to report; diary; sick-day rules (infection worsens everything — do not stop drugs); hospital and surgery plan (medication timing, NPO bridge, drugs to refuse: haloperidol, metoclopramide); falls and bone health; dental, anesthesia, travel (supply, time zones); care-partner role and burnout; advance care planning normalized; support groups and a PD nurse if available.</td><td>Hospital kit (medication list, timing sheet, “drugs to avoid” card — e.g., the Parkinson’s Foundation Aware in Care kit); fall-prevention sheet; ACP forms</td></tr></table></div>
  <p><b>Printable patient handout.</b> “Living Well with Parkinson’s: Your First Steps” — one double-sided sheet covering what PD is, the exercise prescription, medicine rules, symptoms to report, national and Vermont resources, planning ahead, care partners, and a “my plan” box. <a href="handout/PD_First_Steps_Handout.pdf" target="_blank" rel="noopener">Open the PDF ↗</a></p>
  <p><b>Resources to name (US):</b> Parkinson’s Foundation (helpline 1-800-4PD-INFO, parkinson.org — newly diagnosed guide, Aware in Care hospital kit, exercise recommendations); American Parkinson Disease Association (apdaparkinson.org — local chapters and support groups); Michael J. Fox Foundation (michaeljfox.org — Fox Trial Finder, Fox Insight registry); Davis Phinney Foundation (davisphinneyfoundation.org — “Every Victory Counts” manual); PMD Alliance. Kobylecki points UK patients to Parkinson’s UK’s newly-diagnosed resource; the US equivalents above serve the same purpose.</p>
  <p><b>How to say it.</b> Ask-tell-ask: find out what they already believe (“What do you know about Parkinson’s?”), tell one chunk, check understanding, invite questions. Expect the same questions to recur at new stages — that is normal, not a failure of the first explanation.</p>
  ${pearlsBox(['Patients remember roughly three things from the diagnosis visit. Choose them: it is treatable, exercise matters, you will see me again soon.','The care partner is the person who will notice the hallucination, the gambling and the choking — educate them on purpose, not by accident.'])}`},
 {id:'driving',h:'Driving — how to assess it and what to say',src:['kob','subota','utd','std'],body:`
  <p>Fitness to drive in PD is a composite of motor speed, cognition (attention, visuospatial, executive), vision, sleepiness, fluctuations, medication effects and insight. Clinic assessment is a screen, not a verdict; the caregiver’s opinion and an on-road evaluation carry more weight than the exam.</p>
  ${steps([
   {t:'Ask, every visit',d:'Crashes or near-misses in the past 2 years; citations; getting lost on familiar routes; passengers who decline to ride; self-restriction (no night, no highway); difficulty turning the head or reacting at intersections; dozing at the wheel; driving during off periods.'},
   {t:'Screen the domains',d:'<b>Sleepiness:</b> Epworth (≥10 is a concern; any sleep attack on an agonist is a stop-driving conversation). <b>Cognition:</b> MoCA yearly; Trail Making B (over ~3 min or multiple errors), clock drawing, and the caregiver’s view of judgment. <b>Motor:</b> bradykinesia and neck rotation in the on state; dyskinesia severity. <b>Vision:</b> acuity, fields, contrast sensitivity if available. <b>Psychiatric:</b> hallucinations, impulsivity. <b>Fluctuations:</b> can they reliably drive on?',c:'info'},
   {t:'No flags → may drive, with conditions',d:'Drive in the on state, daylight, familiar routes, short trips; no driving within an hour of a new agonist dose; reassess yearly and after any medication change or new symptom.',c:'good'},
   {t:'Any flag → formal driving evaluation',d:'Occupational-therapy driver-rehabilitation specialist with on-road assessment (clinical plus behind-the-wheel). Flags: cognitive concern, Epworth ≥10 or a sleep attack, hallucinations, significant fluctuations or dyskinesia, caregiver concern, crash or near-miss, new agonist with daytime somnolence.',c:'warn'},
   {t:'Advise stopping',d:'Dementia (PD-D), uncontrolled hallucinations, sleep attacks, failed on-road evaluation, or the caregiver reports frank unsafe driving. Document the advice and the discussion.',c:'bad'},
   {t:'Reporting',d:'Rules vary by state: a few mandate physician reporting of impairing conditions, most — including Vermont — rely on voluntary reports and self-declaration to the DMV. Know your state’s rule, tell the patient to notify the DMV and their insurer as required (Kobylecki), and document what you advised.'}
  ])}
  <p><b>The conversation.</b> Start it at diagnosis, before it is a crisis: “Most people with Parkinson’s drive safely for years. At some point it will change, and I would rather we plan that together than have it decided by an accident.” Name a “co-pilot” stage (partner drives unfamiliar routes, patient drives local daylight trips), map alternatives early, and revisit at each flag. When it is time to stop, say it plainly and in writing, with the reason, and offer the on-road evaluation as the objective arbiter if the patient disagrees.</p>
  ${pearlsBox(['Ask the passenger, not the driver: “Would you let the grandchildren ride with them?”','A new dopamine agonist is a driving conversation: sleep attacks happen without warning and the patient cannot judge their own risk.','Off-period driving is the under-asked question: a patient who times trips to doses has told you something.'])}`},
 {id:'treatnow',h:'The “is it affecting your function?” conversation',src:['rawls','thaler','kob','std'],body:`
  <p>The decision to start medication is functional, not based on the exam. The threshold is any impairment of what the person needs or wants to do — work, dressing, eating, hobbies, walking, sleep, mood, safety — or a risk the person has not yet noticed (falls, near-falls).</p>
  <div class="two"><div><h4>Ask about tasks, not symptoms</h4><p>The MDS-UPDRS Part II domains are a ready-made checklist; give it as a pre-visit form.</p><ul class="tight"><li>Speech — being asked to repeat</li><li>Saliva and drooling</li><li>Chewing and swallowing</li><li>Eating tasks — cutting food, utensils</li><li>Dressing — buttons, zips</li><li>Hygiene — brushing teeth, showering</li><li>Handwriting — legible?</li><li>Hobbies and other activities</li><li>Turning in bed</li><li>Tremor — does it interfere?</li><li>Getting out of bed, a car, a deep chair</li><li>Walking and balance; near-falls</li><li>Freezing</li></ul></div>
  <div><h4>Questions that get the answer</h4><ul class="tight"><li>“What have you stopped doing, or do differently, because of this?”</li><li>“What takes longer than it used to?”</li><li>“Does it show at work? Has anyone commented?”</li><li>“Have you fallen or nearly fallen in the last 6 months?”</li><li>“If I could fix one thing this month, what would you pick?”</li><li>“Is anything here making you avoid people?”</li></ul><p>Document the two or three tasks that are limited; they become your outcome measure at the next visit.</p></div></div>
  ${steps([
   {t:'Function impaired, patient willing',d:'Start levodopa (see Start treatment). Name the target tasks in the note and review them in 4–8 weeks.',c:'good'},
   {t:'Function impaired, patient reluctant (“I don’t want to start the drugs yet”)',d:'Give the facts: the complications come from disease progression, not from years on levodopa (LEAP, PD-MED); starting low and slow is reversible; the goal is function now. Address what they are actually afraid of (dyskinesia videos, “it stops working”, stigma). Offer a time-limited trial. If they still decline: document, respect it, see them in 3 months, and watch for falls and withdrawal.',c:'warn'},
   {t:'Function not impaired',d:'Exercise prescription, education, referrals; no drug. Review in 3–6 months or sooner for any change. There is no evidence that early treatment of asymptomatic disease changes the course.',c:'info'},
   {t:'Diagnosis still uncertain',d:'A levodopa trial can be both treatment and test when symptoms warrant it; otherwise finish the diagnostic work first.'},
   {t:'Safety trumps preference',d:'Falls, choking, a job at risk, or depression tied to disability move the conversation from “whether” to “how.”',c:'bad'}
  ])}
  <h4 style="margin-top:14px">Why the named task matters</h4>
  <p>“Parkinson’s” does not respond to levodopa; bradykinesia, rigidity and tremor do, and balance, freezing while on, speech and swallowing mostly do not. When the patient names the task you can usually tell before you prescribe whether more dopamine will fix it. There is no correct milligram number for a given UPDRS score: the adequate dose is the one at which the named tasks are restored, which is why the patient who is “mild on the exam” can still need treatment and the one who is “moderate” may not. And a written target turns the next visit into a measurement — “last time it was buttons and your signature; how are they now?” — that tells you responded, uptitrate, or not levodopa-responsive, stop escalating. Take the patient’s priority even when it is not yours: the tremor you consider cosmetic may be what keeps them out of restaurants.</p>
  <h4 style="margin-top:14px">When the patient cannot name a problem</h4>
  <p>Common, and the reason matters because it changes what you do.</p>
  <div class="tbl"><table><tr><th>Why</th><th>What it looks like</th><th>What to do</th></tr>
  <tr><td><b>Adapted without noticing</b></td><td>The spouse took over the cooking; they stopped going to the restaurant with the small chairs; the morning routine now takes 90 minutes.</td><td>Ask about <i>change</i>, not difficulty: “What took less time a year ago?” “What does your wife do now that you used to do?” “What have you quietly stopped?” Ask the partner separately — in early disease their account is the more accurate one.</td></tr>
  <tr><td><b>Not attributed to PD</b></td><td>Constipation, soft voice, a dragging foot, slower typing, fatigue — “getting old.”</td><td>The pre-visit Part II form and a non-motor questionnaire do the attribution: they tick the box because it is on the list.</td></tr>
  <tr><td><b>No problem yet</b></td><td>Mild disease, preserved function.</td><td>No drug; exercise prescription; review in 3–6 months. Build the baseline now (below) so the next visit can show change the patient cannot name.</td></tr>
  <tr><td><b>Cannot observe themselves</b></td><td>Apathy, cognitive impairment, anosognosia for dyskinesia or bradykinesia.</td><td>The partner’s report and your examination carry the decision; the question becomes safety and caregiver burden rather than patient-named goals.</td></tr>
  <tr><td><b>Minimizing</b></td><td>Denial, stoicism, fear of the diagnosis, the drugs, or the job.</td><td>Name it gently and come back to it; the function question often gets a real answer on the second or third visit.</td></tr></table></div>
  <p><b>Fallback proxies — pick the target for them.</b> If any is abnormal or has changed, it becomes the named target and the plan proceeds as if the patient had named it.</p>
  <ul class="tight"><li><b>Timed and repeated tasks in clinic:</b> rise from a chair without using the arms; 10-metre walk; finger-tap decrement per limb; the same handwritten sentence each visit; buttoning a cuff; voice volume across the room.</li><li><b>Safety:</b> falls, near-falls, choking, driving incidents.</li><li><b>Occupation:</b> work performance; has anyone commented.</li><li><b>The partner’s three observations.</b></li><li><b>Withdrawal:</b> fewer outings, fewer calls, “not bothering.”</li><li><b>Baseline to record every visit:</b> per-limb bradykinesia and rigidity, timed gait, handwriting sample, voice, MoCA yearly, lying/standing BP, weight.</li></ul>
  <p>If none of these is abnormal, that is the answer: do not treat yet, and the baseline you just built will make the next decision easy.</p>
  ${pearlsBox(['“Mild on the exam” and “mild for the patient” are different measurements; a surgeon with a tremor and a retired farmer with the same tremor need different plans.','Spouses report function more accurately than patients do in early PD; ask them separately if you can.','A written target (“buttons and handwriting”) turns the next visit from “how are you?” into a measurement.','The patient who says “nothing’s wrong” while the spouse looks at the ceiling: that look is the chief complaint.'])}`}
];
// ---------- Phase 4: Adjust therapy (rule engine) ----------
const ADJ = {
  title:'Adjust therapy', intro:'Pick the presenting problem and the modifiers that constrain you; the engine orders the next steps and names what decides each one.',
  problems:[
    {id:'inadequate',l:'Inadequate benefit (never adequately on)',g:'Response'},
    {id:'wearing',l:'Wearing-off (predictable end-of-dose)',g:'Fluctuation'},
    {id:'morning',l:'Early-morning off / nocturnal akinesia',g:'Fluctuation'},
    {id:'delayed',l:'Delayed-on or dose failure',g:'Fluctuation'},
    {id:'sudden',l:'Unpredictable / sudden offs',g:'Fluctuation'},
    {id:'peak',l:'Peak-dose dyskinesia',g:'Dyskinesia'},
    {id:'diphasic',l:'Diphasic dyskinesia (start/end of dose)',g:'Dyskinesia'},
    {id:'offdys',l:'Off-period dystonia (e.g., morning foot)',g:'Dyskinesia'},
    {id:'fog',l:'Freezing of gait / falls',g:'Axial'},
    {id:'se_halluc',l:'Side effect: hallucinations / confusion',g:'Side effect'},
    {id:'se_oh',l:'Side effect: orthostatic hypotension',g:'Side effect'},
    {id:'se_sleep',l:'Side effect: somnolence / sleep attacks',g:'Side effect'},
    {id:'se_icd',l:'Side effect: impulse control disorder',g:'Side effect'},
    {id:'se_nausea',l:'Side effect: nausea',g:'Side effect'},
    {id:'se_edema',l:'Side effect: leg edema / livedo',g:'Side effect'}
  ],
  principles:`<ol class="steps">
   <li><span class="k">01</span><div><div class="t">Name the problem by its position on the curve</div><div class="d">Trough problems (wearing-off, early-morning off, off-dystonia, non-motor off) call for more or longer drug; peak problems (peak-dose dyskinesia, hallucinations, orthostasis, somnolence) call for less or flatter drug. A patient with both has a narrow window and needs a different strategy from either.</div></div></li>
   <li><span class="k">02</span><div><div class="t">Check headroom before you raise a dose</div><div class="d">If a bigger dose has never produced dyskinesia, the window is still wide: the cheapest fix for wearing-off is ½ tablet more per dose. Once any dyskinesia has appeared, raising single doses trades off time for dyskinesia — fractionate or extend instead.</div></div></li>
   <li><span class="k">03</span><div><div class="t">Rule out delivery before adding pharmacology</div><div class="d">Protein meals, constipation, gastroparesis, late doses and swallowed-whole CR tablets all look like “levodopa stopped working.” Timing and the gut are the first adjustment in every fluctuating patient.</div></div></li>
   <li><span class="k">04</span><div><div class="t">Ask whether the symptom is on the curve at all</div><div class="d">Freezing while on, falls, speech, swallowing, cognition and most axial problems do not move with levodopa. Escalating for them buys only the peak-side side effects.</div></div></li>
   <li><span class="k">05</span><div><div class="t">Count the doses</div><div class="d">Five or more levodopa doses a day with two hours off or an hour of troublesome dyskinesia is the signal that oral fractionation has run out — the next step is continuous delivery or DBS, discussed while the patient still has a good best-on state.</div></div></li>
  </ol>`,
  uptitrate:`<p><b>Rule:</b> increase the dose when a <i>levodopa-responsive</i> deficit limits a <i>named function or safety</i> <b>across the whole dose cycle</b>, delivery and adherence are ruled out, and there is headroom (no dyskinesia, hallucinations or symptomatic orthostasis). End-of-dose deficit is wearing-off → fractionate or add an adjunct. Axial-only deficit → therapy, not dose.</p>
  <div class="tbl"><table><tr><th>Trigger</th><th>How you recognize it</th><th>What to do</th></tr>
  <tr><td><b>The honeymoon was never reached</b></td><td>4–6 weeks on a stable dose; target tasks (buttons, handwriting, work, walking speed) still limited; limb bradykinesia/rigidity persist on exam. The dose–response is sigmoid: an inadequate dose looks like a non-response.</td><td>½–1 tablet per dose every 1–2 weeks toward 600 mg/day (tremor toward 1000) before judging; one change at a time; reassess at 2–4 weeks.</td></tr>
  <tr><td><b>Flat progression</b></td><td>The same symptoms creep back at every time point — taps slower at 10 am and 4 pm, exercise capacity down, voice softer, ADLs more effortful — with no on/off pattern.</td><td>Bigger dose per administration (the window is still wide), not more doses.</td></tr>
  <tr><td><b>A new functional demand</b></td><td>New job, return to work, travel, a grandchild, an exercise prescription they cannot complete.</td><td>The threshold is function; when the demand rises the adequate dose rises with it.</td></tr>
  <tr><td><b>A safety signal that passes the responsiveness test</b></td><td>New near-falls, freezing, dysphagia or postural change. Examine pre-dose and 60–90 min post-dose in clinic, or run a 2–4-week ½-tablet trial.</td><td>Limb and gait signs improve on → uptitrate. Only axial signs, unchanged on → PT/SLP; escalation buys hallucinations and orthostasis.</td></tr>
  <tr><td><b>Something is eating the dose</b> (pseudo-progression)</td><td>New iron or calcium timing, high-protein diet, bariatric surgery, constipation or gastroparesis, a partial D2 blocker that crept in (quetiapine dose, metoclopramide from the ED).</td><td>Fix the cause first; uptitrate only if it cannot be removed.</td></tr>
  <tr><td><b>Planned compensation</b></td><td>Tapering an agonist (ICD, somnolence, OH), stopping amantadine (confusion), removing a COMT inhibitor (dyskinesia).</td><td>Schedule the levodopa increase with the taper rather than discovering the gap later.</td></tr>
  <tr><td><b>Tremor called “resistant” at 300 mg/day</b></td><td>Tremor often needs higher doses and lags the rest of the response by weeks.</td><td>Push to ≥1000 mg/day before the label sticks.</td></tr>
  <tr><td><b>Reverse traps</b></td><td>Fatigue, apathy and “depression” can be undertreated bradykinesia. Self-escalation (“I feel better on extra doses”) needs a dopamine-dysregulation check before you ratify it.</td><td>Supervised on/off exam decides; the QUIP-RS screens the second.</td></tr></table></div>
  <p><b>When not to uptitrate:</b> the exam looks worse but function is fine (treat function, not the exam); any dyskinesia, hallucinations or symptomatic OH — there is no headroom, widen the window instead; cognitive impairment with a flat response; symptoms that fail the supervised challenge. Write the target task into the note so the next visit is a measurement, not a conversation.</p>`,
  identify:`<div class="tbl"><table><tr><th>Ask</th><th>Why</th></tr>
  <tr><td>“How do you feel when you wake compared with now?”</td><td>Early-morning off occurs in 44–69% of mild–moderate PD and is missed without asking.</td></tr>
  <tr><td>“How long after a dose does it start working? Does it ever not work?”</td><td>Delayed-on and dose failure (absorption, protein, gastroparesis).</td></tr>
  <tr><td>“Are you at your best right now?” “Does tremor/slowness/walking improve after the next dose?”</td><td>Separates wearing-off from a flat inadequate response.</td></tr>
  <tr><td>“Before the next dose, do you get anxious, slow in thinking, sweaty, or in pain?”</td><td>Non-motor off — same fix as motor wearing-off.</td></tr>
  <tr><td>Diary (on/off/dyskinesia by hour), WOQ-9, wearable (kinetigraph) where available</td><td>Do not assume patients know what on/off means.</td></tr></table></div>`,
  decides:`<div class="tbl"><table><tr><th>Factor</th><th>How it steers the choice</th></tr>
  <tr><td>Which symptom actually limits them</td><td>Treat the one or two most important problems; adjuncts for off time can worsen dyskinesia — be ready to trim other drugs.</td></tr>
  <tr><td>Is the off symptom levodopa-responsive?</td><td>Gait/balance without a clear on–off pattern will not improve with more dose; prioritize PT.</td></tr>
  <tr><td>Non-motor profile</td><td>OH, psychosis, cognitive impairment → avoid agonists; caution with MAO-B inhibitors if psychosis; deprescribe anticholinergics.</td></tr>
  <tr><td>Prior class problems</td><td>ICD or psychosis on an agonist → never re-challenge casually.</td></tr>
  <tr><td>Adherence and pill burden</td><td>Combination tablets, once-daily opicapone/rasagiline, patch (rotigotine) if swallowing is poor.</td></tr>
  <tr><td>GI</td><td>Opicapone can constipate; entacapone can cause diarrhea; constipation itself worsens absorption.</td></tr>
  <tr><td>Interactions</td><td>Avoid fluoxetine/fluvoxamine with rasagiline/safinamide; tramadol, meperidine, dextromethorphan, linezolid with MAO-B inhibitors.</td></tr></table></div>`,
  ebm:`<div class="tbl"><table><tr><th>Adjunct for motor fluctuations (MDS EBM 2025)</th><th>Rating</th></tr>
  <tr><td>Entacapone, opicapone</td><td>Efficacious</td></tr><tr><td>Rasagiline, safinamide</td><td>Efficacious</td></tr>
  <tr><td>Pramipexole IR/ER, ropinirole IR, rotigotine</td><td>Efficacious</td></tr><tr><td>Ropinirole PR, apomorphine infusion</td><td>Likely efficacious</td></tr>
  <tr><td>Levodopa intestinal infusion, subcutaneous infusion</td><td>Likely efficacious</td></tr><tr><td>Controlled-release levodopa, selegiline (as adjunct)</td><td>Insufficient evidence</td></tr>
  <tr><td>Istradefylline, zonisamide (off-label), amantadine (for dyskinesia)</td><td>Positive trials; see notes</td></tr></table></div>`
};

function adjustPlan(i){
  const S=[], F=[]; const src=new Set(['kob','rawls','thaler','std']);
  const fiveTwoOne = (i.doses>=5) + (i.offHours>=2) + (i.dyskHours>=1);
  const noAgonist = i.cog || i.oh || i.age70 || i.icd || i.halluc;
  const push=(t,d,c)=>S.push({t,d,c});
  // generic absorption block
  const absorb = ()=>push('Check delivery before adding drugs','Dose timing vs protein meals (take 30–60 min before or ≥1 h after); constipation (treat — it prolongs transit and worsens response); gastroparesis; iron/calcium timing; adherence; swallowing. Weight loss lowers the dyskinesia threshold.','info');
  const device = ()=>{ if(fiveTwoOne>=2 || (i.doses>=5 && (i.offHours>=2||i.dyskHours>=1))) { F.push('Meets or approaches the 5-2-1 trigger (≥5 levodopa doses/day, ≥2 h off/day, ≥1 h troublesome dyskinesia/day): refer for device-aided therapy evaluation now, before cognitive or axial milestones close the window. See Advanced therapies.'); src.add('surg'); } };
  const halluc = ()=>push('Hallucinations present: reduce before you add','Order of withdrawal: anticholinergics → amantadine → dopamine agonist → MAO-B inhibitor → COMT inhibitor → levodopa last (reduce, rarely stop). Rule out infection, dehydration, sleep deprivation and new sedatives first.','bad');

  switch(i.problem){
  case 'inadequate':
    push('Is the trial adequate?','Titrate to LED ≥600 mg/d (up to 300 mg/dose; 2–3 tablets of 25/100 per dose may be needed). Tremor: ≥1000 mg/d before calling it refractory. Judge on limb bradykinesia and rigidity with a documented scale, not on gait or speech.','good');
    absorb();
    push('Is the target symptom levodopa-responsive at all?','Postural instability, freezing, dysarthria, dysphagia and falls respond poorly even in PD → PT/SLP, not dose escalation. Document which features improved.','warn');
    if(i.halluc||i.cog){ push('Cognition/hallucinations limit the ceiling','Accept partial motor benefit; keep the regimen to levodopa only; clean out anticholinergics, amantadine, agonists.','warn'); }
    push('No response at ≥600 mg/d with at least moderate parkinsonism','MDS absolute exclusion for PD → atypical pathway (skin biopsy/SAA, MIBG, FDG-PET, MRI review; DaT does not help). Taper the ineffective levodopa rather than leaving it running. Refer to a movement specialist.','bad');
    src.add('mds');
    break;
  case 'wearing':
    push('Confirm it is end-of-dose','Diary or targeted questions; note whether the off is motor, non-motor (anxiety, pain, sweating) or both — both respond to the same strategies.','info');
    absorb();
    if(!i.dysk){ push('Adjust levodopa itself first','Shorten the interval (e.g., q4h → q3h, same total) and/or raise individual doses by ½ tablet if no dyskinesia. Fractionation is limited by what the patient can manage — 5+ doses/day is a signal, not a solution.','good'); }
    else { push('Dyskinesia present: fractionate, do not enlarge doses','Smaller doses more often; raising single doses will worsen peak-dose dyskinesia. Expect to trim adjuncts as off time improves.','warn'); }
    if(!i.onCOMT) push('Add a COMT inhibitor','Entacapone 200 mg with each levodopa dose (max 8/day; or combination tablet) — diarrhea, orange urine; opicapone 50 mg at bedtime, ≥1 h from levodopa — once daily, may constipate. Both “efficacious.” Reduce levodopa 10–30% if dyskinesia emerges.','good');
    if(!i.onMAOB) push('Add (or switch to) an MAO-B inhibitor','Rasagiline 1 mg daily; safinamide 50 → 100 mg daily (also helps off-period pain). “Efficacious.” Interaction check: fluoxetine/fluvoxamine, tramadol, meperidine, dextromethorphan, linezolid.','good');
    if(!i.onAgonist && !noAgonist) push('Add a dopamine agonist','Pramipexole ER / ropinirole XL / rotigotine patch — “efficacious,” smooths off time, helps non-motor off (mood). Counsel ICD, somnolence, edema; screen every visit.','good');
    else if(!i.onAgonist) push('Dopamine agonist not advised here','Age ≥70, cognitive impairment, hallucinations, OH or ICD history → skip the agonist tier.','bad');
    push('Convert to extended-release levodopa','Rytary/IPX203 capsules (not Sinemet CR, which has insufficient adjunct evidence and erratic absorption): daily levodopa mg rises on conversion (lower bioavailability); dosed TID–QID. Thaler Case 2-2: ER conversion helped the off but brought dyskinesia.','info');
    push('Istradefylline 20 → 40 mg daily','Adenosine A2A antagonist adjunct for off episodes; monitor for dyskinesia. Zonisamide 25–50 mg is off-label with one positive RCT.','info');
    push('On-demand rescue for breakthrough offs','Apomorphine SC pen 2–6 mg (latency ~8 min; antiemetic pretreatment with trimethobenzamide — never metoclopramide), sublingual apomorphine 10–30 mg, inhaled levodopa 84 mg (up to 5×/day), or a dispersible/crushed IR dose in carbonated water (~25-min latency).','info');
    device();
    break;
  case 'morning':
    push('Treat it as an off','Bedtime long-acting levodopa (CR 50/200 or ER capsule) or rotigotine patch overnight; a dispersible or IR dose taken on waking before rising; apomorphine pen for severe akinesia. Early-morning off is present in 44–69% and is disabling.','good');
    push('Fix what fragments the night','Nocturia (limit fluids 1 h before bed, scheduled toileting), pain, RBD, OH on rising, anxiety — see Non-motor → sleep.','info');
    if(i.dysk) push('Mind morning dyskinesia','Rotigotine/ER at night rarely provokes it; a large IR morning dose can.','warn');
    src.add('subota');
    break;
  case 'delayed':
    push('Empty stomach and protein','Dose 30–60 min before meals; move protein to the evening (protein redistribution diet, 0.8–1.0 g/kg/day total) only if fluctuating and with dietitian support — monitor weight and dyskinesia.','good');
    push('Treat constipation and gastroparesis','PEG daily; address SIBO/gastroparesis if suspected (gastric emptying study if persistent); domperidone where available.','good');
    push('Faster formulations','Crushed IR or dispersible levodopa in carbonated water; avoid CR for daytime dosing; inhaled levodopa or apomorphine for a failed dose.','info');
    push('Persistent dose failures → bypass the gut','Continuous subcutaneous foslevodopa/foscarbidopa, levodopa-carbidopa intestinal gel (PEG-J), or apomorphine infusion — these exist for exactly this problem. Rawls Case 3-3: levodopa q2h with ≥2 dose failures/day and gastric emptying problems → LCIG.','warn');
    device(); src.add('nutr'); src.add('surg');
    break;
  case 'sudden':
    push('Look for a cause before calling it random','Dose failures (gut), stress/anxiety, infection, sleep deprivation, missed doses. Many “unpredictable” offs are delayed-on in disguise.','info');
    push('Prescribe an on-demand rescue','Apomorphine SC pen (fastest, ~8 min) or sublingual film; inhaled levodopa 84 mg. Teach when and how; most patients stop leaving home without one.','good');
    push('Smooth the baseline','COMT inhibitor, ER levodopa, MAO-B inhibitor; agonist if not contraindicated'+(noAgonist?' (contraindicated here)':'')+'.','good');
    push('Sudden offs with dyskinesia on oral therapy = the DBS/infusion conversation','Levodopa-responsive but unmanageable fluctuations despite optimized oral/transdermal therapy are the core indication for device-aided therapy.','warn');
    device(); src.add('surg');
    break;
  case 'peak':
    push('Is it troublesome?','Mild chorea the patient does not mind needs nothing — most prefer on-with-dyskinesia to off. Treat when it impairs function, causes pain, falls or weight loss, or distresses the family.','info');
    push('Lower the peak','Reduce the individual levodopa dose (½ tablet) and give it more often; move away from CR/ER if timing is erratic. Weight loss lowers the dyskinesia threshold — reweigh.','good');
    push('Trim the amplifiers','Reduce or stop MAO-B inhibitor, COMT inhibitor, then agonist (slowly). Expect more off time and compensate with fractionation.','good');
    if(!i.onAmantadine && !(i.halluc||i.cog)) push('Add amantadine','IR 100 mg daily → BID–TID (max 400 mg), or ER capsule 137 → 274 mg at bedtime. Main evidence-based antidyskinetic with long-term data. Watch confusion, hallucinations, livedo, edema, urinary retention; renal dosing.','good');
    else if(!i.onAmantadine) push('Amantadine is risky here','Cognitive impairment or hallucinations → amantadine will likely worsen them; skip to lowering the peak and surgical options.','bad');
    push('Refractory severe dyskinesia','Clozapine (low dose, off-label) can help; severe dyskinesia is an indication for DBS (GPi favored for dyskinesia; STN allows more medication reduction).','warn');
    device(); src.add('surg');
    break;
  case 'diphasic':
    push('Recognize the pattern','Dystonic/choreic movements, often legs, at the beginning and end of each dose — occurs at <i>low</i> levodopa levels. Amantadine helps less than for peak-dose.','info');
    push('Avoid the trough rather than the peak','Larger, less frequent doses or smoother delivery (COMT inhibitor, ER levodopa); the counterintuitive move is sometimes to increase the dose. Avoid repeated small “top-up” doses that keep the patient on the brink.','good');
    push('If disabling','Continuous delivery (infusion) or DBS — diphasic dyskinesia is a marker of a narrow therapeutic window.','warn');
    device(); src.add('surg');
    break;
  case 'offdys':
    push('It is an off','Painful early-morning foot inversion/toe curling = dopamine trough → bedtime long-acting levodopa or rotigotine; dispersible/IR on waking; apomorphine pen.','good');
    push('Focal, persistent dystonia','Botulinum toxin to the involved muscles; safinamide has pain data in fluctuators.','info');
    push('Daytime off-dystonia','Same wearing-off ladder: shorten intervals, COMT/MAO-B inhibitor, agonist if appropriate.','good');
    src.add('utd'); src.add('subota');
    break;
  case 'fog':
    push('Off-FoG or on-FoG?','Freezing only when under-medicated → optimize levodopa (shorten intervals, treat morning off). Freezing while otherwise well on, or worsening with dose increases → do <b>not</b> escalate.','good');
    push('Physical therapy with cueing strategies','Visual/auditory cues, weight-shift and turning strategies, home hazard review. Axial symptoms are relatively levodopa-resistant; PT is the primary therapy.','good');
    push('Check for contributors','Orthostatic hypotension (measure), cognitive decline, sedatives, agonist-related somnolence; anxiety aggravates freezing.','info');
    push('Bone health and falls','FRAX, vitamin D, DXA; people with PD have double the fracture risk. Recurrent falls within 3 years of onset is a red flag for PSP — re-examine eye movements.','warn');
    push('Advanced therapies help FoG only when it is levodopa-responsive','DBS does not reliably improve gait, balance or speech; levodopa-resistant freezing persists after surgery.','warn');
    src.add('surg'); src.add('nutr');
    break;
  case 'se_halluc':
    push('Exclude delirium','Infection (UTI, pneumonia), dehydration, sleep deprivation, new sedatives, anticholinergics, recent medication changes.','good');
    halluc();
    push('Insight preserved and not distressing → observe','Reassure, educate the family, improve lighting and sleep; do not add an antipsychotic for benign presence hallucinations.','info');
    push('Distressing or persistent after reduction → antipsychotic','Pimavanserin 34 mg daily (4–6 weeks to effect; QTc), quetiapine 12.5–25 mg at bedtime → 50–100 mg, or clozapine 6.25–12.5 → 25–50 mg at bedtime (ANC monitoring; probably most effective). All carry a mortality signal — lowest dose, review regularly. Never haloperidol, risperidone, olanzapine, aripiprazole.','warn');
    push('If dementia coexists','Add rivastigmine (patch 4.6 → 9.5 mg/24 h); cholinesterase inhibitors help neuropsychiatric features more than cognition.','info');
    src.add('utd'); src.add('wein'); src.add('subota');
    break;
  case 'se_oh':
    push('Measure and define','≥20/10 mmHg drop within 3 min of standing; symptoms include lightheadedness, fatigue, cognitive slowing, coat-hanger pain, unexplained falls. Treat symptomatic OH only.','info');
    push('Deprescribe first','Antihypertensives, diuretics, alpha-blockers (tamsulosin), TCAs, trazodone, nitrates, sildenafil. Then reduce dopaminergic load starting with the agonist; levodopa itself can worsen OH.','good');
    push('Nonpharmacologic measures','Water 1.5–2.5 L/day (a rapid 0.5 L bolus raises BP transiently), salt 6–10 g/day unless heart/kidney failure, head-of-bed elevation (up to 45°), waist-high compression or abdominal binder, smaller meals, counter-maneuvers, avoid heat and alcohol.','good');
    push('Pharmacologic ladder','Midodrine 2.5–10 mg up to TID, daytime only (last dose ≥4 h before bed); droxidopa 100–600 mg TID; fludrocortisone 0.05–0.2 mg each morning (effect after ≥7 days; potassium, edema; avoid in heart failure). Pyridostigmine 30–60 mg BID–TID and atomoxetine are off-label adjuncts. Monitor supine hypertension; avoid lying flat after doses.','warn');
    src.add('utd'); src.add('subota');
    break;
  case 'se_sleep':
    push('Agonist first','Excessive daytime sleepiness and sleep attacks are agonist-driven more than levodopa-driven: reduce or stop the agonist (slow taper) and compensate with levodopa.','good');
    push('Driving','Ask at every visit; advise against driving while sleep attacks persist.','bad');
    push('Look for other causes','Nocturnal sleep fragmentation, OSA (common in PD — sleep study if snoring/witnessed apneas), sedatives, postprandial hypotension masquerading as sleepiness, depression.','info');
    push('Modafinil is a modest option','RCT negative for the primary outcome; select cases only. Methylphenidate has small fatigue data.','info');
    src.add('utd'); src.add('subota');
    break;
  case 'se_icd':
    push('Screen properly','QUIP-RS; ask with the care partner present — patients under-report. ~14% prevalence, 2–3× on agonists; &gt;40% after 5 years of agonist use.','info');
    push('Taper the agonist slowly toward levodopa monotherapy','Reduce stepwise (e.g., 25% every 2–4 weeks); compensate with levodopa. Also stop amantadine/MAO-B inhibitor if contributing. Abrupt stop risks dopamine agonist withdrawal syndrome.','good');
    push('Warn about DAWS','Anxiety, dysphoria, fatigue, insomnia, drug craving, diaphoresis, pain; does <b>not</b> respond to levodopa or antidepressants; may take 6–12 months; may require cautious low-dose agonist re-introduction.','warn');
    push('Protect the patient','Caregiver control of finances and medications, blocked cards, CBT targeted to ICD; naltrexone has early signals.','info');
    push('If motor control collapses without the agonist','DBS allows major dopaminergic reduction; STN-DBS can itself worsen ICD/apathy — GPi may be preferred.','info');
    src.add('wein'); src.add('subota');
    break;
  case 'se_nausea':
    push('Carbidopa and timing','Keep carbidopa ≥75 mg/day; add carbidopa 25 mg with doses; take with a light non-protein snack initially.','good');
    push('Antiemetics that are safe','Domperidone 10 mg TID (ECG, ≤30 mg/d, shortest course), ondansetron, trimethobenzamide. <b>Never</b> metoclopramide, prochlorperazine, promethazine.','bad');
    push('If on an agonist','Nausea is common during titration — slow the titration or switch to the patch.','info');
    src.add('subota');
    break;
  case 'se_edema':
    push('Which drug?','Dependent edema: dopamine agonists and amantadine. Livedo reticularis: amantadine (may need dose reduction or stop).','good');
    push('Reduce or switch','Taper the agonist (slowly) or amantadine; compensate with levodopa; exclude cardiac/renal causes and fludrocortisone contribution.','good');
    src.add('rawls');
    break;
  }
  if(i.halluc && !['se_halluc'].includes(i.problem)) { halluc(); src.add('utd'); }
  if(i.oh && !['se_oh'].includes(i.problem)) F.push('Orthostatic hypotension flagged: avoid adding an agonist; measure lying/standing BP after every change; see Non-motor → OH.');
  if(i.cog && !['se_halluc'].includes(i.problem)) F.push('Cognitive impairment flagged: no anticholinergics, avoid amantadine and agonists, keep the regimen simple; DBS becomes unfavorable — infusion therapies remain possible.');
  if(i.icd) F.push('ICD history: do not re-challenge with an agonist; screen every visit.');
  return {steps:S, flags:F, src:[...src]};
}
// ---------- Phase 5: Non-motor symptoms ----------
const NMS = {
  title:'Non-motor symptoms', intro:'98% of patients have non-motor symptoms (mean seven) and 15–72% never volunteer them. Screen with MDS-UPDRS Part I or NMSQuest before the visit, treat the one or two that matter most, and ask first whether the symptom fluctuates with doses.',
  rule:'<b>Step 0 for every symptom:</b> does it track the dosing cycle (non-motor off)? If yes, optimize dopaminergic therapy first — it may be the only intervention needed. Exceptions where dopaminergic drugs are the <i>cause</i>: psychosis, ICD, OH, somnolence, edema.',
  items:[

   second:'Pramipexole (“clinically useful,” especially with suboptimal motor control; weigh ICD risk). Nortriptyline/desipramine (likely efficacious; TCAs worsen OH, constipation, cognition). Bupropion is used but thin on evidence; least likely to worsen RLS/RBD. ECT for severe/refractory depression (also transiently helps parkinsonism).',

  {id:'psy',g:'Neuropsychiatric',n:'Hallucinations / psychosis',fluct:'Dose-related. Begins as sense of presence, passage hallucinations, illusions (minor phenomena up to 45%); visual hallucinations 15%; cumulative psychosis up to 60%. Strongest predictor of institutionalization.',
   first:'Exclude delirium (infection, dehydration, sleep deprivation, new sedatives). Withdraw in order: anticholinergics → amantadine → dopamine agonist → MAO-B inhibitor → COMT inhibitor → levodopa last (reduce, rarely stop). Benign hallucinations with insight: educate, light the room, fix sleep — observe.',
   second:'Pimavanserin 34 mg every morning (only FDA-approved agent; 4–6 weeks; QTc; CYP3A4 interactions) · quetiapine 12.5–25 mg qhs → 50–100 mg (NICE first-line in practice; trials negative; sedation, OH) · clozapine 6.25–12.5 mg qhs → 25–50 mg (most effective; ANC monitoring; agranulocytosis 1–2%). Add rivastigmine if dementia coexists. ECT if refractory.',

  {id:'cog',g:'Neuropsychiatric',n:'Cognitive impairment / dementia',fluct:'Not dopaminergic. PD-MCI in up to one-third; dementia in most long term (~half within 10 years). Dementia within 1 year of parkinsonism = DLB by convention (MDS criteria do not treat dementia as exclusion).',
   first:'Annual MoCA; deprescribe anticholinergics (bladder antimuscarinics, TCAs, antihistamines, sleep aids), benzodiazepines, amantadine, agonists; treat OH, OSA, vascular risk, depression. Cognitive and physical training give short-term gains.',
   second:'Dementia: rivastigmine patch 4.6 → 9.5 (→13.3) mg/24 h or oral 1.5 → 6 mg BID (FDA-approved; modest effect; helps hallucinations/fluctuations more than cognition); donepezil 5–10 mg or galantamine 8–24 mg are alternatives. Memantine: no clear benefit. No drug works for PD-MCI.',

  {id:'con',g:'Autonomic',n:'Constipation',fluct:'Not dopaminergic, but it worsens levodopa absorption and off time — treating it is a motor intervention.',
   first:'Fluid 1.5–2 L, fibre 25–30 g/day (avoid psyllium in dysphagia/gastroparesis), activity, kiwi/prunes, probiotics with prebiotic fibre. Polyethylene glycol 17 g once or twice daily.',
   second:'Lubiprostone 8–24 µg BID (nausea; reserve for failures), linaclotide/prucalopride in practice; senna as needed; magnesium oxide (limited PD data).',
   avoid:'Opicapone can constipate; anticholinergics; opioids. Metoclopramide is contraindicated; domperidone for nausea only.',

  {id:'uri',g:'Autonomic',n:'Urinary urgency / nocturia',fluct:'Early urgency may improve with dopaminergic optimization; nocturia drives nocturnal fluid restriction and OH.',
   first:'Exclude infection, prolapse, prostatic obstruction and retention (post-void residual) — retention points toward MSA. Timed voiding, pelvic floor exercises, limit evening fluids, treat constipation.',
   second:'Mirabegron 25–50 mg daily (preferred; BP) · trospium or solifenacin 5–10 mg (antimuscarinic — avoid in cognitive impairment; trospium least CNS penetration) · refractory: intravesical botulinum toxin, intermittent self-catheterization.',

   refer:'Sleep medicine for persistent somnolence; driving assessment when uncertain.',src:['utd','subota','kob','thaler']},
  {id:'pain',g:'Somatic',n:'Pain',fluct:'Two-thirds of patients. First question: does it vary with doses? Off-period musculoskeletal and dystonic pain respond to dopaminergic optimization.',
   first:'Classify: musculoskeletal/myofascial, dystonic (off or peak-dose), radicular/neuropathic, central. Dopaminergic adjustment for fluctuating pain; PT, stretching, posture; safinamide 100 mg has pain data in fluctuators.',
   second:'Neuropathic: gabapentin 100–900 mg TID, pregabalin 50–150 mg BID, duloxetine 30–60 mg; low-dose amitriptyline (anticholinergic). Focal dystonia: botulinum toxin. Musculoskeletal: acetaminophen, NSAIDs with caution; opioids only with close monitoring (constipation, falls, sedation). Work up neuropathy (B12/MMA/homocysteine, glucose, SPEP) — more common in PD and with levodopa.',
   avoid:'Cannabis (negative RCT); escalating opioids for undertreated off-pain.',
   refer:'Pain clinic for radicular/central pain; botulinum toxin injector; dietitian for B12/folate.',src:['utd','thaler','subota','nutr']},
  {id:'fat',g:'Somatic',n:'Fatigue',fluct:'Undertreated bradykinesia presents as fatigue; also EDS, depression, OH, hypothyroidism, medication effect.',
   first:'Fix the treatable contributor (depression, sleep, OH, anemia, thyroid, undertreatment); graded exercise.',
   second:'Rasagiline has fatigue data; methylphenidate 10 mg TID briefly in selected patients; modafinil ineffective.',
   avoid:'Attributing fatigue to PD before excluding depression and OSA.',
   refer:'Sleep medicine if sleepiness dominates.',src:['utd','thaler']},
  {id:'sex',g:'Autonomic',n:'Sexual dysfunction',fluct:'>50% in early PD; reduced desire/arousal; ED, premature ejaculation; hypersexuality signals ICD.',
   first:'Review mood, agonists (hypersexuality), antidepressants, autonomic status; counseling/couples therapy.',
   second:'Sildenafil 25–100 mg PRN 1 h before (monitor OH; no nitrates); tadalafil/vardenafil; lubricants/hormonal therapy in women; bremelanotide limited data.',
   avoid:'PDE5 inhibitors with significant OH or nitrates; in MSA, ED rarely responds and hypotension can be severe.',
   refer:'Sex therapist; urology/gynecology.',src:['rawls','thaler','subota','utd']},
  {id:'swt',g:'Autonomic',n:'Hyperhidrosis / thermoregulation',fluct:'Drenching sweats often occur in off or at peak dose — optimize dopaminergic therapy.',
   first:'Hydration, clothing/environment, treat fluctuations.',
   second:'Topical glycopyrrolate or oxybutynin; focal botulinum toxin for severe focal hyperhidrosis.',
   avoid:'SSRIs/SNRIs can worsen sweating.',
   refer:'Dermatology for refractory focal hyperhidrosis.',src:['subota','thaler']},
  {id:'wt',g:'Nutrition',n:'Weight loss / malnutrition',fluct:'Dyskinesia burns calories; weight loss lowers the dyskinesia threshold (vicious cycle) and accelerates 3–4 years after diagnosis.',
   first:'Weigh every visit; MUST screen; ask about dysphagia, early satiety, reflux, bowel habit, depression, ICD-related eating. Malnutrition = BMI &lt;18.5 or unintended loss &gt;5–10% over 3–6 months.',
   second:'Dietitian referral at any detected loss, sarcopenia, or shift to overweight/obesity (post-DBS); adjust dopaminergic doses if dyskinesia drives loss; Mediterranean pattern with weight monitoring.',
   avoid:'Low-protein diets (not recommended); ketogenic diets (tremor/dyskinesia, weight loss, LDL); supplements without a deficiency (CoQ10 is non-efficacious).',
   refer:'Dietitian; SLP if dysphagia; palliative care if persistent loss in late disease.',src:['nutr','kob','katz']},
  {id:'bone',g:'Nutrition',n:'Bone health and B12',fluct:'Falls + low vitamin D + low BMD → double the fracture risk. Levodopa raises homocysteine and lowers B12/folate.',
   first:'Vitamin D level and supplementation; FRAX; DXA when risk is raised; fall-prevention PT. Check B12 (with MMA/homocysteine if borderline) and folate, especially with neuropathy or on infusion therapy.',
   second:'Treat deficiencies; calcium needs may exceed general recommendations in low BMD; standard osteoporosis therapy when indicated.',
   avoid:'Ignoring a first fragility fracture.',
   refer:'Dietitian; primary care/endocrinology for osteoporosis management.',src:['nutr','kob','thaler']}
  ]
};
// ---------- Phase 6: Advanced (device-aided) therapies ----------
FLOWS.advanced = {
  title:'Advanced therapies', intro:'When oral therapy has run out of road: who to refer, when, and which device fits which patient.',
  start:'a1', order:['a1','a1x','a2','a2x','a3','a3a','a3b','a3c','a3d','a4'],
  nodes:{
  a1:{kind:'q',title:'Is there a core indication?',body:`<ul class="tight"><li><b>Levodopa-responsive motor fluctuations</b> despite optimized oral/transdermal therapy (typically ≥5 levodopa doses/day ± adjuncts) — or very disabling off occupying &gt;20% of the waking day</li><li><b>Troublesome dyskinesia</b> despite adjustment of oral medication</li><li><b>Refractory, disabling PD tremor</b></li></ul><p>Screening shortcut: <b>5-2-1</b> — ≥5 levodopa doses/day, ≥2 h off/day, ≥1 h troublesome dyskinesia/day. Identify candidates in the complex phase <i>before</i> cognitive or axial milestones close the window.</p>`,
    options:[{label:'Yes — one or more present',to:'a2'},{label:'No — oral options not yet exhausted',to:'a1x'}],src:['kob','surg','rawls']},
  a1x:{kind:'end',title:'Optimize first, but start the conversation',body:steps([
    {t:'Work the Adjust ladder',d:'Fractionation, COMT and MAO-B inhibitors, agonist where appropriate, ER levodopa, rescue therapy, amantadine for dyskinesia.'},
    {t:'Introduce “smart therapies” early',d:'Discuss DBS and infusion options with patient and caregiver well before they are needed; de-stigmatize the language.'},
    {t:'Keep a diary going',d:'Hours off, hours with troublesome dyskinesia, dose count — the referral threshold is numeric.'}
  ]),src:['kob','surg']},
  a2:{kind:'q',title:'Any relative contraindication to all device-aided therapy?',body:`<ul class="tight"><li>Atypical parkinsonism (MSA, PSP, CBS, vascular, drug-induced) — generally unfavorable outcomes</li><li>Severe refractory gait disturbance and falls that do not improve in the best on state</li><li>Uncontrolled psychosis or severe depression</li><li>Poor levodopa response (except tremor as the target)</li></ul>`,
    options:[{label:'None — proceed to candidacy',to:'a3'},{label:'Yes',to:'a2x'}],src:['kob','surg']},
  a2x:{kind:'end',title:'Not a device candidate now',body:steps([
    {t:'Atypical syndrome',d:'Confirm with biomarkers if useful; redirect to symptomatic and supportive care; no surgical therapy.'},
    {t:'Psychiatric instability',d:'Treat and stabilize first (see Non-motor); re-evaluate in 3–6 months.'},
    {t:'Levodopa-resistant disability',d:'Device therapies replicate the best on state — if the best on state is disabled, they will not help. Shift to Late stage planning.',c:'warn'}
  ]),src:['surg','kob']},
  a3:{kind:'q',title:'Candidacy — which profile?',body:`<p><b>Common pre-op requirements:</b> clinically probable idiopathic PD; duration usually ≥4–5 years (to exclude atypicals); documented levodopa response — <b>≥33% improvement in MDS-UPDRS III</b> on a supervised levodopa/apomorphine challenge (practical protocol: 12 h off, then 1.5× the usual morning dose); brain MRI and neuropsychological testing within 1 year; psychiatry review; medical clearance; multidisciplinary team (neurologist, functional neurosurgeon, psychiatrist, neuropsychologist, PT/OT/SLP).</p>
  <p><b>The levodopa rule:</b> what improves with levodopa improves with DBS; what does not (gait, balance, speech, cognition, levodopa-resistant freezing) does not. The one exception is <b>rest tremor</b>, which responds to DBS/FUS even when levodopa-refractory.</p>`,
    options:[{label:'Cognitively intact, fluctuations/dyskinesia, accepts an implant',to:'a3a'},{label:'Tremor is the main problem',to:'a3b'},{label:'Cognitive impairment or dementia, or ≥80 with comorbidity',to:'a3c'},{label:'Dose failures / erratic absorption dominate',to:'a3d'}],src:['surg','rawls','std']},
  a3a:{kind:'end',title:'Deep brain stimulation',body:steps([
    {t:'Target',d:'STN: greater medication reduction, risk of worse depression/anxiety/ICD/apathy, speech. GPi: better direct antidyskinetic effect, less neuropsychiatric risk, less medication reduction. Long-term motor outcomes are similar — choose by what you need (medication reduction vs dyskinesia/neuropsychiatric safety).',c:'good'},
    {t:'Expected benefit',d:'~4 h more good on time/day; improved off time in ~69% and dyskinesia in ~62% (STN); effective in early-onset PD within 1–2 years of fluctuations (EARLYSTIM-type patients ~age 50).'},
    {t:'Risks',d:'Serious events (hemorrhage, infection, cognitive decline, worsened gait/mood) ~1–5% combined; hardware issues; months of programming (visits over ~6 months, then every 3–6 months).'},
    {t:'GBA1 carriers',d:'DBS works for motor symptoms but discuss the possibility of accelerated cognitive decline.',c:'warn'},
    {t:'After surgery',d:'Reduce dopaminergic drugs gradually (watch DAWS, apathy); keep exercising; expect axial symptoms to progress regardless.'}
  ])+callout('info','Rawls (surgical) Case 3-1','52-year-old, young-onset PD, 4 years, bilateral levodopa-refractory tremor, no comorbidity → DBS preferred over FUS because the problem is bilateral and will need titration over years.'),src:['surg','rawls','thaler']},
  a3b:{kind:'end',title:'Refractory tremor: DBS vs focused ultrasound',body:steps([
    {t:'Bilateral or axial (head/voice) tremor, younger, accepts implant → DBS (VIM or STN)',d:'Adjustable, bilateral, reversible.',c:'good'},
    {t:'Unilateral dominant-hand tremor, declines implant, surgical risk or visit burden prohibitive → MR-guided focused ultrasound (VIM)',d:'FDA-approved unilateral only; irreversible, not adjustable. Contralateral hand tremor −47% at 1 year; gait disturbance 36% and sensory disturbance 38% early, persisting in 9% and 14%. Needs MRI compatibility, ability to lie flat and communicate, no claustrophobia.'},
    {t:'Before referral',d:'Confirm the tremor really is levodopa-refractory (≥1000 mg/d trial), and that it is the disabling symptom rather than bradykinesia.'}
  ])+callout('info','Rawls Case 3-2','65-year-old, 5 years tremor-predominant PD refractory to levodopa, agonists and anticholinergics, unilateral dominant-hand tremor, refuses an implant → FUS (or radiosurgical) thalamotomy.'),src:['surg','kob']},
  a3c:{kind:'end',title:'Cognitive impairment, dementia, advanced age',body:steps([
    {t:'DBS and lesioning are generally contraindicated with dementia',d:'Pronounced executive/memory impairment predicts post-operative cognitive worsening; many centers are reluctant at ≥80 years.',c:'bad'},
    {t:'Infusion therapies remain possible',d:'Levodopa-carbidopa intestinal gel (PEG-J, 16 h/day) or continuous subcutaneous foslevodopa/foscarbidopa (24 h) when fluctuations are levodopa-responsive and the patient or a caregiver can manage the pump. LCIG: off time −1.9 h/day, on without troublesome dyskinesia +1.9 h/day vs oral; hyperkinesia, hallucinations, PEG-J complications, B12/homocysteine-related neuropathy (monitor and supplement).',c:'good'},
    {t:'Apomorphine infusion',d:'Reduces off by ~2 h/day; skin nodules, somnolence, hallucinations, OH — less suitable with cognitive impairment or marked OH.'},
    {t:'Or step back',d:'If the best on state is already limited by cognition and axial disability, the honest move is simplification and supportive care (see Late stage).',c:'warn'}
  ])+callout('info','Thaler Case 2-2 and Rawls Case 3-3','68-year-old with MCI on neuropsych testing and a GBA variant chose LCIG over DBS; 83-year-old with cognitive impairment, prior stroke and a non-MRI-compatible AICD, levodopa q2h with ≥2 dose failures/day, son manages medications → LCIG.'),src:['surg','thaler','rawls']},
  a3d:{kind:'end',title:'Erratic absorption and dose failures',body:steps([
    {t:'Continuous delivery is the mechanism-matched fix',d:'Subcutaneous foslevodopa/foscarbidopa (24-h, no surgery; infusion-site reactions) or LCIG (bypasses the stomach). Both “likely efficacious” for fluctuations; both decrease pill burden.',c:'good'},
    {t:'DBS also smooths fluctuations',d:'If cognitively intact and otherwise a candidate, DBS is the option with the largest effect but the highest potential for adverse effects.'},
    {t:'Keep working the gut meanwhile',d:'Constipation, gastroparesis, protein timing, dispersible formulations.'}
  ]),src:['surg','thaler','rawls']},
  a4:{kind:'end',title:'Choosing among options (decision matrix)',body:`<div class="tbl"><table><tr><th></th><th>DBS</th><th>Focused ultrasound</th><th>LCIG (PEG-J)</th><th>SC foslevodopa</th><th>SC apomorphine</th></tr>
  <tr><td>Helps levodopa-resistant tremor</td><td>Yes</td><td>Yes (unilateral)</td><td>No</td><td>No</td><td>No</td></tr>
  <tr><td>Bilateral disease</td><td>Yes</td><td>One side only</td><td>Yes</td><td>Yes</td><td>Yes</td></tr>
  <tr><td>Cognitive impairment</td><td>Contraindicated</td><td>Contraindicated</td><td>Usable with caregiver</td><td>Usable with caregiver</td><td>Caution (hallucinations)</td></tr>
  <tr><td>Marked OH</td><td>Neutral</td><td>Neutral</td><td>Neutral</td><td>Neutral</td><td>Relative contraindication</td></tr>
  <tr><td>Severe speech disturbance</td><td>May worsen (STN)</td><td>May worsen</td><td>Neutral</td><td>Neutral</td><td>Neutral</td></tr>
  <tr><td>Needs MRI compatibility</td><td>Yes</td><td>Yes</td><td>No</td><td>No</td><td>No</td></tr>
  <tr><td>Reversible / adjustable</td><td>Yes / yes</td><td>No / no</td><td>Yes / yes</td><td>Yes / yes</td><td>Yes / yes</td></tr>
  <tr><td>Main burdens</td><td>Surgery, programming visits, hardware</td><td>Lesion side effects (gait, sensory)</td><td>PEG-J care, tube problems, B12/neuropathy</td><td>Skin reactions, 24-h device</td><td>Nodules, somnolence, nausea</td></tr>
  <tr><td>Medication reduction</td><td>Large (STN)</td><td>Modest</td><td>Often replaces oral levodopa by day</td><td>Replaces oral levodopa</td><td>Partial</td></tr></table></div>
  <p>No head-to-head RCTs exist; DBS has the largest effect and the highest potential for adverse effects. Combinations (DBS + infusion) are used.</p>`,src:['surg','thaler','rawls','kob']}
  }
};

// ---------- Phase 7: Late stage and palliative care ----------
FLOWS.late = {
  title:'Late stage & palliative', intro:'Recognizing the palliative phase, deciding what to change and what to leave alone, and setting expectations with the family.',
  start:'l1', order:['l1','l1a','l2','l2a','l2b','l3','l4','l5','l6','l7'],
  nodes:{
  l1:{kind:'q',title:'Where in the course is this patient?',body:`<p>Four stages after the prodrome: early (diagnosis), stable (maintenance), <b>complex</b> (motor complications, polypharmacy, device candidates) and <b>late/palliative</b> — a predominance of levodopa-resistant axial symptoms (frequent falls, severe dysphagia) with worsening neuropsychiatric features (dementia, psychosis). Psychosis is the particular driver of institutionalization.</p><p>Poor 5-year outcome (death, postural instability or dementia) is predicted by older age, higher axial motor disability and reduced category fluency. The diffuse-malignant subtype (older onset, early RBD and OH, worse motor and non-motor) progresses fastest.</p>`,
    options:[{label:'Complex stage — still responsive, fluctuating',to:'l1a'},{label:'Late stage — axial and neuropsychiatric problems dominate',to:'l2'}],src:['kob','katz']},
  l1a:{kind:'end',title:'Complex stage: the palliative lens still applies',body:steps([
    {t:'Palliative care is not end-of-life care',d:'WHO: applicable early, alongside active therapy. A 2020 RCT in PD and related disorders improved quality of life, symptom burden, advance care planning and caregiver burnout — with motor scores improving in the palliative arm without medication changes.'},
    {t:'Normalize advance care planning now',d:'Health-care proxy, values, preferred place of care; most people with PD want this early, and dementia makes it harder later.',c:'good'},
    {t:'Keep optimizing',d:'Device-aided therapies belong to this stage — see Advanced therapies.'},
    {t:'Screen the caregiver',d:'Burnout, anticipatory grief, finances; social work referral.'}
  ]),src:['katz','kob']},
  l2:{kind:'q',title:'Triggers for palliative-care involvement',body:`<ul class="tight"><li>Recurrent infections, especially aspiration pneumonia</li><li>Dysphagia with weight loss or texture modification</li><li>Persistent unintended weight loss (&gt;5–10% in 3–6 months; BMI &lt;18.5)</li><li>Dementia and/or psychosis</li><li>Recurrent falls and fractures; wheelchair dependence; H&amp;Y 4–5</li><li>Recurrent hospitalization (“rehabbed to death” cycle)</li><li>Caregiver crisis</li></ul>`,
    options:[{label:'One or more present',to:'l2a'},{label:'Not yet',to:'l2b'}],src:['kob','katz','nutr']},
  l2a:{kind:'end',title:'Act on the trigger',body:steps([
    {t:'Refer to palliative (“supportive”) care alongside neurology',d:'The word “supportive” is accepted by clinicians and families far more readily than “palliative,” for identical services. Telemedicine extends access.',c:'good'},
    {t:'Hold a REMAP conversation',d:'See the communication node. One 20-minute conversation measurably reduces anxiety and depression.'},
    {t:'Hospice eligibility check',d:'Expected prognosis ≤6 months — in PD typically on failure-to-thrive grounds (cachexia, recurrent aspiration, rapid functional decline). Katz Case 12-1: MSA-P, 30% weight loss in 6 months, BMI 17, two aspiration pneumonias → hospice; family moved a wedding forward.',c:'info'},
    {t:'Simplify the regimen',d:'See “What to change / what to leave alone.”'},
    {t:'Place of death',d:'Most want home; most die in hospital or nursing home; only ~4% of US PD deaths involve hospice; 97% of in-hospital PD deaths had no documented ACP discussion. A documented plan raises the chance of dying at home with hospice.'}
  ]),src:['katz','kob']},
  l2b:{kind:'end',title:'Prepare, do not wait',body:steps([
    {t:'Anticipatory guidance',d:'Caregivers of people with Lewy body disease consistently report not being told what late disease would look like. Describe falls, swallowing, cognition and hallucinations as things that may come, and what you will do about each.'},
    {t:'Document ACP and proxy',d:'Code status, hospitalization preferences, feeding-tube preferences while capacity is intact.'},
    {t:'Swallow surveillance, bone health, caregiver support',d:'Prevent the first aspiration and the first fracture.'}
  ]),src:['katz','kob']},
  l3:{kind:'end',title:'What to change — and what to leave alone',body:`<div class="tbl"><table><tr><th>Situation</th><th>Do</th><th>Don’t</th></tr>
  <tr><td>Mild dyskinesia the patient does not mind</td><td>Nothing</td><td>Reduce levodopa and create off time</td></tr>
  <tr><td>Hallucinations with insight, not distressing</td><td>Educate, light, sleep, trim anticholinergics/amantadine/agonist</td><td>Start an antipsychotic</td></tr>
  <tr><td>Falls and freezing while on</td><td>PT, cueing, home safety, bone protection, OH check</td><td>Add more levodopa or an agonist</td></tr>
  <tr><td>Dementia with a complex regimen</td><td>Taper anticholinergics → amantadine → agonist → MAO-B → COMT; keep levodopa, fewer scheduled doses</td><td>Add new dopaminergic adjuncts; stop levodopa abruptly</td></tr>
  <tr><td>Dysphagia</td><td>Dispersible/crushed IR, rotigotine patch; time meals to on; SLP</td><td>Assume a PEG prevents aspiration or prolongs life in advanced dementia</td></tr>
  <tr><td>Hospital admission / NPO</td><td>Levodopa on time; NG or dispersible; rotigotine patch bridge dosed by LED (patch mg ≈ oral LED ÷ 30, usually capped at 8–16 mg/24 h), titrated to effect</td><td>Hold all PD drugs — risk of parkinsonism-hyperpyrexia syndrome</td></tr>
  <tr><td>End of life</td><td>Continue levodopa (patch/dispersible) while it eases rigidity and comfort; glycopyrrolate for secretions; low-dose quetiapine for agitation; opioids for pain/dyspnea</td><td>Chase on/off; use haloperidol or metoclopramide</td></tr>
  <tr><td>“One more adjustment” reflex</td><td>Ask what the two or three most important problems are to the patient and caregiver; treat those</td><td>Treat every symptom at once — effects confound each other</td></tr></table></div>`,src:['kob','katz','utd','subota','std']},
  l4:{kind:'end',title:'Realistic expectations to set',body:steps([
    {t:'What levodopa will still do',d:'Ease rigidity, bradykinesia, off-pain and comfort — worth continuing to the end in a simplified form.'},
    {t:'What it will not do',d:'Prevent falls, fix freezing while on, restore swallowing or speech, or improve cognition. Escalation for these adds hallucinations and OH.',c:'warn'},
    {t:'What the family should expect',d:'Aspiration pneumonia and falls/fractures are the usual terminal events; dementia and psychosis are common; symptom burden rivals metastatic cancer and ALS — which is the argument for aggressive symptom control, not nihilism.'},
    {t:'What helps most now',d:'Symptom control (the largest measured benefit of palliative care), caregiver support, a plan that matches the person’s goals.',c:'good'}
  ]),src:['katz','kob']},
  l5:{kind:'end',title:'Communication: REMAP when things worsen',body:steps([
    {t:'Reframe',d:'“How do you think your health is now compared with a year ago?” → “Would it be all right if I shared my sense of where you are?” → warning shot + headline: “I’m worried we’re in a different place with this illness, and time may be shorter than we hoped.” → pause → “How are you doing with this?”'},
    {t:'Expect emotion',d:'“I can’t imagine how hard this is to hear.” Give it room before any plan.'},
    {t:'Map out',d:'“When you look ahead, what are you hoping for?” Identify two or three big-picture goals and the worries behind them.'},
    {t:'Align',d:'“From what I understand, staying at home and being free of pain are the priorities.”'},
    {t:'Plan',d:'Recommend treatments that serve those goals; state that this is an ongoing conversation.',c:'good'}
  ])+callout('info','Aid-in-dying requests','Usually driven by loss of autonomy or intractable suffering, not suicidal ideation. Acknowledge the emotion, then look for a treatable driver (depression, pain). Eligibility requires decision-making capacity and a ≤6-month prognosis in permitting states; neurologists are not obliged to participate or refer.'),src:['katz']},
  l6:{kind:'end',title:'Symptom care at the end of life',body:steps([
    {t:'Dopaminergic therapy',d:'Continue the simplest effective levodopa regimen for comfort; switch to rotigotine patch or dispersible levodopa when swallowing fails; never stop abruptly.'},
    {t:'Secretions and drooling',d:'Glycopyrrolate (SC/SL), atropine drops; positioning.'},
    {t:'Agitation, hallucinations',d:'Low-dose quetiapine; environmental measures; avoid haloperidol.'},
    {t:'Pain and dyspnea',d:'Opioids titrated to effect; treat off-dystonia with dopaminergic continuity.'},
    {t:'Family',d:'Bereavement support; anticipatory guidance reduces complicated grief.'}
  ]),src:['katz','std']},
  l7:{kind:'end',title:'Clinician burnout',body:`<p>Neurology has among the highest burnout rates (about 60% of attendings, 73% of residents). Palliative care treats clinician self-care as a prerequisite for high-quality care, not a luxury. Role-played serious-illness communication training (VitalTalk, EPEC-Neurology) measurably improves both outcomes and clinician confidence.</p>`,src:['katz']}
  }
};
// ---------- Phase 8: Cases ----------
const CASES = {
  title:'Cases', intro:'Vignettes drawn from the source library. Pick the next best step; feedback explains the reasoning and points to the relevant phase.',
  items:[
  {id:'c1',v:'66-year-old woman with bipolar disorder on long-term lithium, quetiapine added 2 years ago. Action/postural tremor for 10 years attributed to lithium; over the past year rest tremor, slower gait, micrographia, dream enactment, reduced smell. Exam: bilateral action/postural/rest tremor, left-sided rigidity and bradykinesia, reduced left arm swing. She will not stop lithium.',
   q:'Next best step?',opts:[{t:'Start carbidopa/levodopa 25/100 TID empirically',ok:false,f:'Reasonable eventually, but the diagnosis is still DIP vs PD and the drugs cannot be stopped — establish it first.'},{t:'MRI brain, then dopamine transporter SPECT',ok:true,f:'Exactly. MRI excludes structural causes; DaT-SPECT separates drug-induced (normal) from degenerative parkinsonism (reduced uptake) when the offending drug must continue. Rawls Case 1-1: reduced right striatal uptake → PD; treatment deferred a year because symptoms were mild, then 25/100 TID.'},{t:'Skin biopsy for α-synuclein',ok:false,f:'Would also support a synucleinopathy, but DaT-SPECT is the established test for the DIP-vs-degenerative question and was used here.'},{t:'Stop quetiapine and reassess in 6 months',ok:false,f:'Her psychiatric stability depends on it; and lithium (which she will not stop) is also tremorgenic.'}],phase:'diagnose'},
  {id:'c2',v:'65-year-old woman, essential tremor for 27 years (propranolol partial, primidone not tolerated). Now handwriting has become small, gait slower; father had PD. Exam: bilateral action/postural tremor plus right-arm rest tremor, reduced right arm swing, mildly slower finger taps on the right.',
   q:'Best next step?',opts:[{t:'DaT-SPECT',ok:true,f:'When the exam cannot settle ET vs superimposed PD, DaT-SPECT is the right test: bilateral putamen-predominant loss, worse on the left, confirmed PD (Thaler Case 2-1). She deferred drugs for a year with PT and exercise, then started rasagiline 1 mg.'},{t:'Increase propranolol',ok:false,f:'Does nothing for the new asymmetric parkinsonism and does not answer the diagnostic question.'},{t:'Start pramipexole',ok:false,f:'Treating before diagnosing; and at 65 with mild symptoms a dopamine agonist is not the first choice.'},{t:'FDG-PET',ok:false,f:'Reserved for PD vs atypical questions; not the issue here.'}],phase:'diagnose'},
  {id:'c3',v:'65-year-old right-handed engineer: 18 months of right-hand tremor, now loss of dexterity affecting work. Dream enactment, no red flags. Started levodopa with a good response. At review: vivid dreams and disturbed sleep, constipation, low mood, and worry about the future.',

 diagnose:{
  d1:['Decrement is the discriminator. Essential tremor and functional tremor can be slow but do not decrement; PSP patients often tap small and fast from the first beat (hypokinesia without true decrement). Watch the tenth tap, not the first.',
      'Re-emergent tremor — a rest-frequency tremor that reappears several seconds after the arms are held out — is PD until proven otherwise, and is the commonest reason “ET” turns out to be PD.',
      'Asymmetry is durable: the side of onset stays the worse side for the whole course. Symmetric onset is a red flag, not a variant.',
      'Take the prodromal history at the first visit (dream enactment from the bed partner, smell, constipation, orthostatic lightheadedness). You never get a cleaner history later.'],
  d2:['Quetiapine at ≤100 mg/day rarely causes parkinsonism; above that treat it like any dopamine blocker. Aripiprazole is a partial agonist and still causes DIP.',
      'Parkinsonism that persists more than ~6 months after the drug is withdrawn is unmasked PD in roughly half of cases — these patients already had subclinical nigral loss.',
      'Valproate tremor-plus-parkinsonism in older adults is reversible and under-recognized; so is amiodarone.',
      'While a dopamine blocker continues, levodopa is often ineffective — do not judge levodopa responsiveness in a patient still taking the offending drug.'],
  d3:['Order the MRI once. Repeat it only for new red flags (falls, gaze palsy, early dementia), not for routine follow-up.',

  d5:['The red flags that matter clinically are the ones appearing in the first 2–3 years. Document eye movements, lying/standing BP, falls and cognition at every early visit so you can see them arrive.',

  d6:['A dramatic, sustained levodopa response is the single most useful supportive criterion, which is why an adequate levodopa trial is diagnostic work, not merely treatment.',

 start:{
  s2:['Levodopa-sparing buys nothing but side effects: motor complications track disease duration and dose, not years on levodopa. The honeymoon is a property of the disease stage, not of the drug start date.',
      'Over age ~70 the agonist discontinuation rate approaches one in three. The conversation about “protecting” an older patient from levodopa is usually backwards.',

  s3a:['Three tablets a day of 25/100 is a starting dose, not a target. A patient still symptomatic on 300 mg/day has not failed levodopa.',
      'Tell patients the first dose of the day goes in on waking, before getting out of bed — the morning dose sets the day, and the bedside glass of water is the simplest adherence tool there is.',

  s3b:['In the elderly every added dopaminergic drug trades motor benefit for hallucination risk; levodopa gives the best ratio, so it is the only drug most of them should be on.',
      'Measure lying/standing BP before you start and again at the first review; the lightheadedness they report after starting is usually the disease plus the drug, not the drug alone.'],
  s3c:['Young-onset patients often have dystonia as a presenting feature (foot inversion on walking); it responds to levodopa and is not a red flag.',
