<!doctype html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>PD Navigator</title>
<meta name="description" content="Parkinson disease management pathway for clinicians: diagnosis, treatment, adjustment, non-motor, advanced and late-stage care. Works offline.">
<meta name="theme-color" content="#FFFFFF" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#161F28" media="(prefers-color-scheme: dark)">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="PD Navigator">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="format-detection" content="telephone=no">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="icon" href="icons/favicon-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="stylesheet" href="fonts/fonts.css">
<style>:root{color-scheme:light}html{-webkit-text-size-adjust:100%}body{margin:0;padding:0}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style>
</head><body>
<style>
/* Layout: sticky header, left phase rail (horizontal tab strip on phones), one working column.
   A clinical pathway tool: quiet cool-grey ground, one deep teal accent, semantic stripes for strength/caution. */
:root{
  --bg:#F3F5F8; --surface:#FFFFFF; --surface-2:#E9EEF3; --fg:#15202B; --muted:#5A6B7C; --line:#D3DBE4;
  --accent:#1C5A78; --accent-ink:#FFFFFF; --accent-soft:#DCEAF1;
  --good:#1F7A4D; --good-soft:#DFF2E7; --warn:#A3680E; --warn-soft:#FBEFD3; --bad:#B13A3A; --bad-soft:#F8E0E0;
  --info:#4A5FA8; --info-soft:#E3E7F7; --std:#6E5A9E; --std-soft:#ECE6F7;
  --display:"Barlow Semi Condensed","Arial Narrow",system-ui,sans-serif;
  --body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  --r:6px; --shadow:0 1px 2px rgba(21,32,43,.06),0 4px 14px rgba(21,32,43,.05);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0E151C; --surface:#161F28; --surface-2:#1E2933; --fg:#E5ECF2; --muted:#9DAEBE; --line:#2A3743;
    --accent:#72B8D8; --accent-ink:#0A1A24; --accent-soft:#17323F;
    --good:#5EC58F; --good-soft:#153226; --warn:#E2AB4F; --warn-soft:#3A2C12; --bad:#E57A7A; --bad-soft:#3B1F1F;
    --info:#98A8EA; --info-soft:#232B45; --std:#B9A9E3; --std-soft:#2B2540;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 4px 14px rgba(0,0,0,.3);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0E151C; --surface:#161F28; --surface-2:#1E2933; --fg:#E5ECF2; --muted:#9DAEBE; --line:#2A3743;
  --accent:#72B8D8; --accent-ink:#0A1A24; --accent-soft:#17323F;
  --good:#5EC58F; --good-soft:#153226; --warn:#E2AB4F; --warn-soft:#3A2C12; --bad:#E57A7A; --bad-soft:#3B1F1F;
  --info:#98A8EA; --info-soft:#232B45; --std:#B9A9E3; --std-soft:#2B2540;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 4px 14px rgba(0,0,0,.3);
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.5;margin:0}
a{color:var(--accent)}
button{font:inherit;color:inherit}
h1,h2,h3,h4{font-family:var(--display);letter-spacing:.005em;text-wrap:balance;margin:0}
h1{font-size:1.55rem;font-weight:700;line-height:1.1}
h2{font-size:1.35rem;font-weight:600;line-height:1.15}
h3{font-size:1.1rem;font-weight:600}
h4{font-size:1rem;font-weight:600}
p{margin:.35rem 0}
code,.mono{font-family:var(--mono);font-size:.9em}
.wrap{max-width:1280px;margin:0 auto;padding-inline:16px;padding-block:0 48px}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line)}
header.top .wrap{display:flex;flex-wrap:wrap;align-items:center;gap:10px 18px;padding-block:10px}
.brand{display:flex;flex-direction:column;gap:2px;min-width:0}
.brand .sub{color:var(--muted);font-size:.86rem}
.eyebrow{font-family:var(--display);text-transform:uppercase;letter-spacing:.08em;font-size:.72rem;color:var(--muted);font-weight:600}
.spacer{flex:1}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:999px;overflow:hidden;background:var(--surface-2)}
.seg button{border:0;background:transparent;padding:6px 12px;font-size:.84rem;cursor:pointer;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.shell{display:grid;grid-template-columns:230px minmax(0,1fr);gap:22px;margin-top:18px}
nav.rail{position:sticky;top:calc(env(safe-area-inset-top,0px) + 72px);align-self:start;display:flex;flex-direction:column;gap:4px}
nav.rail button{display:grid;grid-template-columns:28px 1fr;align-items:center;gap:8px;text-align:left;border:1px solid transparent;background:transparent;border-radius:var(--r);padding:8px 10px;cursor:pointer;color:var(--fg)}
nav.rail button .n{font-family:var(--mono);font-size:.78rem;color:var(--muted);text-align:center}
nav.rail button .l{font-weight:500;font-size:.92rem}
nav.rail button .s{display:block;font-size:.76rem;color:var(--muted);font-weight:400}
nav.rail button:hover{background:var(--surface)}
nav.rail button[aria-current="page"]{background:var(--surface);border-color:var(--line);box-shadow:var(--shadow)}
nav.rail button[aria-current="page"] .n{color:var(--accent);font-weight:500}
nav.rail .divider{height:1px;background:var(--line);margin:6px 8px}
main{min-width:0}
.phase-head{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:8px 16px;margin-bottom:14px}
.phase-head p{color:var(--muted);max-width:68ch}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;box-shadow:var(--shadow)}
.card+.card{margin-top:12px}
.card.active{border-color:var(--accent)}
.card.answered{padding:10px 14px;background:var(--surface-2);box-shadow:none;display:flex;flex-wrap:wrap;align-items:center;gap:6px 12px}
.card.answered .q{color:var(--muted);font-size:.86rem}
.card.answered .a{font-weight:600}
.card.answered button{margin-left:auto;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:3px 10px;font-size:.78rem;cursor:pointer}
.stepno{font-family:var(--mono);font-size:.74rem;color:var(--muted);letter-spacing:.04em}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:8px;margin-top:12px}
.opts button{text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:10px 12px;cursor:pointer;display:flex;flex-direction:column;gap:2px;min-width:0}
.opts button:hover,.opts button:focus-visible{border-color:var(--accent);outline:none;background:var(--accent-soft)}
.opts button .ol{font-weight:600}
.opts button .oh{font-size:.8rem;color:var(--muted)}
.steps{list-style:none;padding:0;margin:10px 0 0;display:flex;flex-direction:column;gap:8px}
.steps li{display:grid;grid-template-columns:30px 1fr;gap:10px;border-left:3px solid var(--accent);padding:8px 10px 8px 12px;background:var(--surface-2);border-radius:0 var(--r) var(--r) 0}
.steps li .k{font-family:var(--mono);font-size:.8rem;color:var(--accent);padding-top:2px}
.steps li .t{font-weight:600}
.steps li .d{font-size:.9rem;color:var(--fg)}
.steps li .d p{margin:.2rem 0}
.steps li.good{border-left-color:var(--good)} .steps li.good .k{color:var(--good)}
.steps li.warn{border-left-color:var(--warn)} .steps li.warn .k{color:var(--warn)}
.steps li.bad{border-left-color:var(--bad)} .steps li.bad .k{color:var(--bad)}
.steps li.info{border-left-color:var(--info)} .steps li.info .k{color:var(--info)}
.callout{border-radius:var(--r);padding:10px 12px;margin-top:10px;font-size:.92rem;border:1px solid var(--line);background:var(--surface-2)}
.callout.warn{background:var(--warn-soft);border-color:transparent}
.callout.bad{background:var(--bad-soft);border-color:transparent}
.callout.good{background:var(--good-soft);border-color:transparent}
.callout.info{background:var(--info-soft);border-color:transparent}
.callout b:first-child{font-family:var(--display);text-transform:uppercase;letter-spacing:.06em;font-size:.74rem;display:block;margin-bottom:2px}
.chips{display:flex;flex-wrap:wrap;gap:4px;margin-top:10px}
.chip{display:inline-block;font-size:.72rem;line-height:1.3;padding:2px 8px;border-radius:999px;border:1px solid var(--line);color:var(--muted);background:var(--surface);cursor:help}
.chip.std{border-color:transparent;background:var(--std-soft);color:var(--std)}
.tag{display:inline-block;font-family:var(--display);text-transform:uppercase;letter-spacing:.06em;font-size:.7rem;font-weight:600;padding:2px 7px;border-radius:3px;background:var(--surface-2);color:var(--muted)}
.tag.good{background:var(--good-soft);color:var(--good)} .tag.warn{background:var(--warn-soft);color:var(--warn)} .tag.bad{background:var(--bad-soft);color:var(--bad)} .tag.info{background:var(--info-soft);color:var(--info)} .tag.accent{background:var(--accent-soft);color:var(--accent)}
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:12px}
.two>*{min-width:0}
table{border-collapse:collapse;width:100%;font-size:.9rem}
.tbl{overflow-x:auto;margin-top:10px}
th,td{text-align:left;vertical-align:top;padding:7px 9px;border-bottom:1px solid var(--line)}
th{font-family:var(--display);text-transform:uppercase;letter-spacing:.05em;font-size:.72rem;color:var(--muted);font-weight:600;background:var(--surface-2)}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
ul.tight{margin:.3rem 0 .3rem 1.1rem;padding:0}
ul.tight li{margin:.15rem 0}
ul.tight li::marker{color:var(--muted)}
details{border:1px solid var(--line);border-radius:var(--r);padding:8px 12px;margin-top:10px;background:var(--surface)}
details summary{cursor:pointer;font-weight:600;font-family:var(--display);font-size:.95rem}
details[open] summary{margin-bottom:6px}
.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:12px}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:7px 12px;cursor:pointer;font-size:.88rem}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.ghost{background:transparent}
.btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.sym-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:6px}
.sym-grid button{border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:8px 10px;text-align:left;cursor:pointer;font-size:.88rem}
.sym-grid button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.sym-grid button .g{display:block;font-size:.7rem;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.sym-grid button[aria-pressed="true"] .g{color:var(--accent-ink);opacity:.8}
form.engine{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px 18px}
form.engine fieldset{border:1px solid var(--line);border-radius:var(--r);padding:10px 12px;margin:0;min-width:0}
form.engine legend{font-family:var(--display);font-weight:600;padding:0 4px;font-size:.92rem}
form.engine label{display:flex;align-items:center;gap:8px;padding:3px 0;font-size:.9rem}
form.engine label.inline{display:inline-flex;margin-right:12px}
form.engine input[type=number],form.engine select{font:inherit;padding:4px 6px;border:1px solid var(--line);border-radius:4px;background:var(--surface);color:var(--fg);width:5.5em}
form.engine select{width:auto;max-width:100%}
.out{margin-top:14px}
.case-opts button{display:block;width:100%;text-align:left;margin-top:6px}
.case-opts button.correct{border-color:var(--good);background:var(--good-soft)}
.case-opts button.wrong{border-color:var(--bad);background:var(--bad-soft)}
.feedback{margin-top:10px}
.kv{display:grid;grid-template-columns:max-content 1fr;gap:4px 14px;font-size:.9rem}
.kv dt{color:var(--muted)} .kv dd{margin:0}
.check{display:flex;gap:10px;align-items:flex-start;padding:6px 0;border-bottom:1px dashed var(--line)}
.check:last-child{border-bottom:0}
.check input{margin-top:5px;accent-color:var(--accent)}
.check .ct{font-weight:500}
.check .cd{font-size:.86rem;color:var(--muted)}
.search{border:1px solid var(--line);border-radius:999px;padding:6px 12px;background:var(--surface-2);font:inherit;color:var(--fg);width:min(260px,100%)}
.hit{border-left:3px solid var(--accent);padding:6px 10px;margin-top:6px;background:var(--surface-2);font-size:.9rem;cursor:pointer;border-radius:0 var(--r) var(--r) 0}
.hit .h{font-weight:600}
.hit .w{color:var(--muted);font-size:.8rem}
.footnote{color:var(--muted);font-size:.82rem;margin-top:16px}
.led-row{display:grid;grid-template-columns:1fr 6em 5em;gap:8px;align-items:center;padding:4px 0;border-bottom:1px dashed var(--line);font-size:.9rem}
.led-row input{font:inherit;padding:3px 6px;border:1px solid var(--line);border-radius:4px;background:var(--surface);color:var(--fg);width:100%}
.led-row .f{color:var(--muted);font-family:var(--mono);font-size:.8rem;text-align:right}
.led-total{font-family:var(--display);font-size:1.3rem;margin-top:8px}
.sr{position:absolute;left:-9999px}
.pearls{margin-top:10px;border-left:3px solid var(--info);background:var(--info-soft);padding:8px 12px;border-radius:0 var(--r) var(--r) 0;font-size:.92rem}
.pearls b:first-child{font-family:var(--display);text-transform:uppercase;letter-spacing:.06em;font-size:.74rem;display:block;margin-bottom:2px;color:var(--info)}
.sim-grid{display:grid;grid-template-columns:300px minmax(0,1fr);gap:12px;align-items:start}
.sim-controls{grid-template-columns:1fr !important}
.sim-controls label input[type=checkbox]{flex:0 0 auto}
.sim-controls label.range{flex-wrap:wrap}
.sim-controls input[type=range]{accent-color:var(--accent);min-width:120px}
.sim-plot{min-width:0}
.sim-plot canvas{display:block;width:100%;max-width:100%}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:8px;margin-top:10px}
.tile{border:1px solid var(--line);border-radius:var(--r);padding:8px 10px;background:var(--surface-2)}
.tile span{display:block;font-size:.72rem;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;font-family:var(--display)}
.tile b{font-family:var(--display);font-size:1.3rem;font-variant-numeric:tabular-nums}
.tile.good{border-color:var(--good)} .tile.bad{border-color:var(--bad)} .tile.warn{border-color:var(--warn)}
.atlas-grid{display:grid;grid-template-columns:260px minmax(0,1fr);gap:12px;align-items:start}
.atlas-list{position:sticky;top:calc(env(safe-area-inset-top,0px) + 80px);max-height:calc(100vh - 100px);overflow:auto;padding:12px}
.sc-btn{display:block;width:100%;text-align:left;border:1px solid transparent;background:transparent;border-radius:var(--r);padding:6px 8px;cursor:pointer;font-size:.86rem;line-height:1.3}
.sc-btn:hover{background:var(--surface-2)}
.sc-btn[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--fg);font-weight:600}
.atlas-main{min-width:0}
.atlas-main canvas{display:block;width:100%;max-width:100%;margin-top:8px}
.fix-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}
.fix-grid .card{margin-top:0}
.fix{border-top:3px solid var(--line)}
.fix.first{border-top-color:var(--good)} .fix.alt{border-top-color:var(--info)} .fix.caution{border-top-color:var(--warn)} .fix.avoid{border-top-color:var(--bad)} .fix.observe{border-top-color:var(--muted)}
.fix h4{margin-top:6px}
.fix p{font-size:.9rem}
.fix-head{display:flex;gap:6px;align-items:center}
.fix-metrics{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:.8rem;color:var(--muted);margin-top:6px}
.fix-metrics .fm .mono{color:var(--fg)}
.nocurve{height:60px;display:flex;align-items:center;justify-content:center;border:1px dashed var(--line);border-radius:var(--r);color:var(--muted);font-size:.85rem;margin-top:8px}
@media (max-width:900px){
  .atlas-grid{grid-template-columns:1fr}
  .atlas-list{position:static;max-height:none}
  .sim-grid{grid-template-columns:1fr}
  header.top{position:static}
  header.top .eyebrow,header.top .brand .sub{display:none}
  header.top .brand h1{font-size:1.3rem}
  header.top .search{flex:1 1 100%;width:100%;order:3}
  .shell{grid-template-columns:1fr;gap:12px;margin-top:0}
  /* App-style sticky phase strip: the header scrolls away, the phases stay in reach */
  nav.rail{position:sticky;top:env(safe-area-inset-top,0px);z-index:15;flex-direction:row;overflow-x:auto;gap:6px;margin-inline:-16px;padding:8px 16px;background:var(--bg);border-bottom:1px solid var(--line);scrollbar-width:none;-webkit-overflow-scrolling:touch}
  nav.rail::-webkit-scrollbar{display:none}
  main{padding-top:6px}
  .card,details,.phase-head{scroll-margin-top:64px}
  nav.rail button{grid-template-columns:auto;flex:0 0 auto;white-space:nowrap;padding:6px 10px;border-color:var(--line);background:var(--surface)}
  nav.rail button .n{display:none} nav.rail button .s{display:none}
  nav.rail .divider{display:none}
}
@media (prefers-reduced-motion:no-preference){ .card{transition:border-color .15s} }
/* ---- App shell: safe areas, standalone tweaks, toasts ---- */
body{padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px);padding-bottom:env(safe-area-inset-bottom,0px);-webkit-tap-highlight-color:transparent;overscroll-behavior-y:none}
@media (display-mode: standalone){ header.top .brand .sub{display:none} }
.icon-btn{border:1px solid var(--line);background:var(--surface-2);border-radius:999px;width:34px;height:34px;display:inline-flex;align-items:center;justify-content:center;cursor:pointer;color:var(--muted);padding:0;flex:0 0 auto}
.icon-btn:hover{color:var(--fg)}
.icon-btn svg{width:17px;height:17px}
.toast{position:fixed;left:50%;bottom:calc(16px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:50;display:flex;align-items:center;gap:10px;background:var(--fg);color:var(--bg);border-radius:10px;padding:10px 12px 10px 14px;box-shadow:0 6px 24px rgba(0,0,0,.25);font-size:.9rem;max-width:calc(100vw - 32px);width:max-content}
.toast .tb{border:0;border-radius:6px;padding:6px 10px;font-weight:600;cursor:pointer;background:var(--accent);color:var(--accent-ink);white-space:nowrap}
.toast .tx{border:0;background:transparent;color:inherit;opacity:.7;cursor:pointer;font-size:1.1rem;line-height:1;padding:2px 4px}
.toast .ios-share{display:inline-block;vertical-align:-3px;width:16px;height:16px}
.offline-pill{display:none;font-size:.72rem;font-family:var(--display);text-transform:uppercase;letter-spacing:.06em;color:var(--warn);background:var(--warn-soft);border-radius:999px;padding:2px 8px}
html.is-offline .offline-pill{display:inline-block}
@media (max-width:640px){
  table.drugs,table.drugs tbody{display:block}
  table.drugs tr:first-child{display:none}
  table.drugs tr{display:block;border:1px solid var(--line);border-radius:var(--r);margin-top:10px;padding:4px 0;background:var(--surface)}
  table.drugs td{display:grid;grid-template-columns:6.5em 1fr;gap:8px;border-bottom:1px dashed var(--line);padding:6px 10px}
  table.drugs td:last-child{border-bottom:0}
  table.drugs td::before{content:attr(data-l);font-family:var(--display);text-transform:uppercase;letter-spacing:.05em;font-size:.7rem;color:var(--muted);font-weight:600;padding-top:2px}
  table.drugs td[data-l="Class"]{display:block;padding-bottom:0;border-bottom:0;font-size:.78rem;color:var(--muted)}
  table.drugs td[data-l="Class"]::before{content:none}
  table.drugs td[data-l="Agent"]{display:block;font-size:1.02rem;padding-top:0}
  table.drugs td[data-l="Agent"]::before{content:none}
}
</style>

<header class="top"><div class="wrap">
  <div class="brand">
    <span class="eyebrow">Clinical pathway · learning tool</span>
    <h1>PD Management Navigator</h1>
    <span class="sub">Diagnose → treat → adjust → non-motor → advanced → late stage. Every node cites its source.</span>
  </div>
  <div class="spacer"></div>
  <span class="offline-pill" title="No connection — running from the offline copy">Offline</span>
  <input id="search" class="search" type="search" placeholder="Search nodes, drugs, symptoms…" aria-label="Search" enterkeyhint="search" autocomplete="off">
  <div class="seg" role="group" aria-label="Mode">
    <button id="modeNav" aria-pressed="true">Navigator</button>
    <button id="modeRef" aria-pressed="false">Full pathway</button>
  </div>
  <button class="icon-btn" id="themeBtn" type="button" aria-label="Theme: automatic" title="Theme: automatic"></button>
</div></header>
<div id="toast" class="toast" role="status" hidden></div>

<div class="wrap"><div class="shell">
  <nav class="rail" id="rail" aria-label="Phases"></nav>
  <main id="view" aria-live="polite"></main>
</div></div>

<script>
'use strict';
// ---------- Sources ----------
const SRC = {
  rawls:  {s:'Rawls & Okun 2025', f:'Rawls A, Okun MS. Parkinson Disease. Continuum 2025;31(4):930–955.'},
  thaler: {s:'Thaler & Alcalay 2022', f:'Thaler A, Alcalay RN. Diagnosis and Medical Management of Parkinson Disease. Continuum 2022;28(5):1281–1300.'},
  kob:    {s:'Kobylecki 2025', f:'Kobylecki C. Parkinson’s disease: the follow-up consultation. Pract Neurol 2025 (pn-2025-004697).'},
  subota: {s:'Subota & Bruno 2025', f:'Subota A, Bruno V. Non-motor symptoms in Parkinson’s disease: a practical approach. Pract Neurol 2025 (pn-2025-004696).'},
  utd:    {s:'UpToDate NMS 2026', f:'Chahine LM. Management of nonmotor symptoms in Parkinson disease. UpToDate, updated Feb 2026 (full chapter).'},
  wein:   {s:'Weintraub & Irwin 2022', f:'Weintraub D, Irwin D. Diagnosis and Treatment of Cognitive and Neuropsychiatric Symptoms in PD and DLB. Continuum 2022;28(5):1314–1332.'},
  surg:   {s:'Rawls 2022 (surgical)', f:'Rawls AE. Surgical Therapies for Parkinson Disease. Continuum 2022;28(5):1301–1313.'},
  katz:   {s:'Katz 2022', f:'Katz M. Palliative Care and Movement Disorders. Continuum 2022;28(5):1520–1529.'},
  nutr:   {s:'Shuler 2026 (nutrition)', f:'Shuler MS et al. Nutrition in Parkinson’s disease: what neurologists need to know. Pract Neurol 2026 (pn-2025-004998).'},
  chah:   {s:'Chahine 2022 (prodromal)', f:'Chahine LM. Prodromal α-Synucleinopathies. Continuum 2022;28(5):1268–1280.'},
  happy:  {s:'Albers/Bloem 2026', f:'Albers C, Tosserams A, Nonnekes J, Bloem BR. Happiness in Parkinson’s disease: an overlooked concept. Pract Neurol 2026 (pn-2025-005057).'},
  mds:    {s:'MDS 2015 criteria', f:'Postuma RB et al. MDS clinical diagnostic criteria for Parkinson’s disease. Mov Disord 2015;30:1591–1601 (structure of the criteria; cited in Rawls and Thaler).'},
  std:    {s:'Standard practice', f:'Dosing or practice detail not stated in the source library; drawn from product labeling and routine movement-disorders practice. Verify against your formulary.'}
};
const chip = (keys)=> keys && keys.length ? '<div class="chips">'+keys.map(k=>{const s=SRC[k]||{s:k,f:k};return `<span class="chip ${k==='std'?'std':''}" title="${esc(s.f)}">${esc(s.s)}</span>`;}).join('')+'</div>' : '';
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
const steps = (arr)=> '<ol class="steps">'+arr.map((x,i)=>`<li class="${x.c||''}"><span class="k">${x.k||String(i+1).padStart(2,'0')}</span><div><div class="t">${x.t}</div><div class="d">${x.d||''}</div></div></li>`).join('')+'</ol>';
const callout = (cls,label,html)=> `<div class="callout ${cls}"><b>${label}</b>${html}</div>`;
const pearlsBox = (arr)=> arr&&arr.length ? `<div class="pearls"><b>Clinical pearls</b><ul class="tight">${arr.map(p=>`<li>${p}</li>`).join('')}</ul></div>` : '';
const FLOWS = {};
// ---------- Phase 1: Diagnose ----------
FLOWS.diagnose = {
  title:'Diagnose', intro:'Systematic route from “is this parkinsonism?” to a confidence-rated PD diagnosis, with ancillary tests used only where they change the answer.',
  start:'d1', order:['d1','d1b','d1c','d2','d2a','d3','d4','d4x','d5','d5x','d6','d6a','d6b','d7a','d7b','d7c','d8','d9','dpro'],
  nodes:{
  d1:{kind:'q',title:'Is this parkinsonism?',body:`<p>Parkinsonism requires <b>bradykinesia</b> plus at least one of <b>rest tremor (4–6 Hz)</b> or <b>rigidity</b>. Postural instability is a feature of parkinsonism but is <i>not</i> part of the MDS criteria because it usually appears late; early postural instability points away from PD.</p>
  <p>Bradykinesia = slowness <i>with progressive decrement</i> in amplitude or speed of repetitive movement (finger taps, hand open/close, pronation–supination, toe taps, heel taps), assessed in each limb separately. Slowness alone without decrement is not enough.</p>`,
    options:[{label:'Yes — bradykinesia with decrement, plus tremor and/or rigidity',to:'d2'},{label:'Tremor without bradykinesia (or no decrement)',to:'d1b',hint:'Essential, dystonic, enhanced physiologic, drug-induced tremor'},{label:'Not sure how to score bradykinesia',to:'d1c'}],src:['rawls','thaler','mds']},
  d1b:{kind:'end',title:'Not parkinsonism (yet)',body:`<p>Tremor alone does not make PD. Characterize the tremor and look for the features that drive the differential.</p>`+steps([
    {t:'Phenomenology',d:'Rest vs postural vs kinetic; re-emergent tremor on posture favors PD; isolated head/voice tremor favors ET; task/position specificity, null point, jerky irregular tremor favor dystonic tremor.'},
    {t:'Supportive non-motor features',d:'Hyposmia, RBD, constipation. Their complete absence after 5 years is itself an MDS red flag for PD (favors ET/dystonic tremor).'},
    {t:'No motor progression over 5 years',d:'MDS red flag — suggests essential tremor or a dystonia syndrome rather than PD.'},
    {t:'If the exam cannot separate ET from early PD',d:'Dopamine transporter SPECT is the appropriate test: abnormal in degenerative parkinsonism, normal in ET, dystonic tremor and drug-induced tremor. Re-examine in 6–12 months if not done.',c:'info'}
  ])+callout('info','Teaching point','Thaler Case 2-1: 27 years of ET, then micrographia, unilateral rest tremor and asymmetric slowing → DaT-SPECT confirmed superimposed PD.'),src:['rawls','thaler']},
  d1c:{kind:'end',title:'Scoring bradykinesia at the bedside',body:steps([
    {t:'Repetitive tasks ×10 each side',d:'Finger tapping, hand grasps, pronation–supination, toe tapping, leg agility. Watch for <b>decrement</b> (amplitude or speed falling off), hesitations and arrests — not just slowness.'},
    {t:'Global signs',d:'Reduced blink, hypomimia, hypophonia, micrographia, reduced arm swing, en-bloc turning.'},
    {t:'Rigidity',d:'Velocity-independent resistance through range; cogwheeling usual; use activation (contralateral fist clenching) to unmask.'},
    {t:'Document it',d:'MDS-UPDRS Part III or at minimum a per-limb note of bradykinesia/rigidity/tremor severity — you will need the baseline to judge levodopa response later.'}
  ])+'<p>Then return to the first question.</p>',src:['rawls','thaler','kob']},
  d2:{kind:'q',title:'Drug exposure that could explain it?',body:`<p>Drug-induced parkinsonism (DIP) can be clinically indistinguishable from PD and is reversible on withdrawal. A DRB or dopamine depleter <b>in a dose and time course consistent with DIP</b> is an absolute MDS exclusion criterion.</p>
  <ul class="tight"><li><b>Dopamine receptor blockers:</b> typical and atypical antipsychotics (haloperidol, risperidone, olanzapine, aripiprazole, also quetiapine at higher doses), metoclopramide, prochlorperazine, promethazine.</li><li><b>Depleters:</b> tetrabenazine, deutetrabenazine, valbenazine, reserpine.</li><li><b>Others:</b> flunarizine/cinnarizine, valproate, lithium (tremor), amiodarone, some SSRIs (rare).</li></ul>
  <p>Clues to DIP: symmetric onset, coarse postural/action tremor, perioral tremor, coexisting tardive movements. None is reliable on its own.</p>`,
    options:[{label:'Yes — causative drug, plausible timing',to:'d2a'},{label:'No relevant exposure',to:'d3'},{label:'Exposure present but the drug cannot be stopped',to:'d2a',hint:'e.g., psychiatric indication'}],src:['rawls','thaler','mds']},
  d2a:{kind:'end',title:'Drug-induced parkinsonism pathway',body:steps([
    {t:'Withdraw or substitute the offending agent if the prescriber agrees',d:'Switch antipsychotics to the lowest-liability option (quetiapine or clozapine) where psychiatry allows; replace metoclopramide/prochlorperazine with domperidone (where available) or ondansetron. Recovery may take weeks to months; persistence beyond ~6 months suggests unmasked underlying PD.',c:'good'},
    {t:'If the drug cannot be stopped, or recovery stalls: DaT-SPECT',d:'Normal presynaptic imaging = DIP alone (and is an MDS absolute exclusion for PD). Reduced uptake = underlying degenerative parkinsonism unmasked by the drug. DaT cannot tell PD from MSA/PSP/DLB.',c:'info'},
    {t:'Look for prodromal synucleinopathy features',d:'RBD, hyposmia, constipation and asymmetry raise the prior for underlying PD even with an exposure history.'},
    {t:'If degenerative PD is confirmed, treat as PD',d:'Levodopa works; anticholinergics/amantadine are sometimes used for pure DIP when the drug must continue.'}
  ])+callout('info','Teaching case','Rawls Case 1-1: lithium (10 y) + quetiapine (2 y), new rest tremor, RBD, hyposmia, unilateral rigidity. Lithium could not be stopped → MRI normal → DaT-SPECT reduced on the right → PD. Treatment deferred 1 year (mild), then carbidopa/levodopa 25/100 TID.'),src:['rawls','thaler','std']},
  d3:{kind:'q',title:'Structural imaging',body:`<p>MRI brain is reasonable once at diagnosis to exclude secondary parkinsonism (infarcts, iron deposition, normal pressure hydrocephalus, mass) and to look for atypical-syndrome signatures (midbrain atrophy/“hummingbird” in PSP; putaminal rim, pontine “hot-cross-bun” in MSA; asymmetric cortical atrophy in CBS). Conventional MRI is otherwise normal in PD. Loss of the nigrosome-1 “swallow-tail” sign on 3T SWI supports degeneration but is operator- and sequence-dependent.</p>
  <p>Parkinsonism restricted to the lower limbs for &gt;3 years is an absolute exclusion (vascular parkinsonism, NPH).</p>`,
    options:[{label:'MRI unremarkable or non-specific',to:'d4'},{label:'MRI shows a secondary cause',to:'d4x',hint:'Vascular, NPH, mass, iron'},{label:'MRI suggests an atypical syndrome',to:'d5x'}],src:['rawls','thaler']},
  d4:{kind:'q',title:'Absolute exclusion criteria (MDS)',body:`<p>Any one of these rules out PD regardless of other features:</p><ul class="tight">
  <li>Unequivocal cerebellar signs (gait or limb ataxia, cerebellar oculomotor signs) → MSA, ataxia syndromes</li>
  <li>Downward vertical supranuclear gaze palsy, or selective slowing of downward vertical saccades → PSP</li>
  <li>Probable bvFTD or primary progressive aphasia within 5 years of onset</li>
  <li>Parkinsonism restricted to the lower limbs &gt;3 years → vascular, NPH</li>
  <li>DRB or dopamine depleter in a dose/time course consistent with DIP</li>
  <li>No observable response to high-dose levodopa (LED ≥600 mg/d) despite at least moderate severity</li>
  <li>Unequivocal cortical sensory loss, clear limb ideomotor apraxia, or progressive aphasia → CBS/PSP/FTD</li>
  <li>Normal presynaptic dopaminergic imaging (quality- and reader-dependent)</li>
  <li>Documented alternative condition known to produce parkinsonism that plausibly explains the picture</li></ul>`,
    options:[{label:'None present',to:'d5'},{label:'At least one present',to:'d4x'}],src:['rawls','thaler','mds']},
  d4x:{kind:'end',title:'Not idiopathic PD — route by the exclusion',body:`<div class="tbl"><table><tr><th>Finding</th><th>Direction</th><th>Next step</th></tr>
  <tr><td>Cerebellar signs, stridor, early severe autonomic failure, anterocollis</td><td>MSA</td><td>Autonomic testing (lying/standing BP, bladder scan/PVR), MRI signs; levodopa trial anyway (partial response possible); early palliative framing</td></tr>
  <tr><td>Vertical gaze palsy / slow downward saccades, early falls, axial rigidity</td><td>PSP</td><td>MDS-PSP phenotyping; midbrain atrophy; levodopa trial to ≥1000 mg/d then taper if no benefit; PT, SLP (swallow) early</td></tr>
  <tr><td>Apraxia, cortical sensory loss, alien limb, myoclonus, asymmetric dystonia</td><td>CBS</td><td>Cognitive testing, FDG-PET if available; tau vs AD pathology cannot be settled clinically</td></tr>
  <tr><td>Lower-body parkinsonism, gait apraxia, urinary urgency, cognitive change</td><td>Vascular parkinsonism / NPH</td><td>MRI (Evans index, DESH, small-vessel load), large-volume LP tap test; vascular risk management</td></tr>
  <tr><td>Normal DaT-SPECT</td><td>Non-degenerative mimic</td><td>Re-examine for ET, dystonic tremor, DIP, functional parkinsonism; do not start chronic dopaminergic therapy on this basis</td></tr></table></div>
  <p>Diagnosis is revised in ~13% of “PD” over 10 years, most often in the first 2 years — keep reassessing.</p>`,src:['rawls','thaler','kob']},
  d5:{kind:'q',title:'Red flags (MDS) — how many?',body:`<p>Red flags do not exclude PD but must be counterbalanced by supportive criteria. <b>More than two red flags = PD cannot be diagnosed.</b></p><ul class="tight">
  <li>Rapid gait progression requiring a wheelchair within 5 years</li>
  <li>Complete absence of motor progression over 5 years (unless treatment-related stability)</li>
  <li>Early bulbar dysfunction (severe dysphonia/dysarthria/dysphagia) within 5 years</li>
  <li>Inspiratory respiratory dysfunction (stridor, frequent inspiratory sighs)</li>
  <li>Severe autonomic failure within 5 years (orthostatic drop ≥30/15 mmHg within 3 min, or urinary retention/incontinence not otherwise explained)</li>
  <li>Recurrent falls (&gt;1/year) due to imbalance within 3 years</li>
  <li>Disproportionate anterocollis or hand/foot contractures within 10 years</li>
  <li>Absence of any common non-motor feature despite 5 years (sleep, autonomic, hyposmia, mood)</li>
  <li>Unexplained pyramidal signs</li>
  <li>Bilateral symmetric parkinsonism from onset</li></ul>`,
    options:[{label:'0 red flags',to:'d6'},{label:'1 or 2 red flags',to:'d6',hint:'Needs ≥1 supportive criterion per red flag'},{label:'3 or more',to:'d5x'}],src:['rawls','thaler','mds']},
  d5x:{kind:'end',title:'Atypical parkinsonism workup',body:steps([
    {t:'Phenotype the syndrome',d:'Falls/gaze → PSP; autonomic/cerebellar → MSA; apraxia/cortical signs → CBS; dementia within 1 year, fluctuations, visual hallucinations → DLB.'},
    {t:'Ancillary tests that help here',d:'MRI signatures; <b>skin biopsy or CSF α-synuclein seed amplification</b> separates synucleinopathy (PD, MSA, DLB) from tauopathy (PSP, CBS); <b>MIBG</b> cardiac denervation favors PD/DLB over MSA; FDG-PET shows regional patterns. DaT-SPECT does <i>not</i> help — abnormal in all of them.',c:'info'},
    {t:'Still give levodopa a proper trial',d:'Titrate to LED ≥600 mg/d (tremor: ≥1000 mg/d) with a documented scale; partial responses occur in MSA. Taper off if no benefit — do not leave an ineffective high dose running.'},
    {t:'Plan for a faster course',d:'Earlier PT/OT/SLP, swallow surveillance, bone health, driving review, advance care planning normalized from the start (see Late stage).',c:'warn'}
  ]),src:['rawls','thaler','kob','subota']},
  d6:{kind:'q',title:'Supportive criteria — how many?',body:`<ul class="tight"><li>Clear and dramatic response to dopaminergic therapy (marked improvement with dose increase, or marked worsening with reduction; or documented ≥30% UPDRS-III change)</li><li>Levodopa-induced dyskinesia</li><li>Rest tremor of a limb (documented on exam)</li><li>Olfactory loss, <i>or</i> cardiac sympathetic denervation on MIBG scintigraphy</li></ul>
  <p>Before treatment the realistic maximum is two (rest tremor + hyposmia). Response and dyskinesia accrue over follow-up, which is why diagnostic certainty rises with time.</p>`,
    options:[{label:'≥2 supportive, 0 red flags, no exclusions',to:'d6a'},{label:'Fewer than that, or red flags present',to:'d6b'}],src:['rawls','thaler','mds']},
  d6a:{kind:'end',title:'Clinically established PD',body:`<p>Specificity-weighted category (≥90% specificity). Document the basis in the note: cardinal features by limb, supportive criteria met, exclusions and red flags reviewed. No ancillary testing is needed to treat.</p>`+steps([
    {t:'Phenotype',d:'Tremor-dominant (slower course, less cognitive decline) vs akinetic-rigid vs postural instability–gait disturbance (faster motor and cognitive decline; keep screening for atypical red flags). Phenotype can change — re-evaluate.'},
    {t:'Genetics when indicated',d:'Onset &lt;50 or positive family history → genetic counseling and testing (LRRK2, GBA1, PRKN, PINK1, SNCA, VPS35…). GBA1: more aggressive motor course and cognitive decline; relevant to DBS counseling and trial eligibility.'},
    {t:'Disclose and plan',d:'Go to <b>After the diagnosis</b>.',c:'good'}
  ]),src:['rawls','thaler','mds']},
  d6b:{kind:'q',title:'Clinically probable PD, or still uncertain',body:`<p>Clinically probable PD = no absolute exclusions, red flags counterbalanced one-for-one by supportive criteria, no more than two red flags (sensitivity- and specificity-balanced, ~80%). Specialist diagnostic accuracy is ~84%; non-specialist is lower.</p><p>Treat on clinical grounds when symptoms warrant. Reach for ancillary testing only when the result would change management. What is the uncertainty?</p>`,
    options:[{label:'Degenerative vs non-degenerative (ET, dystonic tremor, DIP, functional)',to:'d7a'},{label:'PD vs atypical parkinsonism (MSA/PSP/CBS/DLB)',to:'d7b'},{label:'NPH or vascular parkinsonism in the mix',to:'d7c'},{label:'Is the response to levodopa real?',to:'d8'},{label:'Comfortable enough to disclose and treat',to:'d9'}],src:['rawls','thaler','mds','kob']},
  d7a:{kind:'end',title:'DaT-SPECT is the right test here',body:steps([
    {t:'Order dopamine transporter SPECT',d:'~90% sensitivity for separating neurodegenerative parkinsonism from non–dopamine-deficient states (ET, dystonic tremor, DIP, functional). Asymmetric putaminal &gt; caudate loss supports degeneration.',c:'good'},
    {t:'Interpret with the clinic picture',d:'Reduced uptake does <b>not</b> tell PD from MSA, PSP, CBS or DLB. A normal scan is an MDS absolute exclusion for PD. Scans without evidence of dopaminergic deficit (SWEDD) in a tremulous patient → revisit dystonic tremor/ET.'},
    {t:'Alternative when imaging is unavailable or equivocal',d:'Time and re-examination (6–12 months); a standardized levodopa trial.',c:'info'}
  ]),src:['rawls','thaler']},
  d7b:{kind:'end',title:'PD vs atypical — tests that discriminate',body:steps([
    {t:'Skin biopsy for phosphorylated α-synuclein, or CSF/skin seed amplification assay',d:'Commercially available. Positive = synucleinopathy (PD, DLB, MSA, PAF); negative favors tauopathy (PSP, CBS) or non-degenerative. Patterns may differ between PD and MSA but this is not yet a routine discriminator. Useful early when autonomic features dominate.',c:'good'},
    {t:'MIBG cardiac scintigraphy',d:'Postganglionic sympathetic denervation supports PD/DLB; relatively preserved in MSA (preganglionic). An MDS supportive criterion.'},
    {t:'FDG-PET',d:'Regional hypometabolism patterns for PSP/MSA/CBS; limited access and cost.'},
    {t:'MRI review',d:'Midbrain/pons ratios, hummingbird, hot-cross-bun, putaminal rim, asymmetric cortical atrophy. AI-assisted 3T protocols are emerging.'},
    {t:'DaT-SPECT is not helpful',d:'Abnormal in all degenerative syndromes.',c:'warn'},
    {t:'Follow-up is the best test',d:'Red flags usually emerge within the first 2–3 years; document falls, autonomic measures, eye movements, cognition at each visit.'}
  ]),src:['rawls','thaler','kob']},
  d7c:{kind:'end',title:'NPH / vascular parkinsonism',body:steps([
    {t:'MRI with ventricular indices and small-vessel load',d:'Evans index &gt;0.3, DESH pattern, callosal angle for NPH; confluent white-matter disease or strategic lacunes for vascular parkinsonism. Lower-body predominance &gt;3 years is an MDS exclusion for PD.'},
    {t:'Large-volume LP (tap test) if NPH is plausible',d:'Timed gait before/after; refer neurosurgery if responsive.'},
    {t:'Levodopa trial still reasonable',d:'A clear response argues for coexisting PD (mixed pathology is common at older ages).',c:'info'},
    {t:'Consider α-synuclein seed amplification',d:'Thaler/Alcalay flag this exact scenario (suspected NPH, or parkinsonism on dopamine blockers) as where SAA will be most useful.'}
  ]),src:['thaler','rawls']},
  d8:{kind:'end',title:'An adequate levodopa trial',body:`<p>The levodopa challenge has never been standardized. “No response” is only meaningful if the trial was adequate.</p>`+steps([
    {t:'Dose',d:'Start low and titrate; it may take 2–3 tablets of carbidopa/levodopa 25/100 per dose. For a valid trial use <b>LED ≥600 mg/d</b>, sometimes up to <b>300 mg per dose</b>; for tremor, go to <b>≥1000 mg/d</b> before calling it unresponsive.',c:'good'},
    {t:'Duration and measurement',d:'Several weeks at target dose; score MDS-UPDRS III (or document bradykinesia, rigidity, tremor per limb) before and on treatment — tremor may not respond while other features do, and benefit is missed without a scale.'},
    {t:'If no response: check delivery before concluding',d:'Timing vs protein meals, constipation, gastroparesis (gastric emptying study if suspected), adherence, pill swallowing.',c:'warn'},
    {t:'If truly no response at ≥600 mg/d with at least moderate parkinsonism',d:'This is an MDS absolute exclusion for PD → atypical pathway. Taper the levodopa rather than leaving an ineffective dose running.',c:'bad'},
    {t:'Axial symptoms are not the yardstick',d:'Postural instability, freezing, dysarthria and dysphagia respond poorly even in PD; judge the response on limb bradykinesia and rigidity.'}
  ]),src:['rawls','thaler','kob']},
  d9:{kind:'end',title:'Disclosing the diagnosis',body:steps([
    {t:'Setting',d:'Enough time, minimal interruption, ask whether they want someone present; tissues within reach.'},
    {t:'Perception / ask-tell-ask',d:'“What do you think might be causing these symptoms?” “Have other doctors suggested a diagnosis, or have you read something that pointed you one way?”'},
    {t:'Invitation',d:'“Would it be all right if I shared my thoughts on what is causing this?” — gauge how much detail they want.'},
    {t:'Knowledge',d:'Warning shot, then one bite-size headline: “Your symptoms and examination are most consistent with Parkinson disease.” Then stop and wait.'},
    {t:'Emotions',d:'Expect and name them: “That is hard to hear. How are you doing with that?” People cannot absorb a treatment plan while flooded; defer detail to a follow-up visit if needed.'},
    {t:'Strategy',d:'“Let’s focus on helping you live as well as you can for as long as you can.” Then move to <b>After the diagnosis</b>.',c:'good'}
  ])+callout('info','Why this matters','Even a single 20-minute values conversation reduces anxiety and depression; anticipatory guidance reduces complicated grief in caregivers later. SPIKES at diagnosis; REMAP (see Late stage) when things worsen.'),src:['katz','subota']},
  dpro:{kind:'end',title:'Prodromal features — how to use them',body:`<div class="tbl"><table><tr><th>Marker</th><th>Weight</th><th>Comment</th></tr>
  <tr><td>REM sleep behavior disorder (polysomnography-confirmed)</td><td>Highest</td><td>≥50% (perhaps up to 80%) convert to a synucleinopathy long term; PD diagnosed at ~6%/year; converters split ~55% PD / 45% DLB. Exclude secondary RBD (antidepressants, narcolepsy, brainstem lesion).</td></tr>
  <tr><td>Hyposmia</td><td>Moderate</td><td>&gt;90% of PD; precedes by years–decades; non-specific (age, viral, nasal disease).</td></tr>
  <tr><td>Constipation</td><td>Low–moderate</td><td>&lt;1 spontaneous BM per 2 days or weekly laxatives; common prodrome of all synucleinopathies.</td></tr>
  <tr><td>Orthostatic lightheadedness / nOH</td><td>Moderate</td><td>May be the earliest recalled symptom; mild dysautonomia does not imply MSA.</td></tr>
  <tr><td>Subtle motor change</td><td>—</td><td>Finger tapping slows ~15 years before, other signs ~7 years before diagnosis.</td></tr></table></div>
  <p>MDS prodromal criteria are research criteria — not for clinical diagnosis or prognosis. DaT-SPECT and SAA for asymptomatic risk stratification are research-only and “may even be inappropriate”; they are appropriate to confirm clinically established disease.</p>
  <p><b>Counseling iRBD:</b> most people prefer to know; expect short-term anxiety with low long-term distress; safety measures, symptomatic treatment, exercise, research participation, periodic neurology follow-up. No proven preventive therapy.</p>`,src:['chah','rawls']}
  }
};
// ---------- Phase 2: After the diagnosis (checklist) ----------
const AFTER = {
  title:'After the diagnosis', intro:'The first two visits after disclosure. Work through it as a checklist; items tick per-browser so you can use it chairside.',
  groups:[
   {h:'Education and signposting',src:['kob','rawls','thaler'],items:[
    {t:'Written and web information tailored to the newly diagnosed',d:'Parkinson’s Foundation, APDA, Davis Phinney, Michael J. Fox Foundation. Questions differ by stage — expect them to recur.'},
    {t:'Name a point of contact',d:'A nurse/coordinator the patient can reach between visits; patients disclose non-motor symptoms more readily to a nurse than to the physician.'},
    {t:'Frame the course honestly',d:'Heterogeneous and nonlinear; tremor-dominant tends slower, PIGD/akinetic-rigid faster; no proven disease-modifying therapy; symptomatic treatment substantially improves quality of life.'},
    {t:'Pre-empt levodopa phobia',d:'Delaying levodopa does not delay fluctuations (LEAP, Ghana–Italy cohorts, PD-MED); fluctuations track disease duration and dose, not years on levodopa.'},
    {t:'Research',d:'Registries and trial finders (Fox Trial Finder, PPMI); genetic testing opens trial eligibility.'}
   ]},
   {h:'Exercise prescription (it is a treatment)',src:['kob','rawls','thaler','happy'],items:[
    {t:'Moderate-to-high intensity aerobic exercise',d:'Controlled trials show improved motor scores; combine with strength and flexibility work; continuous consistent activity beats bursts. Specify days/week and minutes, as you would a drug — the FITT table is in the Exercise deep dive below.'},
    {t:'Balance-specific work',d:'Tai chi has trial support for balance; PD-specific programs (boxing, LSVT BIG) if available.'},
    {t:'Individualize to what the person values',d:'Subjective benefit (flow, mood, stress relief) and objective capacity can diverge — ask about both. Mitigate risk rather than ban activities (e.g., supervised swimming with flotation).'}
   ]},
   {h:'Referrals to make now, not later',src:['rawls','thaler','kob','subota','nutr'],items:[
    {t:'Physical therapy',d:'Baseline, exercise prescription, gait and balance; later for falls and freezing (cueing strategies).'},
    {t:'Occupational therapy',d:'Hand function, handwriting, work tasks, home safety.'},

    {t:'Social work / financial counseling',d:'Working-age patients: occupational status, insurance, benefits.'},

FLOWS.start = {
  title:'Start treatment', intro:'Initiation logic. Levodopa is the default first drug for almost everyone; the branches are about who reasonably starts elsewhere, and how to titrate.',
  start:'s1', order:['s1','s1a','s2','s3','s3a','s3b','s3c','s3d','s4','s5','s6'],
  nodes:{
  s1:{kind:'q',title:'Do symptoms impair function or quality of life?',body:`<p>Timing and choice depend on age, comorbidity, symptom severity, side-effect profile, cost and preference. All current treatments are symptomatic.</p>`,
    options:[{label:'Yes — function, work, safety or QoL affected',to:'s2'},{label:'No — mild, not bothersome',to:'s1a'}],src:['thaler','rawls']},
  s1a:{kind:'end',title:'Defer drugs, not care',body:steps([
    {t:'Exercise prescription + PT',d:'Aerobic + strength + flexibility; balance work.'},
    {t:'Review in 3–6 months',d:'Earlier if falls, work impact or mood change. Undertreatment has costs (falls, fractures, withdrawal).',c:'warn'},
    {t:'Pre-load the medication conversation',d:'Shared decision-making over several visits is normal; address levodopa phobia before it becomes a barrier.'}
  ]),src:['rawls','thaler','kob']},
  s2:{kind:'q',title:'Any reason not to start with levodopa?',body:`<p><b>Levodopa is the most effective and best-tolerated option.</b> PD-MED (n=1620, mean age 71): small but significant QoL-mobility advantage for levodopa; discontinuation for adverse effects 2% (levodopa) vs 28% (agonist) vs 23% (MAO-B). LEAP: no difference in dyskinesia at 80 weeks between early and 40-week-delayed start; early start had better QoL. Cochrane: more adverse effects with agonists.</p>
  <p>MDS EBM rates levodopa, dopamine agonists and MAO-B inhibitors all “efficacious” as monotherapy — the differences are magnitude and tolerability, not whether they work.</p>`,
    options:[{label:'No — start levodopa',to:'s3'},{label:'Patient strongly prefers to defer levodopa / wants once-daily',to:'s4'},{label:'Tremor-dominant, young, cognitively intact, wants maximal tremor control',to:'s5'},{label:'Older, cognitively impaired, orthostatic or hallucination-prone',to:'s6'}],src:['kob','rawls','thaler']},
  s3:{kind:'q',title:'Levodopa initiation — pick the patient profile',body:`<p>Immediate-release carbidopa/levodopa 25/100 is the starting formulation. Controlled-release tablets have erratic absorption and are not for daytime initiation; extended-release capsules are for fluctuations later.</p>`,
    options:[{label:'Standard start (most patients)',to:'s3a'},{label:'Nausea-prone, frail or elderly',to:'s3b'},{label:'Young-onset (<50)',to:'s3c'},{label:'What to tell them and when to review',to:'s3d'}],src:['rawls','thaler','std']},
  s3a:{kind:'end',title:'Standard levodopa titration',body:steps([
    {t:'Carbidopa/levodopa 25/100: 1 tablet three times daily',d:'Or ½ tablet TID for the first week if nausea is a worry, then 1 tablet TID. Spacing ~every 4–5 hours while awake (e.g., 7 am / noon / 5 pm).',c:'good'},
    {t:'Reassess at 4–6 weeks',d:'Per-limb bradykinesia, rigidity, tremor against the documented baseline; ask specifically what improved and what did not.'},
    {t:'Partial response → titrate before judging',d:'Increase by ½–1 tablet per dose every 1–2 weeks toward 1½–2 tablets TID (450–600 mg/d). An inadequate trial is LED &lt;600 mg/d; for tremor, go to ≥1000 mg/d before calling it refractory.'},
    {t:'Timing with food',d:'Start with a light snack if nauseated; once tolerated, take 30–60 min before meals or ≥1 h after, away from high-protein loads. Separate from iron by ≥2 h.'},
    {t:'Carbidopa floor',d:'Keep total carbidopa ≥75 mg/d to suppress peripheral conversion (nausea, orthostasis); add carbidopa 25 mg (Lodosyn) with doses if needed.'},
    {t:'Nausea rescue',d:'Extra carbidopa; domperidone 10 mg TID where available (baseline ECG, QTc, ≤30 mg/d, shortest course); ondansetron or trimethobenzamide. <b>Never</b> metoclopramide, prochlorperazine or promethazine.',c:'bad'}
  ])+callout('info','Rawls Case 1-1','Mild PD deferred for a year, then 25/100 one tablet TID with improvement in bradykinesia and rigidity.'),src:['rawls','thaler','subota','std']},
  s3b:{kind:'end',title:'Frail, elderly or nausea-prone start',body:steps([
    {t:'½ tablet 25/100 TID with food for 1 week → 1 tablet TID',d:'Slow steps of ½ tablet per dose every 1–2 weeks. Response is still the goal; frailty is a reason for slower titration, not under-dosing.'},
    {t:'Check lying/standing BP before and after starting',d:'Levodopa can unmask OH; review antihypertensives (see Non-motor → OH).'},
    {t:'Watch for hallucinations and confusion',d:'Usually dose-related; a sense of presence or peripheral images comes first. Levodopa is the last drug you reduce for psychosis, so keep the rest of the regimen clean (no anticholinergics, no agonists).',c:'warn'},
    {t:'Pill burden and swallowing',d:'Three doses/day is realistic; consider combination products later to limit tablets.'}
  ]),src:['rawls','subota','utd','std']},
  s3c:{kind:'end',title:'Young-onset PD (onset <50)',body:steps([
    {t:'Levodopa remains a reasonable first drug',d:'Dyskinesia risk is higher with younger age and higher dose (up to 40% by 4 years) but delaying levodopa does not prevent it. Use the lowest dose that restores function; many clinicians combine a modest levodopa dose with an agonist or MAO-B inhibitor.'},
    {t:'Dopamine agonist is a legitimate alternative here',d:'Pramipexole/ropinirole/rotigotine when the patient prefers to defer levodopa and has none of the 5 A’s risk factors. Counsel on impulse control disorders (about 1 in 6; &gt;40% by 5 years of agonist use), sleep attacks, edema; screen each visit with the care partner.',c:'warn'},
    {t:'Genetic counseling and testing',d:'PRKN/PINK1 (slow, dystonia, good DBS response), GBA1 (faster cognitive course), LRRK2. Testing affects counseling and trial access.'},
    {t:'Plan for the long game',d:'Work, family, driving, finances; DBS is effective and may be considered within 1–2 years of fluctuations emerging in this group.'}
  ]),src:['rawls','thaler','kob']},
  s3d:{kind:'end',title:'Counseling at initiation and the first review',body:steps([
    {t:'What to expect',d:'Benefit builds over days to weeks; bradykinesia and rigidity respond best; tremor may need higher doses; gait/balance/speech respond least. A “honeymoon” of stable response is typical for years.'},
    {t:'What to watch for',d:'Nausea, lightheadedness on standing, vivid dreams, sleepiness; rarely hallucinations. Report rather than stop.'},
    {t:'Do not stop abruptly',d:'Abrupt withdrawal risks a parkinsonism-hyperpyrexia (NMS-like) state; this also matters for hospital admissions and NPO periods.',c:'bad'},
    {t:'Review at 4–8 weeks, then every 3–6 months',d:'Document response per feature; screen non-motor symptoms and impulsivity at every visit; MoCA yearly; lying/standing BP; weight.'},
    {t:'Medication timing in hospital',d:'Teach the patient to carry a dose list; levodopa must be given on time during admissions.'}
  ]),src:['rawls','kob','subota','std']},
  s4:{kind:'end',title:'Starting without levodopa (shared decision)',body:steps([
    {t:'MAO-B inhibitor — mild symptoms, once-daily preference',d:'Rasagiline 1 mg daily (0.5 mg to start if sensitive) or selegiline 5 mg with breakfast and lunch. Smaller effect than levodopa/agonists; well tolerated. Avoid fluoxetine/fluvoxamine; keep rasagiline ≤1 mg/d and selegiline ≤10 mg/d with other antidepressants (MAO-A selectivity lost above). No proven neuroprotection (ADAGIO not replicated).'},
    {t:'Dopamine agonist — younger, no OH, no psychiatric history, no 5 A’s',d:'Pramipexole 0.125 mg TID → increase every 5–7 days (typical 0.5–1 mg TID; ER 0.375 → 1.5–4.5 mg daily; renal dosing); ropinirole 0.25 mg TID → weekly steps (typical 2–4 mg TID; XL 2 → 8–16 mg); rotigotine patch 2 mg/24 h → 4–6 mg. Counsel: ICD (~1 in 6; &gt;40% at 5 years), somnolence/sleep attacks and driving, edema, OH, hallucinations, nausea. Screen ICD every visit with the care partner.',c:'warn'},
    {t:'Plan the levodopa add',d:'Most will need levodopa within a few years; add it when symptoms break through rather than pushing the agonist to the ceiling.'},
    {t:'Monitor more closely than a levodopa start',d:'PD-MED: 28% stopped agonists and 23% stopped MAO-B inhibitors for adverse effects.'}
  ])+callout('info','Thaler Case 2-1','Mild PD superimposed on ET: deferred drugs for a year, then rasagiline 1 mg with mild improvement — the classic MAO-B-first patient.'),src:['kob','thaler','rawls','std']},
  s5:{kind:'end',title:'Tremor-predominant: how to think',body:steps([
    {t:'Levodopa first, titrated properly',d:'Tremor is said to respond poorly; LEAP showed tremor response comparable to bradykinesia/rigidity. Push to ≥1000 mg/d before calling tremor levodopa-resistant.',c:'good'},
    {t:'Ask what the tremor actually stops them doing',d:'Action/re-emergent tremor is often more disabling than rest tremor; treat impact, not amplitude.'},
    {t:'Add-ons in order',d:'Dopamine agonist (if no contraindication) → MAO-B inhibitor/COMT inhibitor if fluctuating off-period tremor → anticholinergic only in young, cognitively intact patients who accept the risk (rarely used now) → clozapine off-label with blood monitoring.'},
    {t:'Refractory, disabling tremor → surgical referral',d:'Rest tremor responds to DBS even when levodopa-refractory (the one exception to the levodopa rule). Unilateral dominant-hand tremor in someone declining an implant → focused ultrasound thalamotomy (unilateral only).',c:'info'}
  ]),src:['kob','rawls','surg']},
  s6:{kind:'end',title:'Older, cognitively impaired, orthostatic or hallucination-prone',body:steps([
    {t:'Levodopa only',d:'Avoid dopamine agonists (psychosis, OH, somnolence, ICD), anticholinergics (cognition, retention), and be cautious with amantadine (confusion, hallucinations, edema).',c:'good'},
    {t:'Slow titration, three doses a day',d:'½ tablet TID → 1 tablet TID; reassess at 4–6 weeks; increase in ½-tablet steps.'},
    {t:'Measure, don’t assume, OH',d:'Lying/standing BP at each visit; deprescribe antihypertensives first if orthostatic.'},
    {t:'Check the rest of the list',d:'Anticholinergic burden (bladder drugs, TCAs, antihistamines, sleep aids), sedatives, benzodiazepines.',c:'warn'}
  ]),src:['rawls','subota','utd','wein']}
  }
};
// ---------- Diagnose deep dives: operational definitions and the red-flag examination ----------
FLOWS.diagnose.nodes.d1x = {kind:'end',title:'What qualifies as parkinsonism — operational definitions',body:`
 <p><b>Parkinsonism = bradykinesia + at least one of rest tremor or rigidity.</b> Bradykinesia is mandatory; tremor or rigidity alone is not parkinsonism. Postural instability is a feature of parkinsonism but is not required and, early, points away from PD. Parkinsonism is a syndrome; PD is one of its causes.</p>
 <div class="tbl"><table><tr><th>Feature</th><th>Definition that counts</th><th>How to elicit</th><th>What does not count</th></tr>
 <tr><td><b>Bradykinesia</b> (required)</td><td>Slowness of movement <i>and</i> a decrement in amplitude or speed — or progressive hesitations and arrests — as a repetitive movement continues. Must be documented in a limb, not inferred from gait or face alone.</td><td>Ten repetitions each: finger taps (index to thumb, big and fast), hand open–close, pronation–supination, toe taps, heel stomps. Watch the last five taps, not the first. Supportive: hypomimia, reduced blink, hypophonia, micrographia (progressively smaller), reduced arm swing, slow rise from a chair without using the arms.</td><td>Uniform slowness without decrement (PSP, depression, hypothyroidism, functional); small-but-regular taps; fatigue or weakness (UMN, myopathy); effortful “slow-motion” movement with variability and distractibility (functional).</td></tr>
 <tr><td><b>Rigidity</b></td><td>Velocity-independent resistance to passive movement through the range, in both directions, “lead-pipe” or with cogwheeling (tremor superimposed), not explained by spasticity or paratonia.</td><td>Wrist, elbow, neck, knee and ankle with the patient relaxed; use activation (open–close the opposite hand, Froment maneuver) to bring out subtle rigidity. Compare sides.</td><td>Spasticity (velocity-dependent, clasp-knife, with hyperreflexia); paratonia/gegenhalten (varies with the patient’s attention, worse with faster pull, common in frontal and cognitive disorders); pain-limited stiffness; cogwheeling alone with normal tone (enhanced physiologic tremor, ET).</td></tr>
 <tr><td><b>Rest tremor</b></td><td>4–6 Hz tremor in a fully supported, resting limb that attenuates with voluntary movement and re-emerges after a latency when a posture is held.</td><td>Hands in the lap with the patient distracted (serial 7s, naming months backwards), during walking (hand tremor emerges), lying on the couch for the legs; jaw and chin tremor. Note frequency and the re-emergent pattern.</td><td>Postural or kinetic tremor alone (ET, enhanced physiologic, drug-induced, dystonic); head tremor; orthostatic tremor; tremor that stops with distraction or entrains (functional).</td></tr>
 <tr><td><b>Postural instability</b> (not a criterion)</td><td>Loss of righting response on the pull test (more than two steps back, or would fall unaided).</td><td>Pull test from behind with the patient warned and prepared; the first trial is practice.</td><td>Unsteadiness from neuropathy, vestibular loss, orthostatic hypotension, or fear.</td></tr></table></div>
 <p><b>Three things to write down at the first visit:</b> which limb shows decrement; which side is worse; whether the tremor is rest, re-emergent, or action. These are your baseline for the levodopa response and the asymmetry rule.</p>
 <p><b>Causes of parkinsonism to keep in view</b> — degenerative (PD, DLB, MSA, PSP, CBS, FTD-parkinsonism), drug-induced, vascular, normal-pressure hydrocephalus, toxic (manganese, carbon monoxide, MPTP), metabolic (Wilson disease in anyone under 50, hypoparathyroidism), structural (tumour, subdural), post-encephalitic, functional.</p>
 ${pearlsBox(['The tenth tap is the test. Ask for big, fast taps and keep watching after the patient thinks you have stopped.','Re-emergent tremor appearing 5–10 seconds into arm extension is PD; immediate postural tremor is ET — and both can coexist.','Rigidity you can only feel with activation still counts, but asymmetric rigidity is worth more than symmetric rigidity.','Anyone under 50 with parkinsonism gets a ceruloplasmin, 24-hour urine copper and a slit-lamp examination before a diagnosis of PD.'])}`,src:['rawls','thaler','mds','std']};

FLOWS.diagnose.nodes.d5y = {kind:'end',title:'The red-flag examination — syndrome signatures',body:`
 <p>Red flags are not a checklist to recite; each one corresponds to something you can elicit at the bedside. Examine for all of them at the first visit and again at each of the first three years, when revisions cluster.</p>
 <div class="tbl"><table><tr><th>Syndrome</th><th>History clues</th><th>Examination — what to do and what you find</th><th>Supportive testing</th><th>Response to levodopa</th></tr>
 <tr><td><b>PSP</b> (Richardson and variants; PSP-parkinsonism can mimic PD for years)</td><td>Backward falls within 1–3 years; “reckless” rising from chairs; early dysarthria and dysphagia; apathy or disinhibition; photophobia; trouble reading or going downstairs</td><td>Slowed <i>vertical</i> saccades first (ask for fast up–down refixations between your fingers; optokinetic strip vertically) → vertical supranuclear gaze palsy that the vestibulo-ocular reflex overcomes; square-wave jerks; reduced blink and a staring, “surprised” face with procerus contraction; eyelid-opening apraxia; axial more than limb rigidity, retrocollis; symmetric akinesia; applause sign; pull test fails early; the “rocket sign” (jumps up and falls back)</td><td>MRI midbrain atrophy (hummingbird, Mickey Mouse), midbrain:pons ratio; FDG-PET frontal/midbrain; skin biopsy/SAA negative for synuclein</td><td>Poor or transient; test to ≥1000 mg/d then taper</td></tr>
 <tr><td><b>MSA</b> (parkinsonian or cerebellar)</td><td>Early syncope or lightheadedness, urinary retention or incontinence, erectile dysfunction within a few years; nocturnal stridor or “snoring that sounds different”; RBD; cold, dusky hands; rapid progression to walker/wheelchair</td><td>Orthostatic drop ≥20/10 within 3 min (≥30/15 is the MDS-PD red flag threshold); post-void residual &gt;100 mL; disproportionate antecollis, Pisa, camptocormia; jerky irregular postural tremor/polyminimyoclonus; cerebellar signs (ataxic gait, nystagmus, dysmetria); pyramidal signs (brisk reflexes, Babinski); strained dysphonia; inspiratory stridor</td><td>MRI putaminal rim and posterolateral atrophy, hot-cross-bun, pontine/MCP atrophy; MIBG relatively preserved (preganglionic); skin biopsy/SAA positive for synuclein (pattern may differ from PD)</td><td>Partial or transient in ~30%; orofacial dystonia on levodopa is characteristic</td></tr>
 <tr><td><b>Corticobasal syndrome</b></td><td>One “useless” clumsy hand or stiff leg; cannot use utensils or tools with that hand; a limb that “does its own thing”; asymmetric onset and marked asymmetry throughout</td><td>Ideomotor apraxia (pantomime brushing teeth, saluting, using scissors; imitate meaningless hand postures); cortical sensory loss (graphesthesia, stereognosis, extinction to double simultaneous stimulation); stimulus-sensitive myoclonus; limb dystonia; alien-limb phenomena; asymmetric rigidity; later aphasia or behavioural change</td><td>MRI asymmetric perirolandic/parietal atrophy; FDG-PET asymmetric hypometabolism; neuropsychology</td><td>Poor</td></tr>
 <tr><td><b>Dementia with Lewy bodies</b></td><td>Cognitive decline before or within a year of parkinsonism; fluctuating attention (“good days and bad days,” staring spells); well-formed visual hallucinations early; RBD; severe reactions to antipsychotics</td><td>Impaired attention, visuospatial and executive function out of proportion to memory; parkinsonism often symmetric and tremor-poor; examine for OH</td><td>DaT abnormal; MIBG abnormal; skin/CSF synuclein positive; FDG-PET occipital hypometabolism, cingulate island sign</td><td>Present but limited by hallucinations</td></tr>
 <tr><td><b>Vascular parkinsonism</b></td><td>Lower-body symptoms from the start, stepwise course, vascular risk factors, prior strokes</td><td>Wide-based “magnetic” gait with relatively normal arm swing and upper-body function; pyramidal signs; pseudobulbar features; little tremor</td><td>MRI confluent white-matter disease, strategic basal ganglia infarcts; DaT often normal or mildly reduced</td><td>Poor, occasionally partial</td></tr>
 <tr><td><b>Normal-pressure hydrocephalus</b></td><td>Gait first, then urgency, then cognition; symmetric; short, shuffling, wide-based steps</td><td>Gait apraxia (feet glued, better when not thinking about it), preserved arm swing, normal tone in the arms; frontal signs</td><td>MRI ventriculomegaly out of proportion to atrophy (Evans index &gt;0.3, DESH, acute callosal angle); large-volume tap test with timed gait</td><td>None</td></tr>
 <tr><td><b>Drug-induced</b></td><td>Dopamine blocker or depleter within the preceding months; symmetric onset; coexisting akathisia or tardive movements; perioral tremor</td><td>Symmetric bradykinesia and rigidity; coarse postural tremor; orofacial dyskinesia</td><td>DaT normal; resolves over weeks to months after withdrawal (if it does not, it was unmasked PD)</td><td>Limited while the drug continues</td></tr>
 <tr><td><b>Functional parkinsonism</b></td><td>Abrupt onset, often after an event; marked variability; disability out of proportion; prior functional symptoms</td><td>Slowness without decrement, effortful and variable; tremor that changes frequency, stops with distraction and entrains to tapping; give-way weakness; normal speed of incidental movements; resistance that varies with attention</td><td>DaT normal; positive signs documented on video</td><td>None, or placebo-sized</td></tr>
 <tr><td><b>Essential / dystonic tremor</b></td><td>Years to decades of action tremor; family history; alcohol responsiveness; head or voice tremor (ET); task- or position-specific, jerky, with a null point (dystonic)</td><td>Postural and kinetic tremor without decrement on tapping; no rigidity; head tremor; dystonic posturing</td><td>DaT normal</td><td>None</td></tr></table></div>
 <p><b>The absolute exclusions and red flags in the MDS criteria map onto this table.</b> When any of these signatures is present, go back to the exclusion and red-flag nodes and count. When none is present and the parkinsonism is asymmetric, levodopa-responsive and accompanied by hyposmia, RBD or constipation, you are looking at PD.</p>
 ${pearlsBox(['Test vertical saccades in everyone with parkinsonism; the slowing precedes the gaze palsy by years and it takes ten seconds.','Measure the standing blood pressure yourself at the first three visits. Early severe OH is the most useful MSA discriminator and the most often skipped.','Ask about falls in the first year and which direction: backward falls early are PSP until proven otherwise.','Apraxia is missed because nobody tests it: ask the patient to pretend to brush their teeth and to salute, both hands.','A diagnosis you revise in year two is a sign the system worked, not that the first visit failed — but only if you examined for the signatures at every visit.'])}`,src:['rawls','thaler','kob','subota','mds','std']};
