  s4:['If you prescribe an agonist, prescribe the monitoring with it: name the behaviours (gambling, shopping, eating, sex, hobbyism, internet), tell the partner what to watch for, and ask at every visit.',

 advanced:{

light weights, or your own body weight. Stand up from a chair without using your hands, ten times.</div>\n      <div class=\"k\">Balance &amp; big moves</div><div><b>2\u20133 days a week.</b> Tai chi, boxing classes designed for Parkinson\u2019s, dance, or \u201cBIG\u201d exercises taught by a physical therapist. These train the large, confident movements Parkinson\u2019s shrinks.</div>\n      <div class=\"k\">Stretch</div><div><b>10 minutes every day.</b> Stand tall against a wall, open your chest, stretch calves and hips, turn your head side to side.</div>\n    </div>\n  </div>\n  <div class=\"grid2\">\n    <ul>\n      <li><b>Join a class.</b> People who exercise with others keep going. Your physical therapist (every new patient is referred) will build a program around you \u2014 go even if you feel well.</li>\n      <li><b>Same time, same days</b> \u2014 in the calendar like an appointment; exercise when your medicine is working (about an hour after a dose).</li>\n    </ul>\n    <ul>\n      <li><b>Drink water</b> before and after; avoid the heat. <b>Never swim alone</b> \u2014 flotation vest and a watchful partner.</li>\n      <li><b>Tell us</b> about dizziness, falls or chest symptoms \u2014 they change the plan, they do not end it.</li>\n    </ul>\n  </div>\n</div>\n\n<div class=\"sec\">\n  <h2>If you are prescribed medicine</h2>\n  <div class=\"grid2\">\n    <ul>\n      <li><b>Same clock times every day.</b> Set phone alarms. Keep the first dose and a glass of water at the bedside; take it when you wake, before you get up.</li>\n      <li><b>Levodopa (carbidopa/levodopa, \u201cSinemet\u201d) works best on an empty stomach</b> \u2014 30\u201360 minutes before a meal or an hour after. If it upsets your stomach at first, take it with a few crackers; that usually passes in a week or two.</li>\n      <li><b>Never stop it suddenly</b> \u2014 stopping abruptly can make you very stiff and unwell. Call us first.</li>\n    </ul>\n    <ul>\n      <li><b>Carry a medicine list</b> with clock times to every appointment and any hospital visit. <b>In hospital</b>, ask that your Parkinson\u2019s medicines be given on time, every time.</li>\n      <li><b>Tell every prescriber and pharmacist you have Parkinson\u2019s</b>; ask the pharmacist to check new medicines, including over-the-counter sleep or allergy pills. Nausea, vivid dreams or lightheadedness at the start are usually fixable \u2014 report them, don\u2019t quit.</li>\n      <li><b>Some medicines can make Parkinson\u2019s worse</b> \u2014 ask for an alternative: metoclopramide (Reglan), prochlorperazine (Compazine), promethazine (Phenergan), haloperidol (Haldol), risperidone, olanzapine, etc. This is not a complete list.</li>\n    </ul>\n  </div>\n</div>\n\n<div class=\"sec\">\n  <h2>Tell us about these \u2014 they are part of Parkinson\u2019s, and we can help</h2>\n  <div class=\"grid3 small\" style=\"font-size:9.9pt;color:var(--ink)\">\n    <div>\u2022 Constipation<br>\u2022 Trouble sleeping, acting out dreams<br>\u2022 Dizziness when standing, fainting</div>\n    <div>\u2022 Low mood, worry, loss of motivation<br>\u2022 Memory or thinking changes<br>\u2022 Drooling, swallowing trouble, coughing with meals</div>\n    <div>\u2022 Falls or near-falls; feet \u201csticking\u201d<br>\u2022 Seeing things that aren\u2019t there<br>\u2022 New urges \u2014 gambling, shopping, eating, sex</div>\n  </div>\n</div>\n\n<!-- ============================ PAGE 2 ============================ -->\n<div class=\"page-break\"></div>\n\n<div class=\"sec\" style=\"border-top:0;margin-top:0;padding-top:0\">\n  <h2>Trusted places to learn more</h2>\n  <div class=\"grid2 res\">\n    <ul>\n      <li><b>Parkinson\u2019s Foundation</b> \u2014 parkinson.org \u00b7 Helpline <b><span style=\"white-space:nowrap\">1-800-4PD-INFO</span></b> (<span style=\"white-space:nowrap\">1-800-473-4636</span>), English and Spanish, weekdays. Free \u201cNewly Diagnosed\u201d kit, \u201cAware in Care\u201d hospital safety kit, /ul>\n    <ul>\n      <li><b>Parkinson\u2019s Programs of the Upper Valley</b> (Lebanon, NH area) \u2014 parkinsonsprograms.org. Rock Steady Boxing, \u201cStaying Active\u201d PWR! balance and strength classes, Dance for Parkinson\u2019s, Pedaling for Parkinson\u2019s.</li>\n      <li><b>Online, from home</b> \u2014 PD Health @ Home (Parkinson\u2019s Foundation), APDA virtual classes, Dance for PD at Home. Good for Vermont winters.</li>\n      <li class=\"small\">Class times and locations change \u2014 call ahead. Updated October 2026.</li>\n    </ul>\n  </div>\n</div>\n\n<div class=\"sec\">\n  <h2>Planning ahead \u2014 things people are glad they did early</h2>\n  <div class=\"grid2 res\">\n    <ul>\n      <li><b>Name a health-care agent and write an advance directive</b> while it is easy. Free Vermont forms and help: <b>Vermont Ethics Network</b>, vtethicsnetwork.org (or ask our clinic for the short form); register it with the state\u2019s Advance Directive Registry.</li>\n      <li><b>Driving.</b> Most people with Parkinson\u2019s drive safely for years. Tell us if you have had a near-miss, feel sleepy at the wheel, or your family is worried; we can arrange a formal driving evaluation. Tell the DMV and your insurer if your state requires it.</li>\n    </ul>\n    <ul>\n      <li><b>Work.</b> Talk to us before making decisions about your job; many adjustments are possible, and the timing is yours.</li>\n      <li><b>Sick days.</b> Infections (even a bladder infection) can make Parkinson\u2019s symptoms temporarily much worse. Keep taking your medicines and call us.</li>\n      <li><b>Bones.</b> Falls and fractures are preventable: ask about a vitamin D level and a bone-density test.</li>\n    </ul>\n  </div>\n</div>\n\n<div class=\"sec\">\n  <h2>For care partners</h2>\n  <p class=\"res\">You are part of the care team. You will often notice changes before the person does \u2014 sleep, mood, swallowing, memory, new habits \u2014 and we want to hear about them. Looking after yourself is not optional: care-partner groups (APDA, Parkinson\u2019s Foundation, PMD Alliance \u201cCare Partners Connect\u201d) and short breaks keep you well for the long run. If you feel exhausted, low or alone, tell us.</p>\n</div>\n\n<div class=\"sec\">\n  <div class=\"grid2\">\n    <div>\n      <h2>Bring to your next visit</h2>\n      <ul class=\"check res\">\n        <li>Your medicine list with clock times</li>\n        <li>Minutes of exercise per week (a wearable or a note on the fridge)</li>\n        <li>Two or three things you find harder than a year ago</li>\n        <li>Questions \u2014 write them down as they come to you</li>\n        <li>A family member or friend, if you can</li>\n      </ul>\n    </div>\n    <div>\n      <h2>My plan</h2>\n      <p class=\"res\" style=\"margin-bottom:3pt\">Exercise I will do this week: <span class=\"fill\" style=\"min-width:2.2in\"></span></p>\n      <p class=\"res\" style=\"margin-bottom:3pt\">Days / times: <span class=\"fill\" style=\"min-width:2.9in\"></span></p>\n      <p class=\"res\" style=\"margin-bottom:3pt\">Class or program to call: <span class=\"fill\" style=\"min-width:2.3in\"></span></p>\n      <p class=\"res\" style=\"margin-bottom:0\">Next appointment: <span class=\"fill\" style=\"min-width:2.6in\"></span></p>\n    </div>\n  </div>\n</div>\n\n<div class=\"foot\">General information, not a substitute for your own care team\u2019s advice. Resources checked October 2026 \u2014 call ahead.</div>\n\n";

  <div class="card" style="margin-top:12px"><h3>Reading the graph</h3><ul class="tight"><li><b>Solid line</b> — clinical dopaminergic effect (plasma levodopa plus storage and long-duration response). <b>Dashed</b> — plasma levodopa alone.</li><li><b>Red dashed line</b> — ON threshold; red band below it is OFF. <b>Amber dashed line</b> — dyskinesia threshold; amber band above it is peak-dose dyskinesia. The green band between is the therapeutic window.</li><li><b>Triangles</b> — doses (filled = IR, hollow = CR/ER; red = taken with a protein meal). Night is shaded.</li><li><b>Bars and labels</b> — detected events with duration; metrics count the waking day (07:00–23:00).</li></ul>${chip(['rawls','thaler','kob','nutr','std'])}</div>`;

  const writeForm=()=>{ const s=SIM.state; f.querySelector('#stage').value=s.stage; f.querySelector('#n').value=s.n; f.querySelector('#interval').value=s.interval; f.querySelector('#mg').value=s.mg; f.querySelector('#form').value=s.form; f.querySelector('#bedCR').checked=s.bedCR; f.querySelector('#meals').checked=s.meals; f.querySelector('#slowGut').checked=s.slowGut; f.querySelector('#comt').value=s.comt; f.querySelector('#maob').checked=s.maob; f.querySelector('#agonist').value=s.agonist; f.querySelector('#amantadine').checked=s.amantadine; f.querySelector('#infusion').value=s.infusion; };
  const update=()=>{
    const r=simCompute(SIM.state); SIM.last=r; document.getElementById('stageLbl').textContent=simYear(SIM.state.stage);
    simDraw(r); document.getElementById('simMetrics').innerHTML=simMetricsHTML(r);

    document.getElementById('simEvents').innerHTML = `<h3>What the graph shows</h3>`+(evs.length? '<ul class="tight">'+evs.map(e=>`<li><b>${e.label}</b> — ${fmtClock(e.start)}–${fmtClock(e.end)} (${e.day.toFixed(1)} h of the waking day)</li>`).join('')+'</ul>' : '<p>No OFF time or dyskinesia during the waking day.</p>')+
      `<p class="footnote">Peak effect ${r.metrics.peak.toFixed(2)}; trough ${r.metrics.minDay.toFixed(2)}; window ${r.Ton.toFixed(1)}–${r.Tdys.toFixed(2)} (headroom to dyskinesia ${r.metrics.headroom.toFixed(2)}).</p>`;
    const adv=simAdvice(SIM.state,r);
    document.getElementById('simAdvice').innerHTML = `<h3>Next best adjustment</h3><ol class="steps">${adv.map((a,i)=>`<li class="${a.c||''}"><span class="k">${String(i+1).padStart(2,'0')}</span><div><div class="t">${a.t}</div>${a.d?`<div class="d">${a.d}</div>`:''}${a.apply?`<button class="btn primary" data-apply="${i}" style="margin-top:6px">Apply and redraw</button>`:''}</div></li>`).join('')}</ol>`;
    document.getElementById('simAdvice').querySelectorAll('[data-apply]').forEach(b=>b.addEventListener('click',()=>{ const a=adv[+b.dataset.apply]; const before=Object.assign({},r.metrics); SIM.undo.push(JSON.parse(JSON.stringify(SIM.state))); a.apply(); writeForm(); const r2=simCompute(SIM.state); SIM.history.push({t:a.t,before,after:r2.metrics}); update(); }));
    document.getElementById('simHistory').innerHTML = `<h3>Adjustment history</h3>`+(SIM.history.length? `<div class="tbl"><table><tr><th>Step</th><th>Adjustment</th><th class="num">OFF h</th><th class="num">Dysk h</th><th class="num">Good ON h</th></tr>${SIM.history.map((h,i)=>`<tr><td>${i+1}</td><td>${h.t}</td><td class="num">${h.before.off.toFixed(1)} → <b>${h.after.off.toFixed(1)}</b></td><td class="num">${h.before.dys.toFixed(1)} → <b>${h.after.dys.toFixed(1)}</b></td><td class="num">${h.before.good.toFixed(1)} → <b>${h.after.good.toFixed(1)}</b></td></tr>`).join('')}</table></div><div class="toolbar" style="margin-top:8px"><button class="btn" id="simUndo">Undo last</button><button class="btn ghost" id="simReset">Reset preset</button></div>` : '<p class="footnote">Apply a suggestion or change a control; each step is logged here with its effect on OFF, dyskinesia and good ON hours.</p>');
    const u=document.getElementById('simUndo'); if(u) u.addEventListener('click',()=>{ const p=SIM.undo.pop(); if(p){ SIM.state=p; SIM.history.pop(); writeForm(); update(); } });
    const rs=document.getElementById('simReset'); if(rs) rs.addEventListener('click',()=>{ simLoad(SIM.state.preset||'y4'); renderSim(); });
    document.getElementById('simNarr').innerHTML = simNarrative(SIM.state,r);
  };
  f.addEventListener('input',()=>{ readForm(); update(); }); f.addEventListener('change',()=>{ readForm(); update(); });
  update();
  if(!SIM._resize){ SIM._resize=true; window.addEventListener('resize',()=>{ if(state.phase==='window' && SIM.last) simDraw(SIM.last); }); const mq=window.matchMedia('(prefers-color-scheme: dark)'); mq.addEventListener && mq.addEventListener('change',()=>{ if(state.phase==='window'&&SIM.last) simDraw(SIM.last); }); new MutationObserver(()=>{ if(state.phase==='window'&&SIM.last) simDraw(SIM.last); }).observe(document.documentElement,{attributes:true,attributeFilter:['data-theme']}); }
}
function simYear(s){ return String(Math.round(1+11*Math.pow(s,1.5))); }
function fmtClock(h){ const c=((h%24)+24)%24; const hh=Math.floor(c), mm=Math.round((c-hh)*60); const ap=hh<12?'a':'p'; const h12=hh%12===0?12:hh%12; return h12+(mm?':'+String(mm).padStart(2,'0'):'')+ap; }

  why:'Carbidopa 25 mg per 100 mg levodopa only partially saturates peripheral dopa-decarboxylase, and below ~75 mg/day of carbidopa it barely does. Each immediate-release dose therefore produces a peripheral dopamine spike that tracks the absorption peak. Nausea at the peak, not before it, is the signature; nausea before doses is an off symptom and means the opposite problem.',
  clinic:'Ask when the nausea comes relative to the dose. Peak-timed nausea in the first weeks of levodopa, on 10/100 tablets, in someone taking doses on an empty stomach because they were told to, is the typical picture. It usually fades over 1–2 weeks as tolerance develops.',
  pearls:['Nausea is the commonest reason patients quietly stop levodopa in the first month; warn them it is expected, temporary and fixable.','The curve you are treating is the peripheral one: anything that lowers or delays the absorption peak, or blocks peripheral D2, works — anything that blocks central D2 trades nausea for parkinsonism.'],
  fixes:[
   F('Extra carbidopa (carbidopa 25 mg with each dose, or switch 10/100 → 25/100)','first',s=>{s.carbidopaLow=false;s.carbidopaExtra=true;},'Saturates peripheral decarboxylase: the peripheral dopamine peak falls by more than half while the central curve is unchanged.',['Essentially none; more tablets.'],'Target total carbidopa ≥75 mg/day. This is the fix that costs nothing clinically.',{hl:'peak'}),
   F('Take the dose with a light, non-protein snack','first',s=>{s.withFood=true;},'Food slows gastric emptying and absorption: a lower, later peripheral peak.',['Onset of benefit is delayed by ~30 min and slightly blunted — acceptable in early disease, a problem later.','Do not let “with food” become “with the protein meal.”'],'A bridge for the first weeks, then move the dose back to 30–60 min before meals.',{hl:'peak'}),

   F('Metoclopramide, prochlorperazine or promethazine','avoid',s=>{s.toxShift=0.4;s.d2block=0.3;},'They do stop the nausea — by blocking D2 receptors on both sides of the blood–brain barrier. The central curve collapses and parkinsonism worsens.',['Worsened bradykinesia, rigidity and gait within days; can precipitate a severe akinetic state.'],'The graph shows why: the nausea line is cleared and the patient falls below the ON threshold all day.',{hl:'trough',hlText:'central effect collapses'})

 {id:'oh',g:'Peak-dose (early window)',title:'Lightheaded after doses (orthostatic dips at the peak)',measure:'dys',

   F('Increase each dose by ½ tablet (100 → 150 mg)','first',s=>{s.mg=150;},'Higher peaks and longer tails: each dose stays above threshold longer. Cheapest, simplest.',['None while the window is wide; reassess in 2–4 weeks.'],'',{hl:'trough'}),
   F('Add entacapone 200 mg with each dose (or opicapone 50 mg qhs)','first',s=>{s.comt='entacapone';},'Blocks peripheral COMT: longer half-life, higher AUC, lifted troughs.',['Diarrhea, orange urine (entacapone); constipation (opicapone); dyskinesia if the window narrows later — then trim doses 10–30%.'],'',{hl:'trough'}),
   F('Add rasagiline 1 mg daily','alt',s=>{s.maob=true;},'MAO-B inhibition modestly raises the whole curve.',['Small effect; interaction checks with antidepressants, tramadol, dextromethorphan, linezolid.'],'',{hl:'trough'}),
   F('Add a fourth dose (q4h instead of q5h)','alt',s=>{s.times=[7,11,15,19];},'Closes the gap between doses and covers the evening.',['Another clock time to remember.'],'',{hl:'trough'}),
   F('Add a dopamine agonist (if <70, no OH, psychosis or ICD risk)','caution',s=>{s.agonist=150;},'Tonic lift of the floor of the curve; helps non-motor off too.',['ICD (~1 in 6), somnolence, edema, OH, hallucinations; screen every visit.'],'',{hl:'trough'}),
   F('Switch the daytime doses to controlled-release 50/200','avoid',s=>{s.form='CR';s.mg=200;},'CR tablets absorb slowly and erratically (~70% bioavailability): the first dose is late to kick in and the peaks are unpredictable.',['Delayed-on in the morning, unpredictable afternoons.'],'CR belongs at bedtime, not at breakfast.',{hl:'rise',hlText:'erratic, late rise'})
  ]},
 {id:'wo_narrow',g:'Wearing-off (late window)',title:'Wearing-off with a narrow window (dyskinetic at the peak, off at the trough)',measure:'both',
  state:B(0.7,[7,11,15,19],150,{comt:'entacapone'}),
  problem:{kind:'trough',text:'The same dose crosses both thresholds: dyskinesia at the top of the curve, off at the bottom. Raising the dose adds dyskinesia; lowering it adds off. The window itself is the problem.'},
  why:'Short-duration response plus a dyskinesia threshold that has fallen close to the ON threshold. The strategy shifts from “more” to “flatter”: smaller more frequent doses, extended-release, continuous delivery — and amantadine to push the upper threshold back up.',
  clinic:'Diary shows alternating blocks of dyskinesia and off with little good on time. Ask which the patient would rather have: most choose dyskinesia, and the plan should start from that answer.',
  pearls:['This is the pattern the 5-2-1 rule was written for.','Every adjunct you add for off time will add dyskinesia unless you trim the dose at the same time.'],
  fixes:[
   F('Fractionate: 100 mg ×6 q2.5h (same 600 mg/day)','first',s=>{s.times=[7,9.5,12,14.5,17,19.5];s.mg=100;},'Smaller peaks stay under the dyskinesia line; shorter intervals keep the trough above the ON line.',['Six clock times a day; adherence; this is close to the limit of oral therapy.'],'',{hl:'peak'}),
   F('Convert to extended-release capsules (e.g., ~300 mg-equivalent TID)','first',s=>{s.form='ER';s.mg=300;s.times=[7,12,17];s.comt='none';},'Slower absorption flattens the peak and lengthens the tail; often lets you drop the COMT inhibitor.',['Daily milligrams rise; slower morning onset (add IR on waking); cost.'],'',{hl:'peak'}),
   F('Add amantadine','first',s=>{s.amantadine=true;},'Raises the dyskinesia threshold, widening the window from the top without changing off time.',['Cognition, hallucinations, livedo, edema.'],'',{hl:'threshold'}),
   F('Continuous delivery: intestinal gel (16 h) or subcutaneous infusion (24 h)','first',s=>{s.infusion='16h';},'Delivery no longer follows the half-life; the curve sits inside the band.',['PEG-J or infusion-site burden; caregiver support; B12/homocysteine with the gel.'],'The 5-2-1 pattern is the referral trigger.',{hl:'trough'}),
   F('DBS','alt',s=>{s.dbs=true;s.mg=100;s.comt='none';},'Tonic stimulation lets oral doses fall by about half; GPi directly suppresses dyskinesia.',['Candidacy: cognition, age, levodopa response ≥33%; speech and gait do not improve.'],'',{hl:'peak'}),
   F('Increase each dose to 200 mg','avoid',s=>{s.mg=200;},'Clears the off time and spends the whole day dyskinetic.',['More dyskinesia than good on time.'],'',{hl:'peak',hlText:'peak raised'})
  ]},
 {id:'morning',g:'Wearing-off (late window)',title:'Early-morning off (akinetic on waking)',measure:'offNight',night:true,
  state:B(0.6,[7.5,11.5,15.5,19.5],150),
  problem:{kind:'morning',text:'Twelve hours after the last dose the level is at its lowest of the day. The patient wakes rigid, slow, sometimes dystonic, and the first dose takes 30–60 min to work — longer if it is swallowed with breakfast.'},
  why:'The overnight gap is the longest interdose interval of the day, and gastric emptying is slowest on waking. Present in 44–69% of mild–moderate PD and disabling; routinely missed unless asked about.',
  clinic:'“How are you when you wake, compared with now?” Ask about turning in bed, getting to the bathroom, and the time from the first dose to feeling normal.',
  pearls:['The first dose goes in on waking, in bed, with water kept at the bedside — before standing, before breakfast.','Early-morning foot dystonia is an off symptom and responds to dopaminergic cover, not to muscle relaxants.'],
  fixes:[
   F('Controlled-release 50/200 at bedtime','first',s=>{s.bedCR=true;},'Slow overnight absorption lifts the 3–7 am trough.',['Overnight hallucinations in susceptible patients; occasional morning dyskinesia; erratic absorption.'],'',{hl:'night'}),
   F('First dose on waking before rising, as dispersible/ODT or crushed IR','first',s=>{s.firstFast=true;s.times=[6.5,10.5,14.5,18.5];},'Faster absorption on an empty stomach brings the morning on forward by 30–45 min.',['The whole schedule shifts earlier — cover the evening with a later last dose or a bedtime CR.'],'',{hl:'rise'}),
   F('Rotigotine patch overnight (4–8 mg/24 h)','alt',s=>{s.agonist=120;},'Transdermal tonic stimulation covers the night without a tablet.',['Skin reactions, ICD, somnolence; it also runs all day.'],'',{hl:'night'}),
   F('Extended-release levodopa capsule at bedtime','alt',s=>{s.bedER=245;},'Smoother overnight profile than CR.',['Cost; same hallucination caveat.'],'',{hl:'night'}),
   F('Apomorphine pen 2–6 mg on waking','alt',s=>{s.extras=[{clock:6.75,mg:60,form:'FAST',note:'apomorphine'}];},'Subcutaneous rescue brings the patient on in ~8 min, before the oral dose works.',['Nausea (pretreat with trimethobenzamide; never ondansetron with apomorphine), OH, injection-site nodules.'],'',{hl:'rise'}),
   F('A sedative hypnotic for the restless night','avoid',null,'Does nothing to the curve; adds falls and confusion to a night that is restless because the patient is off.',['Falls on the way to the bathroom.'],'Treat the off, not the restlessness.',{})
  ]},
 {id:'night',g:'Wearing-off (late window)',title:'Nocturnal akinesia — cannot turn in bed, leg cramps, dystonia at night',measure:'offNight',night:true,
  state:B(0.65,[7,11,15,19],150),
  problem:{kind:'night',text:'The level drifts below the ON threshold around 11 pm–midnight and stays there until morning: inability to turn, painful leg cramping or inversion of the foot, and the trips to the bathroom become falls.'},
  why:'Nocturnal off is wearing-off at the end of the longest gap. Dystonic cramping of the calf or foot at night is almost always an off phenomenon, not a primary muscle problem; true nocturnal leg cramps and restless legs are the differential.',
  clinic:'Ask the bed partner: turning, getting up, cramps, dream enactment. Distinguish off-dystonia (foot inversion, toe curling, relieved by a dose) from RLS (urge to move, relieved by moving) and from cramps (sudden, palpable contraction).',
  pearls:['The treatment for a cramp that is actually off-dystonia is a dose, not quinine or magnesium.','Nocturia and nocturnal off reinforce each other: a slow trip to the bathroom at 3 am is where hips break.'],
  fixes:[
   F('Controlled-release 50/200 at bedtime','first',s=>{s.bedCR=true;},'Covers the first half of the night.',['Hallucinations, morning dyskinesia in some.'],'',{hl:'night'}),
   F('Rotigotine patch overnight','first',s=>{s.agonist=120;},'Continuous tonic cover through the night; also helps RLS if present.',['Skin, ICD, somnolence; runs all day.'],'',{hl:'night'}),
   F('Extended-release capsule at bedtime','alt',s=>{s.bedER=245;},'Smoother than CR.',['Cost.'],'',{hl:'night'}),
   F('Move the last IR dose later (19:00 → 21:30)','alt',s=>{s.times=[7,11,15,21.5];},'Shortens the overnight gap at the cost of an afternoon gap.',['Wearing-off between 3 pm and 9:30 pm unless another dose is added.'],'',{hl:'night',hlText:'gap moved, not closed'}),
   F('Bed aids, satin sheets, bed rail; treat nocturia; scheduled toileting','observe',null,'Does not change the curve but changes the consequences of the off.',['—'],'Always alongside, never instead of, dopaminergic cover.',{}),
   F('Benzodiazepine or Z-drug for the “cramps”','avoid',null,'No effect on an off-dystonia; sedation plus akinesia equals falls.',['Falls, confusion, worse sleep architecture.'],'',{})
  ]},
 {id:'nmoff',g:'Wearing-off (late window)',title:'Non-motor off: anxiety, sweating, pain or panic before doses',measure:'off',
  state:B(0.55,[7,11,15,19],100),
  problem:{kind:'trough',text:'The level drops through the threshold and the first thing the patient notices is not slowness but dread, sweating, aching or slowed thinking — then the next dose dissolves it. Nothing on the graph distinguishes this from motor wearing-off, which is the point.'},
  why:'Dopaminergic projections to limbic and autonomic circuits fluctuate with the striatal ones. In about a third of fluctuators the non-motor off is the dominant complaint, and it is routinely treated as primary anxiety or pain.',
  clinic:'“Before your next dose is due, do you get anxious, sweaty, achy, or foggy?” Time it against the schedule. A benzodiazepine or an SSRI started for this is a diagnostic failure, not a treatment.',
  pearls:['Anxiety 30–60 min before a dose is an off until proven otherwise.','The fix is the wearing-off ladder; the antidepressant is for the anxiety that remains when the curve is flat.'],
  fixes:[
   F('Increase each dose by ½ tablet','first',s=>{s.mg=150;},'Lifts the trough; the pre-dose anxiety disappears with the motor off.',['Watch for dyskinesia if the window has narrowed.'],'',{hl:'trough'}),
   F('Add a COMT inhibitor','first',s=>{s.comt='entacapone';},'Longer tail, higher trough.',['Dyskinesia, diarrhea.'],'',{hl:'trough'}),
   F('Shorten the interval (five doses)','alt',s=>{s.times=[7,10,13,16,19];},'Closes the gap before the trough is reached.',['Pill burden.'],'',{hl:'trough'}),
   F('Dopamine agonist for the tonic floor','caution',s=>{s.agonist=150;},'Agonists help non-motor off and mood; the caveats are the usual ones.',['ICD, somnolence, OH, hallucinations.'],'',{hl:'trough'}),
   F('SSRI or benzodiazepine alone for the “anxiety”','avoid',null,'Leaves the trough exactly where it was; the symptom persists and the benzodiazepine adds falls.',['Untreated motor off; sedation.'],'',{})
  ]},
 {id:'evening',g:'Wearing-off (late window)',title:'The evening gap: last dose at 5 pm, off until bed',measure:'off',
  state:B(0.5,[7,12,17],150),
  problem:{kind:'evening',text:'Three doses spaced for the working day end at 5 pm; by 8–9 pm the level is below threshold and the evening — meals, family, television, the walk to bed — is spent off.'},
  why:'TID schedules written as breakfast/lunch/dinner leave a six-hour evening uncovered once the short-duration response takes over. Nobody complains about it because the patient is sitting down.',
  clinic:'Ask what the evenings are like and when the last dose is taken. Count hours from the last dose to bedtime.',
  pearls:['A fourth dose at 9 pm is the commonest “missing” prescription in a fluctuating patient.','Evening off is also where the falls and the nocturia-related injuries cluster.'],
  fixes:[
   F('Add a fourth dose at 9 pm','first',s=>{s.times=[7,12,17,21];},'Covers the evening and shortens the overnight gap.',['Possible evening dyskinesia or insomnia in some; usually neither.'],'',{hl:'trough'}),
   F('Entacapone with each dose to stretch the 5 pm dose','alt',s=>{s.comt='entacapone';},'Longer tail on every dose; the evening is partly covered.',['Does not fully close a 6-hour gap.'],'',{hl:'trough'}),
   F('Extended-release capsule at 5 pm instead of IR','alt',s=>{s.times=[7,12];s.extras=[{clock:17,mg:245,form:'ER',note:'ER'}];},'A slower evening dose lasts longer.',['Slower onset at 5 pm; cost.'],'',{hl:'trough'}),
   F('Rotigotine patch','caution',s=>{s.agonist=120;},'Tonic cover across the evening and night.',['Agonist caveats.'],'',{hl:'trough'}),
   F('Controlled-release 50/200 at 5 pm','caution',s=>{s.times=[7,12];s.extras=[{clock:17,mg:200,form:'CR',note:'CR'}];},'Works in some; absorption of CR in the afternoon is unpredictable.',['Delayed or absent evening on.'],'',{hl:'rise',hlText:'slow, uncertain rise'})
  ]},
 // ---------------- Delivery problems ----------------
 {id:'meals',g:'Delivery',title:'Delayed-on and dose failures after meals',measure:'off',
  state:B(0.75,[8,12.5,15.5,18.5],150,{meals:true}),
  problem:{kind:'rise',text:'Doses taken with breakfast, lunch and dinner absorb late and low: large neutral amino acids compete with levodopa for transport across the gut wall and the blood–brain barrier, and the meal slows gastric emptying. The dose climbs slowly and sometimes never clears the threshold.'},
  why:'In early disease the long-duration response hides this. Once the short-duration response dominates, every meal-timed dose becomes a delayed-on or a failure. Protein is the main culprit; fat and volume slow emptying further.',
  clinic:'Ask when doses are taken relative to meals, and whether lunch is the worst time of day. A diary with meals marked shows the pattern in a week.',
  pearls:['“Levodopa stopped working at lunchtime” is a meal, not a disease, until proven otherwise.','Protein redistribution is for fluctuators only, with a dietitian and a weighing scale.'],
  fixes:[
   F('Take each dose 30–60 min before meals (or ≥1 h after)','first',s=>{s.meals=false;s.times=[7.25,11.75,15.5,17.75];},'Absorption on an empty stomach: faster, higher, reliable.',['Nausea in some — small non-protein snack or extra carbidopa.'],'',{hl:'rise'}),
   F('Protein redistribution: protein mainly in the evening (0.8–1.0 g/kg/day total)','first',s=>{s.meals=false;},'Removes amino-acid competition during the day; evening protein coincides with the time cover matters least.',['Weight loss and dyskinesia as absorption improves — adjust doses; dietitian essential.'],'',{hl:'rise'}),
   F('Dispersible / orally disintegrating levodopa, or IR crushed in carbonated water','alt',s=>{s.form='FAST';},'Faster dissolution and absorption; partially overcomes the meal effect.',['Still competes with protein at the transporter.'],'',{hl:'rise'}),
   F('Inhaled levodopa 84 mg or apomorphine when a dose fails','alt',s=>{s.extras=[{clock:13.75,mg:84,form:'FAST',note:'inhaled'}];},'Bypasses the gut for that dose.',['Cough (inhaled); nausea and OH (apomorphine); up to 5 rescues/day.'],'',{hl:'rise'}),
   F('Switch the failing doses to controlled-release','avoid',s=>{s.form='CR';s.mg=200;},'Slower absorption on top of a meal effect: later, lower, less predictable.',['More dose failures.'],'',{hl:'rise',hlText:'later, lower rise'})
  ]},
 {id:'gut',g:'Delivery',title:'Random dose failures — constipation and gastroparesis',measure:'off',
  state:B(0.8,[7,10,13,16,19],150,{slowGut:true}),
  problem:{kind:'rise',text:'Levodopa is absorbed in the proximal small bowel; a stomach that empties slowly and a colon that is full deliver it late, low, and unpredictably. The curve climbs sluggishly after every dose.'},
  why:'Gastroparesis affects ~70% and constipation >50% of patients; both worsen with disease, with anticholinergics and opioids, and with dehydration driven by nocturia and drooling. Small-intestinal bacterial overgrowth adds a further layer.',
  clinic:'Bowel frequency, straining, early satiety, bloating. A gastric emptying study if persistent. Treating the gut shortens transit, limits peripheral conversion and often shrinks off time more than another adjunct would.',
  pearls:['The bowel is a motor organ by proxy: a PEG prescription is a wearing-off intervention.','Random off time in an advanced patient means the gut before it means the brain.'],
  fixes:[
   F('Treat constipation: polyethylene glycol 17 g daily, fluids, fibre, activity','first',s=>{s.slowGut=false;},'Restores transit and predictable absorption.',['Bloating; takes days to weeks.'],'',{hl:'rise'}),
   F('Domperidone 10 mg TID (prokinetic, where available)','alt',s=>{s.slowGut=false;},'Accelerates gastric emptying; also prevents levodopa nausea.',['QT prolongation, ≤30 mg/day, shortest course; not in the US — erythromycin is a poor substitute.'],'',{hl:'rise'}),
   F('Dispersible levodopa for the failing doses','alt',s=>{s.form='FAST';},'Faster dissolution partially compensates for slow emptying.',['Still depends on the stomach emptying.'],'',{hl:'rise'}),
   F('Subcutaneous foslevodopa/foscarbidopa (24 h) or intestinal gel (16 h) — bypass the gut','first',s=>{s.infusion='24h';},'Delivery no longer depends on gastric emptying.',['Infusion-site reactions; PEG-J complications and B12/homocysteine neuropathy with the gel.'],'This is the indication the infusions were made for.',{hl:'rise'}),
   F('Apomorphine pen for the failed dose','alt',s=>{s.extras=[{clock:14,mg:60,form:'FAST',note:'apomorphine'}];},'Subcutaneous rescue, on in ~8 min.',['Nausea, OH, nodules.'],'',{hl:'rise'}),
   F('Anticholinergic for the bladder, or an opioid for the pain','avoid',null,'Both slow the gut further; the dose failures multiply.',['More off time, more confusion.'],'',{})
  ]},
 {id:'crday',g:'Delivery',title:'Daytime controlled-release tablets — erratic afternoons',measure:'off',
  state:B(0.5,[7,12,17],200,{form:'CR'}),
  problem:{kind:'rise',text:'CR tablets dissolve slowly and unpredictably: the morning dose is late to kick in and the afternoon dose may stack on the morning one or barely show up. The curve wanders.'},
  why:'Controlled-release carbidopa/levodopa has ~70% bioavailability and an absorption profile that depends on gastric emptying and food more than IR does. The MDS evidence review rates it “insufficient evidence” as a fluctuation adjunct.',
  clinic:'Patients describe good days and bad days with the same tablets. Ask the formulation and the time to first benefit in the morning.',
  pearls:['CR is a bedtime drug. Daytime fluctuations want IR, ER capsules or a COMT inhibitor.'],
  fixes:[
   F('Switch to IR 25/100 (1½ tablets QID) by day, keep CR at bedtime','first',s=>{s.form='IR';s.mg=150;s.times=[7,11,15,19];s.bedCR=true;},'Predictable daytime absorption with the overnight cover preserved.',['Slightly shorter duration per dose than a well-absorbed CR — add a fourth dose if needed.'],'',{hl:'rise'}),
   F('Extended-release capsules (Rytary-type)','alt',s=>{s.form='ER';s.mg=245;},'Designed for predictable extended absorption, unlike CR tablets.',['Cost; slower morning onset.'],'',{hl:'rise'}),
   F('Increase the CR dose','caution',s=>{s.mg=300;},'Average off time may fall, but the variability is what the patient lives: good days dyskinetic, bad days off. A deterministic graph understates this.',['Unpredictability amplified; dyskinesia on the days absorption is complete.'],'',{hl:'peak',hlText:'bigger, erratic peaks'})
  ]},
 // ---------------- Advanced patterns ----------------
 {id:'sudden',g:'Advanced patterns',title:'Sudden, unpredictable offs — afraid to leave the house',measure:'off',
  state:B(0.85,[7,10,13,16,19],150,{meals:true}),
  problem:{kind:'rise',text:'In advanced disease, every dose is a coin toss: meals, stress and the gut decide whether it clears the threshold. The patient cannot plan the day, and that is the disability.'},
  why:'Short-duration response, narrow window, erratic absorption. Most “random” offs are dose failures with a cause; the rest are the reason on-demand therapies exist.',
  clinic:'Ask what the patient does when it happens and whether they carry anything for it. A rescue prescription changes behaviour more than any adjustment of the base regimen.',
  pearls:['Give every advanced fluctuator a rescue plan before you give them another adjunct.','The patient who carries an apomorphine pen leaves the house.'],
  fixes:[
   F('Apomorphine pen 2–6 mg at the first sign of an off','first',s=>{s.extras=[{clock:14,mg:60,form:'FAST',note:'apomorphine'},{clock:9.8,mg:60,form:'FAST',note:'apomorphine'}];},'Subcutaneous, on in ~8 min, independent of the gut.',['Nausea (pretreat), OH, nodules; up to five/day.'],'',{hl:'rise'}),
   F('Inhaled levodopa 84 mg','alt',s=>{s.extras=[{clock:14,mg:84,form:'FAST',note:'inhaled'}];},'Pulmonary absorption, on in 10–20 min.',['Cough; not in airways disease.'],'',{hl:'rise'}),
   F('Fix the base: doses 30–60 min away from meals','first',s=>{s.meals=false;},'Fewer failures to rescue.',['Nausea in some; adding a COMT inhibitor on top risks dyskinesia in this narrow window.'],'',{hl:'rise'}),
   F('Continuous delivery or DBS','first',s=>{s.infusion='24h';},'Removes the coin toss.',['Device burden; candidacy.'],'',{hl:'trough'})
  ]},
 {id:'five21',g:'Advanced patterns',title:'5-2-1: six doses a day, still off and dyskinetic',measure:'both',
  state:B(0.9,[7,9.5,12,14.5,17,19.5],150,{slowGut:true,meals:true}),
  problem:{kind:'trough',text:'Oral fractionation has reached its limit: six doses still leave hours off and hours dyskinetic, and each extra tablet adds a failure as often as a benefit. The curve cannot be kept inside the band from the mouth.'},
  why:'The window is narrow, delivery is unreliable and the short-duration response is all there is. This is the complex-stage patient the device-aided therapies were developed for — and the one who needs to be referred while cognition and axial function still allow a good outcome.',
  clinic:'Count doses, off hours and dyskinesia hours. Check cognition, falls, speech and swallowing: they decide which device, and whether any.',
  pearls:['Refer at 5-2-1, not at “nothing else has worked.”','A seventh dose is a symptom of the problem, not a treatment of it.'],
  fixes:[
   F('Levodopa-carbidopa intestinal gel (PEG-J, 16 h/day)','first',s=>{s.infusion='16h';},'Continuous jejunal delivery bypasses the stomach and the half-life; off −1.9 h, good on +1.9 h per day in trials.',['PEG-J care, tube problems, B12/homocysteine neuropathy; night uncovered unless an oral bedtime dose is added.','Usable with cognitive impairment if a caregiver runs the pump.'],'',{hl:'trough'}),
   F('Subcutaneous foslevodopa/foscarbidopa, 24 h','first',s=>{s.infusion='24h';},'Continuous delivery including the night, no surgery.',['Infusion-site reactions and nodules; 24-h device.'],'',{hl:'night'}),
   F('DBS (if cognitively intact, levodopa response ≥33%)','first',s=>{s.dbs=true;s.mg=100;s.times=[7,11,15,19];s.meals=false;},'Tonic stimulation replaces half the oral load; dyskinesia and off both shrink.',['Surgery; speech, gait and cognition do not improve; months of programming.'],'',{hl:'peak'}),
   F('A seventh dose','avoid',s=>{s.times=[7,9,11,13,15,17,19];s.mg=125;},'More failures, more crossings, no more good on time.',['Adherence collapses.'],'',{hl:'trough',hlText:'still below threshold'})
  ]}
];
SCEN.forEach(sc=>{ sc.night=!!sc.night; });

// ---- drawing ----
function drawPanel(cv,r,o){
  o=o||{}; const sm=o.size==='sm'; const W=cv.clientWidth||300; const H= sm? 190 : Math.max(300,Math.min(440,Math.round(W*0.48)));
  const dpr=window.devicePixelRatio||1; cv.width=W*dpr; cv.height=H*dpr; cv.style.height=H+'px'; const g=cv.getContext('2d'); g.setTransform(dpr,0,0,dpr,0,0);
  const col={fg:cssVar('--fg'),muted:cssVar('--muted'),line:cssVar('--line'),accent:cssVar('--accent'),good:cssVar('--good'),warn:cssVar('--warn'),bad:cssVar('--bad'),info:cssVar('--info'),surface:cssVar('--surface')};
  const ml=sm?30:46, mr=sm?8:14, mt=sm?14:30, mb=sm?26:46; const pw=W-ml-mr, ph=H-mt-mb;
  const toxCurve= r.tox.on==='P'? r.P : r.E;
  const allMax=Math.max(...r.E, ...(o.ghost?o.ghost.E:[]), ...(r.tox.on==='P'?r.P:[]));
  const ymax=Math.min(2.8,Math.max(1.8,allMax+0.3,r.tox.level+0.3)); const X=t=>ml+(t-6)/24*pw, Y=v=>mt+ph-(Math.min(v,ymax)/ymax)*ph;
  g.clearRect(0,0,W,H); g.font=(sm?'10px ':'11px ')+cssVar('--body'); g.textBaseline='middle';
  g.fillStyle=hexA(col.muted,0.08); g.fillRect(X(6),mt,X(SIM.WAKE)-X(6),ph); g.fillRect(X(SIM.SLEEP),mt,X(30)-X(SIM.SLEEP),ph);
  g.fillStyle=hexA(col.bad,0.10); g.fillRect(ml,Y(r.Ton),pw,Y(0)-Y(r.Ton));
  if(r.tox.level<ymax){ g.fillStyle=hexA(col.warn,0.14); g.fillRect(ml,mt,pw,Y(r.tox.level)-mt); }
  g.fillStyle=hexA(col.good,0.07); g.fillRect(ml,Y(Math.min(r.tox.level,ymax)),pw,Y(r.Ton)-Y(Math.min(r.tox.level,ymax)));
  g.strokeStyle=hexA(col.line,0.9); g.lineWidth=1; g.fillStyle=col.muted; g.textAlign='center';
  for(let h=6;h<=30;h+=(sm?4:2)){ g.beginPath(); g.moveTo(X(h),mt); g.lineTo(X(h),mt+ph); g.stroke(); const c=h%24; g.fillText((c===0?'12a':c<12?c+'a':c===12?'12p':(c-12)+'p'),X(h),mt+ph+10); }
  if(!sm){ g.textAlign='right'; for(let v=0;v<=ymax;v+=0.5){ g.fillText(v.toFixed(1),ml-6,Y(v)); } g.save(); g.translate(12,mt+ph/2); g.rotate(-Math.PI/2); g.textAlign='center'; g.fillText('dopaminergic effect (arbitrary units)',0,0); g.restore(); }
  // thresholds

function nodeCard(flow,node,active,idx){

function renderFlow(key){

  let html = phaseHead(flow.title, flow.intro, `<div class="toolbar"><button class="btn ghost" id="restart">Restart pathway</button></div>`);
  if(state.mode==='ref'){
    html += flow.order.filter(id=>flow.nodes[id] && flow.nodes[id].title!=='Reserved').map(id=>nodeCard(flow,flow.nodes[id],false)).join('');

    path.forEach((id,i)=>{
      const n=flow.nodes[id]; if(!n) return;

        const nextId=path[i+1]; const opt=(n.options||[]).find(o=>o.to===nextId);
        html += `<div class="card answered"><span class="q">${esc(n.title)}</span><span class="a">${opt?opt.label:'→'}</span><button data-back="${i}">Change</button></div>`;
      } else html += nodeCard(flow,n,true,i);
    });
    const visited=new Set(path);
    const others=flow.order.filter(id=>!visited.has(id) && flow.nodes[id] && flow.nodes[id].title!=='Reserved');
    if(others.length) html += `<details><summary>Other nodes in this phase (${others.length})</summary><ul class="tight">${others.map(id=>`<li><a href="#" data-jump="${id}">${esc(flow.nodes[id].title)}</a></li>`).join('')}</ul></details>`;

    const cur=flow.nodes[path[path.length-1]]; const o=cur.options[+b.dataset.opt]; if(!flow.nodes[o.to]) return; path.push(o.to); render();

  }));
  $view.querySelectorAll('[data-back]').forEach(b=>b.addEventListener('click',()=>{ state.paths[key]=path.slice(0,+b.dataset.back+1); render(); }));

  try{ const abs=new URL('handout/PD_First_Steps_Handout.pdf',location.href).href; $view.querySelectorAll('a[href="handout/PD_First_Steps_Handout.pdf"]').forEach(a=>{ a.href=abs; }); }catch(e){}
  const hv=document.getElementById('handoutView'), ht=document.getElementById('handoutToggle');
  if(ht){ ht.addEventListener('click',()=>{ if(hv.hidden){ if(!document.getElementById('handoutCss')){ const st=document.createElement('style'); st.id='handoutCss'; st.textContent=HANDOUT_CSS; document.head.appendChild(st); } hv.innerHTML='<div class="hv">'+HANDOUT_HTML+'</div><p class="footnote">On-screen version of the two-page handout. For printing or sending to a patient, use the PDF button; it is stored on this device, so it opens offline too.</p>'; hv.hidden=false; ht.textContent='Hide handout'; hv.scrollIntoView({behavior:'smooth',block:'start'}); } else { hv.hidden=true; ht.textContent='Show handout here'; } }); }
  $view.querySelectorAll('input[data-k]').forEach(c=>c.addEventListener('change',()=>{ const d=ls('pdnav-after')||{}; d[c.dataset.k]=c.checked; ls('pdnav-after',d); }));
  $view.querySelector('#clearChecks').addEventListener('click',()=>{ ls('pdnav-after',{}); render(); });
}

// ---- Adjust engine ----
function renderAdjust(){
  const groups=[...new Set(ADJ.problems.map(p=>p.g))];
  let html = phaseHead(ADJ.title, ADJ.intro);
  html += `<details class="card" style="margin-bottom:12px"><summary>How to read a fluctuating patient — five principles</summary>${ADJ.principles}${chip(['kob','rawls','thaler','surg'])}</details>`;
  html += `<form class="engine card" id="adjForm">
   <fieldset><legend>Presenting problem</legend><select id="problem" aria-label="Presenting problem">${groups.map(g=>`<optgroup label="${g}">${ADJ.problems.filter(p=>p.g===g).map(p=>`<option value="${p.id}">${p.l}</option>`).join('')}</optgroup>`).join('')}</select></fieldset>
   <fieldset><legend>Current regimen</legend>
     <label>Levodopa doses/day <input type="number" id="doses" min="0" max="12" value="4"></label>
     <label>Hours off per day <input type="number" id="offHours" min="0" max="16" step="0.5" value="1"></label>
     <label>Hours troublesome dyskinesia/day <input type="number" id="dyskHours" min="0" max="16" step="0.5" value="0"></label>
     <div><label class="inline"><input type="checkbox" id="onAgonist"> agonist</label><label class="inline"><input type="checkbox" id="onMAOB"> MAO-B inhibitor</label><label class="inline"><input type="checkbox" id="onCOMT"> COMT inhibitor</label><label class="inline"><input type="checkbox" id="onAmantadine"> amantadine</label></div>
   </fieldset>
   <fieldset><legend>Constraints</legend>
     <label><input type="checkbox" id="dysk"> Troublesome dyskinesia present</label>
     <label><input type="checkbox" id="halluc"> Hallucinations / psychosis</label>
     <label><input type="checkbox" id="cog"> Cognitive impairment</label>
     <label><input type="checkbox" id="oh"> Symptomatic orthostatic hypotension</label>
     <label><input type="checkbox" id="age70"> Age ≥ 70</label>
     <label><input type="checkbox" id="icd"> ICD history</label>
   </fieldset>
  </form><div class="out" id="adjOut"></div>
  <details><summary>When to uptitrate — beyond wearing-off and non-motor off</summary>${ADJ.uptitrate}${chip(['rawls','thaler','kob','utd','std'])}</details>
  <details><summary>How to find fluctuations in clinic</summary>${ADJ.identify}${chip(['kob'])}</details>
  <details><summary>What decides the choice of adjunct</summary>${ADJ.decides}${chip(['kob'])}</details>
  <details><summary>Evidence ratings for adjuncts</summary>${ADJ.ebm}${chip(['kob','rawls'])}</details>`;
  $view.innerHTML = html;
  const saved = ls('pdnav-adj'); const f=$view.querySelector('#adjForm');
  if(saved){ Object.keys(saved).forEach(k=>{const el=f.querySelector('#'+k); if(!el) return; if(el.type==='checkbox') el.checked=!!saved[k]; else el.value=saved[k];}); }
  const read=()=>{ const o={}; f.querySelectorAll('input,select').forEach(el=>{ o[el.id]= el.type==='checkbox'?el.checked:(el.type==='number'?+el.value:el.value); }); return o; };
  const run=()=>{ const i=read(); ls('pdnav-adj',i); const r=adjustPlan(i); const p=ADJ.problems.find(x=>x.id===i.problem);
    const presetFor={wearing:'y4',morning:'y10',delayed:'y10',sudden:'y10',peak:'y7',diphasic:'y10',offdys:'y10',inadequate:'y4'}[i.problem];
    $view.querySelector('#adjOut').innerHTML = `<article class="card active"><span class="stepno">next best steps · in order</span><h3>${esc(p.l)}</h3>${r.flags.map(x=>callout('warn','Flag',x)).join('')}${steps(r.steps)}${presetFor?`<p class="footnote"><a href="#" id="toSim">See this pattern on the therapeutic-window simulator →</a></p>`:''}${chip(r.src)}</article>`;
    const ts=$view.querySelector('#toSim'); if(ts) ts.addEventListener('click',e=>{e.preventDefault(); simLoad(presetFor); state.phase='window'; state.simTab='free'; render(); window.scrollTo({top:0});}); };
  f.addEventListener('input',run); f.addEventListener('change',run); run();
}

// ---- Non-motor ----
function renderNMS(){
  const groups=[...new Set(NMS.items.map(i=>i.g))];
  let html = phaseHead(NMS.title, NMS.intro) + callout('info','Rule',NMS.rule);
  html += '<div class="sym-grid" style="margin-top:12px">'+NMS.items.map(i=>`<button data-sym="${i.id}" aria-pressed="${state.nms===i.id}"><span class="g">${i.g}</span>${i.n}</button>`).join('')+'</div>';
  const s = NMS.items.find(i=>i.id===state.nms)||NMS.items[0];
  html += `<article class="card active" style="margin-top:12px"><span class="stepno">${esc(s.g)}</span><h3>${s.n}</h3>`+steps([
    {k:'0',t:'Dopaminergic link',d:s.fluct,c:'info'},{k:'1st',t:'First line',d:s.first,c:'good'},{k:'2nd',t:'Second line / escalation',d:s.second},{k:'✕',t:'Avoid',d:s.avoid,c:'bad'},{k:'→',t:'Refer / teaching',d:s.refer}
  ])+pearlsBox(PEARLS.nms[s.id])+chip(s.src)+'</article>';
  $view.innerHTML = html;
  $view.querySelectorAll('[data-sym]').forEach(b=>b.addEventListener('click',()=>{state.nms=b.dataset.sym; render();}));
}

// ---- Cases ----
function renderCases(){
  let html = phaseHead(CASES.title, CASES.intro);
  CASES.items.forEach(c=>{
    html += `<article class="card" id="case-${c.id}"><span class="stepno">case</span><p>${c.v}</p><h4>${c.q}</h4><div class="case-opts">${c.opts.map((o,i)=>`<button class="btn" data-case="${c.id}" data-i="${i}">${o.t}</button>`).join('')}</div><div class="feedback" id="fb-${c.id}"></div><p class="footnote">Relevant phase: <a href="#" data-go="${c.phase}">${esc(PHASES.find(p=>p.id===c.phase)?.l||c.phase)}</a></p></article>`;
  });
  $view.innerHTML = html;
  $view.querySelectorAll('[data-case]').forEach(b=>b.addEventListener('click',()=>{
    const c=CASES.items.find(x=>x.id===b.dataset.case); const o=c.opts[+b.dataset.i];
    const wrap=b.parentElement; wrap.querySelectorAll('button').forEach(x=>x.classList.remove('correct','wrong'));
    b.classList.add(o.ok?'correct':'wrong');
    document.getElementById('fb-'+c.id).innerHTML = callout(o.ok?'good':'bad', o.ok?'Correct':'Not the best step', o.f);
  }));
  $view.querySelectorAll('[data-go]').forEach(a=>a.addEventListener('click',e=>{e.preventDefault(); state.phase=a.dataset.go; render(); window.scrollTo({top:0});}));
}

// ---- Reference ----
function renderRef(){
  const q=state.drugFilter.toLowerCase();
  const rows=DRUGS.filter(d=>!q || (d.n+d.c+d.p+d.a).toLowerCase().includes(q));
  let html = phaseHead('Drug reference','Starting doses, titration, ceilings and the pearls that decide between agents. Dosing details not stated in the source library are flagged as standard practice.',
    `<div class="toolbar"><input class="search" id="drugFilter" type="search" placeholder="Filter drugs…" value="${esc(state.drugFilter)}" aria-label="Filter drugs"></div>`);
  html += `<div class="card"><div class="tbl"><table class="drugs"><tr><th>Class</th><th>Agent</th><th>Start</th><th>Titrate</th><th>Ceiling</th><th>Key adverse effects</th><th>Pearls</th></tr>${rows.map(d=>`<tr><td data-l="Class">${d.c}</td><td data-l="Agent"><b>${d.n}</b></td><td data-l="Start">${d.s}</td><td data-l="Titrate">${d.t}</td><td data-l="Ceiling">${d.m}</td><td data-l="Adverse effects">${d.a}</td><td data-l="Pearls">${d.p}</td></tr>`).join('')}</table></div>${chip(['rawls','thaler','kob','subota','utd','std'])}</div>`;
  html += `<div class="card"><h3>Drugs to avoid or handle with care</h3><div class="tbl"><table><tr><th>Avoid</th><th>Why</th><th>Use instead</th></tr>${AVOID.map(a=>`<tr><td><b>${a.d}</b></td><td>${a.w}</td><td>${a.u}</td></tr>`).join('')}</table></div>${chip(['subota','utd','rawls','wein','nutr','std'])}</div>`;
  html += `<div class="card"><h3>Levodopa-equivalent dose calculator</h3><p class="footnote" style="margin-top:0">Tomlinson 2010 conversion factors. Use it to judge trial adequacy (≥600 mg/d; tremor ≥1000 mg/d) and to plan infusion or post-DBS reductions. Enter daily amounts.</p><div id="ledRows">${LED.map((l,i)=>`<div class="led-row"><label for="led-${i}">${l.n}</label><input type="number" min="0" step="any" id="led-${i}" data-i="${i}" value="${state.led[i]??''}"><span class="f">× ${l.f}</span></div>`).join('')}</div><div class="led-total">LED: <span id="ledTotal">0</span> mg/day</div>${chip(['std'])}</div>`;
  $view.innerHTML = html;
  const fi=$view.querySelector('#drugFilter'); fi.addEventListener('input',()=>{state.drugFilter=fi.value; const pos=fi.selectionStart; render(); const n=document.getElementById('drugFilter'); n.focus(); try{n.setSelectionRange(pos,pos);}catch(e){} });
  const calc=()=>{ let t=0; $view.querySelectorAll('#ledRows input').forEach(inp=>{ const v=parseFloat(inp.value); state.led[inp.dataset.i]=inp.value; if(!isNaN(v)) t+=v*LED[+inp.dataset.i].f; }); document.getElementById('ledTotal').textContent=Math.round(t); };
  $view.querySelectorAll('#ledRows input').forEach(inp=>inp.addEventListener('input',calc)); calc();
}

// ---- Sources ----
function renderSources(){
  let html = phaseHead('Sources','Everything in this tool is tagged to one of these. Where a dosing detail was not stated in the library it is tagged “Standard practice” — verify against your formulary.');
  html += '<div class="card"><ul class="tight">'+Object.keys(SRC).map(k=>`<li><b>${esc(SRC[k].s)}</b> — ${esc(SRC[k].f)}</li>`).join('')+'</ul>'+
   callout('warn','Library note','The UpToDate exports in the PD folder for diagnosis, initial pharmacologic treatment, motor fluctuations, drug-induced parkinsonism, device-assisted procedures, nonpharmacologic management, sleep and palliative care contain only the introductory paragraphs (paywall preview). Only the nonmotor-symptoms chapter is complete. Those topics are therefore grounded on the Continuum and Practical Neurology papers; re-export the UpToDate chapters while signed in to strengthen them.')+
   '<p class="footnote">Learning tool for clinicians. It organizes published guidance; it does not replace clinical judgment or product labeling.</p></div>';
  $view.innerHTML = html;
}

// ---- Search ----
function buildIndex(){
  const idx=[];
  Object.keys(FLOWS).forEach(k=>{ const f=FLOWS[k]; f.order.forEach(id=>{ const n=f.nodes[id]; if(!n||n.title==='Reserved') return; idx.push({h:n.title,w:f.title,text:(n.title+' '+(n.body||'')).replace(/<[^>]+>/g,' '),go:()=>{state.phase=k; state.paths[k]=[id];}}); }); });
  NMS.items.forEach(s=>idx.push({h:s.n,w:'Non-motor',text:[s.n,s.fluct,s.first,s.second,s.avoid,s.refer].join(' '),go:()=>{state.phase='nms'; state.nms=s.id;}}));
  DRUGS.forEach(d=>idx.push({h:d.n,w:'Drug reference',text:[d.n,d.c,d.s,d.t,d.a,d.p].join(' '),go:()=>{state.phase='ref'; state.drugFilter=d.n.split(' ')[0];}}));
  AVOID.forEach(a=>idx.push({h:'Avoid: '+a.d,w:'Drug reference',text:a.d+' '+a.w+' '+a.u,go:()=>{state.phase='ref'; state.drugFilter='';}}));
  idx.push({h:'When to uptitrate — beyond wearing-off',w:'Adjust therapy',text:ADJ.uptitrate.replace(/<[^>]+>/g,' '),go:()=>{state.phase='adjust';}});
  SCEN.forEach(sc=>idx.push({h:'Scenario: '+sc.title,w:'Therapeutic window',text:[sc.title,sc.problem.text,sc.why,sc.clinic,sc.fixes.map(f=>f.name+' '+f.mech).join(' ')].join(' '),go:()=>{state.phase='window'; state.simTab='atlas'; state.scen=sc.id;}}));
  CASES.items.forEach(c=>idx.push({h:'Case: '+c.v.slice(0,70)+'…',w:'Cases',text:c.v+' '+c.opts.map(o=>o.t+' '+o.f).join(' '),go:()=>{state.phase='cases';}}));
  AFTER.groups.forEach(g=>g.items.forEach(it=>idx.push({h:it.t,w:'After the diagnosis',text:it.t+' '+it.d,go:()=>{state.phase='after';}})));
  (AFTER.deep||[]).forEach(d=>idx.push({h:d.h,w:'After the diagnosis',text:d.h+' '+d.body.replace(/<[^>]+>/g,' '),go:()=>{state.phase='after'; setTimeout(()=>{const el=document.getElementById('deep-'+d.id); if(el) el.scrollIntoView({behavior:'smooth',block:'start'});},50);}}));
  return idx;
}
let INDEX=null;
function renderSearch(q){
  if(!INDEX) INDEX=buildIndex();
  const terms=q.toLowerCase().split(/\s+/).filter(Boolean);
  const hits=INDEX.map(e=>{const t=e.text.toLowerCase(); const score=terms.reduce((a,w)=>a+(e.h.toLowerCase().includes(w)?3:0)+(t.includes(w)?1:0),0); return {e,score};}).filter(x=>x.score>=terms.length).sort((a,b)=>b.score-a.score).slice(0,30);
  let html = phaseHead('Search',`${hits.length} result${hits.length===1?'':'s'} for “${esc(q)}”`);
  html += hits.length? hits.map((x,i)=>`<div class="hit" data-hit="${i}"><div class="h">${esc(x.e.h)}</div><div class="w">${esc(x.e.w)}</div></div>`).join('') : '<div class="card">No matches. Try a drug name, symptom, or phrase like “wearing off”.</div>';
  $view.innerHTML = html;
  $view.querySelectorAll('[data-hit]').forEach(d=>d.addEventListener('click',()=>{ hits[+d.dataset.hit].e.go(); document.getElementById('search').value=''; render(); window.scrollTo({top:0}); }));
}

// ---- Main render ----
function render(){
  try{ if(location.hash!=='#'+state.phase) history.replaceState(null,'','#'+state.phase); }catch(e){}
  saveState();
  renderRail();
  const q=document.getElementById('search').value.trim();
  if(q.length>=2){ renderSearch(q); return; }
  switch(state.phase){
    case 'after': renderAfter(); break;
    case 'window': renderWindow(); break;
    case 'adjust': renderAdjust(); break;
    case 'nms': renderNMS(); break;
    case 'cases': renderCases(); break;
    case 'ref': renderRef(); break;
    case 'sources': renderSources(); break;
    default: renderFlow(state.phase);
  }
}
document.getElementById('search').addEventListener('input',()=>render());
document.getElementById('modeNav').addEventListener('click',()=>{state.mode='nav'; setMode();});
document.getElementById('modeRef').addEventListener('click',()=>{state.mode='ref'; setMode();});
function setMode(){ document.getElementById('modeNav').setAttribute('aria-pressed',state.mode==='nav'); document.getElementById('modeRef').setAttribute('aria-pressed',state.mode==='ref'); render(); }
window.addEventListener('hashchange',()=>{ const h=location.hash.replace('#',''); if(PHASES.some(p=>p.id===h&&p.id!=='div')){ state.phase=h; render(); } });

// ---------- App shell: theme, offline, install, updates ----------
const THEME_ICONS={
  auto:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="8"/><path d="M12 4a8 8 0 0 1 0 16z" fill="currentColor"/></svg>',
  light:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>',
  dark:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/></svg>'};
function applyTheme(t){
  const root=document.documentElement; if(t==='auto') root.removeAttribute('data-theme'); else root.setAttribute('data-theme',t);
  const b=document.getElementById('themeBtn'); b.innerHTML=THEME_ICONS[t]; b.setAttribute('aria-label','Theme: '+(t==='auto'?'automatic':t)); b.title='Theme: '+(t==='auto'?'automatic (follows device)':t);
  const dark = t==='dark' || (t==='auto' && matchMedia('(prefers-color-scheme: dark)').matches);
  document.querySelectorAll('meta[name="theme-color"]').forEach(m=>{ m.setAttribute('content', dark?'#161F28':'#FFFFFF'); m.removeAttribute('media'); });
}
let theme = ls('pdnav-theme')||'auto';
applyTheme(theme);
document.getElementById('themeBtn').addEventListener('click',()=>{ theme={auto:'light',light:'dark',dark:'auto'}[theme]; ls('pdnav-theme',theme); applyTheme(theme); });
matchMedia('(prefers-color-scheme: dark)').addEventListener?.('change',()=>applyTheme(theme));

const $toast=document.getElementById('toast'); let toastTimer=null;
function toast(html,{action,onAction,sticky,onClose}={}){
  clearTimeout(toastTimer);
  $toast.innerHTML=`<span>${html}</span>${action?`<button class="tb" type="button">${action}</button>`:''}<button class="tx" type="button" aria-label="Dismiss">×</button>`;
  $toast.hidden=false;
  const close=()=>{ $toast.hidden=true; if(onClose) onClose(); };
  if(action) $toast.querySelector('.tb').addEventListener('click',()=>{ $toast.hidden=true; onAction&&onAction(); });
  $toast.querySelector('.tx').addEventListener('click',close);
  if(!sticky) toastTimer=setTimeout(()=>{ $toast.hidden=true; },4500);
}
const setOnline=()=>document.documentElement.classList.toggle('is-offline',!navigator.onLine);
addEventListener('online',setOnline); addEventListener('offline',setOnline); setOnline();

const standalone = matchMedia('(display-mode: standalone)').matches || navigator.standalone===true;
// Android / desktop Chrome: offer a one-tap install
let deferredInstall=null;
addEventListener('beforeinstallprompt',e=>{ e.preventDefault(); deferredInstall=e; if(ls('pdnav-install-dismissed')) return;
  toast('Install PD Navigator for offline use',{action:'Install',sticky:true,onAction:async()=>{ deferredInstall.prompt(); await deferredInstall.userChoice; deferredInstall=null; },onClose:()=>ls('pdnav-install-dismissed',1)}); });
// iOS Safari has no install prompt: show the Add to Home Screen hint once
(function(){ const ua=navigator.userAgent; const ios=/iPhone|iPad|iPod/.test(ua)||(ua.includes('Macintosh')&&navigator.maxTouchPoints>1);
  if(ios && !standalone && !ls('pdnav-ios-hint')) setTimeout(()=>toast('Install: tap <svg class="ios-share" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12M8 7l4-4 4 4"/><path d="M5 11v9h14v-9"/></svg> Share, then <b>Add to Home Screen</b>',{sticky:true,onClose:()=>ls('pdnav-ios-hint',1)}),1500); })();

if('serviceWorker' in navigator && location.protocol!=='file:'){
  addEventListener('load',()=>{
    const hadController=!!navigator.serviceWorker.controller;
    navigator.serviceWorker.register('sw.js').then(reg=>{
      const offerUpdate=w=>toast('An updated version is ready',{action:'Reload',sticky:true,onAction:()=>w.postMessage('skipWaiting')});
      if(reg.waiting && hadController) offerUpdate(reg.waiting);
      reg.addEventListener('updatefound',()=>{ const w=reg.installing; if(!w) return; w.addEventListener('statechange',()=>{
        if(w.state==='installed'){ if(hadController) offerUpdate(w); else if(!ls('pdnav-offline-ready')){ ls('pdnav-offline-ready',1); toast('Saved for offline use'); } } }); });
      // check for new content when the app comes back to the foreground
      document.addEventListener('visibilitychange',()=>{ if(document.visibilityState==='visible') reg.update().catch(()=>{}); });
    }).catch(()=>{});
    let reloading=false;
    navigator.serviceWorker.addEventListener('controllerchange',()=>{ if(hadController && !reloading){ reloading=true; location.reload(); } });
  });
}

setMode();
